\n<td><strong>Ask<\/strong><\/td>\n<td>recherchiert, vergleicht<\/td>\n<td>Whitepaper, Webinar-Einladung, FAQ-Chatbot<\/td>\n<\/tr>\n<tr>\n<td><strong>Act<\/strong><\/td>\n<td>kauft<\/td>\n<td>Warenkorb-Erinnerung, Angebote, Vertrags-Workflows<\/td>\n<\/tr>\n<tr>\n<td><strong>Advocate<\/strong><\/td>\n<td>empfiehlt weiter<\/td>\n<td>Loyalty-Programm, Bewertungsanfragen, Referral-Kampagnen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Das 5A-Modell löst lineare Modelle wie AIDA ab, weil es vernetzte Kund:innen berücksichtigt, die aktiv recherchieren und Erfahrungen teilen.<\/p>\n<p><strong>Bitrix24-Praxis:<\/strong> Leads per Formular/Ads automatisch erfassen · Lead-Routing-Regeln · Kanban-Pipeline · Automatisierungsregeln (z. B. Follow-up nach 5 Tagen ohne Antwort). In der Übung: Board „Leads“ (Marketing) → Lead als „Guter Lead“ markieren → erscheint automatisch im Board „Aufträge“ (Vertrieb) mit Benachrichtigung. ⚠️ Der Trigger gehört in die <strong>Zielphase<\/strong>, nicht in die Ausgangsphase.<\/p>\n<hr />\n<h2>7 · Brücke zwischen Marketing &amp; Vertrieb<\/h2>\n<p><strong>Das Problem:<\/strong> Marketing denkt in Reichweite und Leads, Vertrieb in Abschlüssen und Umsatz. „Wir liefern gute Leads“ vs. „Die Leads sind unbrauchbar“ → verlorene Leads, längere Sales-Zyklen, Frust.<\/p>\n<p><strong>CRM als Brücke:<\/strong> zentrale Datenbasis · Transparenz über Status und Historie · standardisierte Übergabe <strong>MQL → SQL<\/strong> · gemeinsames Reporting.<\/p>\n<p><strong>Leadquellen:<\/strong> Owned (Formulare, Downloads) · Paid (Google, Meta, LinkedIn Lead Ads) · Earned (Empfehlungen, Shares) · Offline/Hybrid (Messen, Webinare).<\/p>\n<h3>Lead-Scoring<\/h3>\n<table>\n<thead>\n<tr>\n<th>Klassisch (regelbasiert)<\/th>\n<th>KI-basiert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>feste Punkte, z. B. E-Mail geöffnet +5, Whitepaper +10, Beratung gebucht +50<\/td>\n<td>Machine Learning auf historischen Abschlussdaten<\/td>\n<\/tr>\n<tr>\n<td>fester Schwellenwert (z. B. ab 70 Punkten → Vertrieb)<\/td>\n<td>dynamische Gewichtung (Webinar zählt mehr als Newsletter-Öffnung), mehrdimensionale Muster<\/td>\n<\/tr>\n<tr>\n<td>manuelle Qualifizierung<\/td>\n<td>schlägt <strong>Next Best Action<\/strong> vor: übergeben / weiter nurturen / reaktivieren<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ <strong>KI-Scoring braucht genug historische Daten<\/strong> – bei kleinen Mengen sind Muster zufällig (z. B. bei Start-ups).<\/p>\n<p><strong>Lead-Scoring in Brevo (10 Schritte, Kurzform):<\/strong> Kontaktattribut „SCORE“ (Typ Zahl) anlegen → Automatisierung erstellen → Trigger wählen (z. B. „E-Mail geöffnet“) → Aktion „Kontaktattribut aktualisieren“ → Punkte hinzufügen → testen/aktivieren.<\/p>\n<p><strong>Übergabe:<\/strong> nicht zu früh (Vertrieb überlastet), nicht zu spät (Chance verpasst). Vorteile: weniger Reibung, Priorisierung, höhere Conversion, Marketing kann seinen Wert belegen.<\/p>\n<p><strong>Gemeinsame Maßnahmen (Praxis-Case IT-Start-up mit „schlechten Leads“):<\/strong> MQL/SQL-Kriterien gemeinsam definieren · Nurturing-Strecken für noch nicht kaufbereite Leads · Feedback-Schleife des Vertriebs im CRM, damit die KI-Datenbasis besser wird.<\/p>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Datensilo<\/td>\n<td>Daten liegen getrennt in Abteilungen/Tools<\/td>\n<\/tr>\n<tr>\n<td>360°-Sicht<\/td>\n<td>alle Marketing-, Sales- und Service-Infos in einem Datensatz<\/td>\n<\/tr>\n<tr>\n<td>Churn<\/td>\n<td>Abwanderung von Kund:innen<\/td>\n<\/tr>\n<tr>\n<td>Buying Center<\/td>\n<td>alle an einer B2B-Kaufentscheidung Beteiligten<\/td>\n<\/tr>\n<tr>\n<td>ABM<\/td>\n<td>Account-Based Marketing – Personalisierung auf Firmenebene<\/td>\n<\/tr>\n<tr>\n<td>Custom / Lookalike Audience<\/td>\n<td>Werbezielgruppe aus CRM-Daten / ähnliche Neukunden<\/td>\n<\/tr>\n<tr>\n<td>BANT<\/td>\n<td>Budget, Authority, Need, Timeline<\/td>\n<\/tr>\n<tr>\n<td>Human-in-the-Loop<\/td>\n<td>Mensch behält Kontrolle und Freigabe<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Typische Tutoriumsaufgaben<\/h2>\n<p>CRM vs. Excel mit Start-up-Empfehlung · Datenquellen, Segmente und Maßnahmen · Chancen/Risiken von KI · Segment → Content-Idee → Datenqualität · zwei KI-Funktionen und Gefahr der Over-Automation · B2B vs. B2C, HubSpot Free einordnen · zwei Segmente im Tool anlegen · zwei CRM-Systeme nach drei Kriterien vergleichen · MQL vs. SQL, Lead-Prozess, KI-Scoring · 5A-Modell auf ein Unternehmen anwenden · klassisches vs. KI-Scoring · „schlechte Leads“-Case lösen.<\/p>\n<p><strong>Fallunternehmen:<\/strong> AlpenGlow Naturkosmetik, FitMeal Express, UrbanBike Store, TechSolutions IT-Systemhaus, GreenPack Verpackungssysteme, HRConnect Consulting (plus die E231/E232-Fälle wie Hoffmanns Modehaus).<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Warum werden First-Party-Daten immer wichtiger?<\/strong>\n   → Third-Party-Cookies fallen weg (Cookieless Future, DSGVO); eigene Daten aus Website, Shop, Newsletter werden zur Basis für Personalisierung und KI.<\/li>\n<li><strong>Was bedeutet „Garbage in – Garbage out“ im CRM?<\/strong>\n   → Schlechte oder unvollständige Daten führen zwangsläufig zu falscher Segmentierung und Personalisierung.<\/li>\n<li><strong>Was ist der Unterschied zwischen Omnichannel und Multichannel?<\/strong>\n   → Multichannel nutzt viele Kanäle getrennt; Omnichannel verbindet alle über eine gemeinsame CRM-Datenbasis.<\/li>\n<li><strong>Wer qualifiziert einen MQL, wer einen SQL?<\/strong>\n   → MQL: Marketing (Engagement). SQL: Vertrieb (BANT-Kriterien).<\/li>\n<li><strong>Nenne die fünf Phasen des 5A-Modells.<\/strong>\n   → Aware, Appeal, Ask, Act, Advocate.<\/li>\n<li><strong>Was unterscheidet KI-Scoring vom klassischen Scoring?<\/strong>\n   → KI gewichtet Signale dynamisch anhand historischer Abschlussdaten und erkennt mehrdimensionale Muster; klassisch nutzt feste Punktelisten.<\/li>\n<li><strong>Wann ist KI-Scoring unzuverlässig?<\/strong>\n   → Bei zu wenig historischen Daten – dann sind erkannte Muster oft zufällig.<\/li>\n<li><strong>Welche CRM-KI-Funktion passt zu „Kund:in kaufte eine Kaffeemaschine“?<\/strong>\n   → Next Best Offer – z. B. Entkalker oder Bohnen-Abo vorschlagen.<\/li>\n<li><strong>Was ist die typische Kostenfalle bei CRM-Systemen?<\/strong>\n   → Günstiger oder kostenloser Einstieg, aber starke Preissteigerung bei Wachstum und für KI-/Automationsfunktionen (Beispiel HubSpot).<\/li>\n<li><strong>Wie personalisiert man im B2B für ein Buying Center?<\/strong>\n    → Nach Rolle: Entscheider:innen bekommen ROI-Argumente und Case Studies, die Fachabteilung technische Details und Spezifikationen.<\/li>\n<\/ol>"}, {"id": "email", "title": "E-Mail-Marketing & Automation", "course": "MKT-E234 (1)", "html": "<p><strong>Modul:<\/strong> MKT-E234, Einheit 1 · <strong>Grundlage:<\/strong> Vorlesung „E-Mail-Marketing &amp; Automation – KI-gestützte Kampagnen, Personalisierung &amp; Erfolgsmessung“ + Tutorium<\/p>\n<p><strong>Der rote Faden:<\/strong> E-Mail ist Owned Media mit voller Datenhoheit und einer der umsatzstärksten Kanäle. KI macht aus Standard-Newslettern 1:1-Kommunikation – aber nur mit sauberen Daten, Einwilligung, Transparenz und klarer Workflow-Logik.<\/p>\n<hr />\n<h2>1 · Grundlagen &amp; Strategie<\/h2>\n<ul>\n<li>E-Mail bleibt trotz Social Ads und KI-Suche einer der umsatzstärksten Performance-Kanäle.<\/li>\n<li><strong>Owned Media:<\/strong> volle Datenhoheit, keine Abhängigkeit von Algorithmen oder Plattformen.<\/li>\n<li>E-Mail ist die „Verlängerung des Shops“: Sie hält Kontakt, wenn niemand die Website besucht.<\/li>\n<\/ul>\n<h3>Arten des E-Mail-Marketings<\/h3>\n<table>\n<thead>\n<tr>\n<th>Typ<\/th>\n<th>Zweck<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Newsletter<\/td>\n<td>regelmäßige Kommunikation, Markenbindung<\/td>\n<td>Neuheiten, Blog-Updates<\/td>\n<\/tr>\n<tr>\n<td>Kampagnenmailing<\/td>\n<td>einmalige, gezielte Aktion<\/td>\n<td>Rabattaktion, Produktlaunch<\/td>\n<\/tr>\n<tr>\n<td>Automatisierte E-Mail<\/td>\n<td>Reaktion auf Verhalten<\/td>\n<td>Warenkorbabbruch, Geburtstag, Reaktivierung<\/td>\n<\/tr>\n<tr>\n<td>Transaktionsmail<\/td>\n<td>funktionale Kommunikation<\/td>\n<td>Bestellbestätigung, Versandinfo<\/td>\n<\/tr>\n<tr>\n<td>Standalone-Mailing (extern)<\/td>\n<td>Reichweite über fremde Verteiler<\/td>\n<td>Versand über Newsletter eines Fachmediums<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>E-Mail im Funnel<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Ziel<\/th>\n<th>Inhalte<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TOFU – „kennen“<\/td>\n<td>Interessent:innen gewinnen<\/td>\n<td>Freebies, Lead-Magnets, Newsletter-Anmeldung<\/td>\n<\/tr>\n<tr>\n<td>MOFU – „erwägen“<\/td>\n<td>Vertrauen aufbauen<\/td>\n<td>Produktempfehlungen, Storytelling, Social Proof<\/td>\n<\/tr>\n<tr>\n<td>BOFU – „handeln“<\/td>\n<td>Abschluss fördern<\/td>\n<td>Rabattcodes, Limitierungen, Reviews<\/td>\n<\/tr>\n<tr>\n<td>After-Sales / Retention<\/td>\n<td>Kund:innen binden<\/td>\n<td>Service-Content, Feedback, Treueprogramme<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Recht &amp; DSGVO<\/h3>\n<ul>\n<li><strong>Double-Opt-In (DOI) ist Pflicht:<\/strong> Anmeldung + Bestätigungsmail.<\/li>\n<li><strong>In jeder Mail:<\/strong> Impressum, Abmeldelink (Opt-out), Hinweis auf Datenschutzerklärung.<\/li>\n<li><strong>Tracking<\/strong> (Öffnungen, Klicks) muss in der Datenschutzerklärung benannt sein.<\/li>\n<li><strong>EU AI Act:<\/strong> Seit August 2026 gilt für KI-generierte Inhalte eine Transparenz- bzw. Kennzeichnungspflicht.<\/li>\n<\/ul>\n<h3>5 strategische Erfolgsfaktoren<\/h3>\n<ol>\n<li><strong>Relevanz vor Frequenz<\/strong> – lieber weniger, dafür passende Mails<\/li>\n<li><strong>Klarer Mehrwert<\/strong> – Information, Inspiration oder Incentive pro Mail<\/li>\n<li><strong>Saubere Datenbasis<\/strong> – ohne gute Segmentierung keine gute Automatisierung<\/li>\n<li><strong>Testen &amp; Lernen<\/strong> – A/B-Tests für Betreff, Versandzeit, CTA<\/li>\n<li><strong>Kanalverknüpfung<\/strong> – mit Social Ads, CRM, Onsite-Personalisierung<\/li>\n<\/ol>\n<hr />\n<h2>2 · KI in Kampagnenentwicklung &amp; Personalisierung<\/h2>\n<p><strong>Kreativprozess:<\/strong>\n- <strong>Betreffzeilen &amp; Preheader:<\/strong> KI liefert Varianten nach Emotion, Dringlichkeit, Zielgruppe (z. B. „Schreibe 5 Betreffzeilen für eine Re-Engagement-Kampagne im freundlichen, motivierenden Ton.“).\n- <strong>Inhalt &amp; Tonalität:<\/strong> Anpassung an Buyer Personas, Stil-Transfer von sachlich bis emotional.\n- <strong>Bilder &amp; Banner:<\/strong> Urheberrecht und Kennzeichnungspflicht beachten.<\/p>\n<p><strong>Segmentierung – früher vs. heute:<\/strong>\n| Früher | Heute (KI) |\n|---|---|\n| manuell nach Demografie oder Klickverhalten | Cluster-Analyse nach Kaufhistorie, Engagement, Warenwert |\n| wenige große Segmente | automatische <strong>Micro-Segments<\/strong> |\n| – | <strong>Predictive Scoring:<\/strong> Wahrscheinlichkeit für Kauf, Öffnung, Abwanderung |<\/p>\n<p><strong>Dynamischer Content:<\/strong> Variablen wie <code>{{Vorname}}<\/code>, <code>{{zuletzt angesehenes Produkt}}<\/code>, <code>{{Kategorieninteresse}}<\/code>; KI ergänzt <strong>Next-Best-Offer<\/strong>-Empfehlungen, passende Bildsprache und Tonalität je Profiltyp.\n<em>Beispiel:<\/em> Kunde A: „Du hast die blaue Jacke angesehen – jetzt 10 % Rabatt!“ · Kunde B: „Dein Herbst-Outfit ist fast komplett – wie wäre es mit diesem Accessoire?“<\/p>\n<p><strong>Versandzeit:<\/strong> KI ermittelt die <strong>„Best Send Time per User“<\/strong> aus individuellen Öffnungsgewohnheiten (Behavioural Timing).\n⚠️ Braucht genug historische Daten – bei kleinen Datenmengen können Muster zufällig sein.<\/p>\n<h3>Datenschutz &amp; Ethik<\/h3>\n<table>\n<thead>\n<tr>\n<th>Prinzip<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Transparenz<\/td>\n<td>KI-generierte Texte/Empfehlungen bleiben erkennbar<\/td>\n<\/tr>\n<tr>\n<td>Bias &amp; Fairness<\/td>\n<td>KI kann diskriminierende Muster reproduzieren (z. B. Genderpräferenzen)<\/td>\n<\/tr>\n<tr>\n<td>Datensparsamkeit<\/td>\n<td>Segmentierung nur mit zulässigen Feldern, keine sensiblen Merkmale<\/td>\n<\/tr>\n<tr>\n<td>Zustimmung<\/td>\n<td>KI-Personalisierung mit Tracking nur bei aktivem DOI<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>3 · Automatisierung &amp; Workflow-Logik<\/h2>\n<p><strong>E-Mail-Automation<\/strong> = Nachrichten werden ausgelöst, wenn ein bestimmtes Ereignis eintritt (z. B. Newsletter-Anmeldung, Warenkorbabbruch, CRM-Status „Lead → Kunde“).<\/p>\n<p><strong>Jeder Workflow hat drei Bausteine:<\/strong>\n1. <strong>Trigger<\/strong> – Was löst die Automation aus?\n2. <strong>Aktion<\/strong> – Was passiert dann? (Mail, CRM-Update …)\n3. <strong>Bedingung<\/strong> – Wann wird fortgesetzt oder gestoppt?<\/p>\n<table>\n<thead>\n<tr>\n<th>Kampagnentyp<\/th>\n<th>Zweck<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Welcome Series<\/td>\n<td>Erstkontakt pflegen<\/td>\n<td>Begrüßung + Vorteilsangebot<\/td>\n<\/tr>\n<tr>\n<td>Warenkorbabbrecher<\/td>\n<td>Kaufabschluss fördern<\/td>\n<td>Erinnerung nach 3 Stunden<\/td>\n<\/tr>\n<tr>\n<td>Re-Engagement<\/td>\n<td>Inaktive reaktivieren<\/td>\n<td>„Vermisst du uns?“ + Rabatt<\/td>\n<\/tr>\n<tr>\n<td>Post-Purchase Flow<\/td>\n<td>Zufriedenheit &amp; Folgekäufe<\/td>\n<td>Feedback-Mail, Cross-Sell<\/td>\n<\/tr>\n<tr>\n<td>Lead-Nurturing (B2B)<\/td>\n<td>Vertrauen aufbauen<\/td>\n<td>Whitepaper → Case → Angebot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>4 · Barrierefreiheits-Stärkungsgesetz (BFSG)<\/h2>\n<p>Das BFSG gilt seit dem <strong>28. Juni 2025<\/strong> (Stand der Folien: Juli 2026) – im E-Mail-Marketing unterschiedlich:<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Typ A – Service-Mail<\/th>\n<th>Typ B – Werbe-Mail<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beispiel<\/td>\n<td>„Ihre Bestellung ist bestätigt.“<\/td>\n<td>„Nur diese Woche: 20 % Rabatt“<\/td>\n<\/tr>\n<tr>\n<td>Auslöser<\/td>\n<td>Kund:in selbst<\/td>\n<td>Unternehmen, meist an viele gleichzeitig<\/td>\n<\/tr>\n<tr>\n<td>BFSG<\/td>\n<td>meist relevant, v. a. als Teil von Kauf/Vertrag<\/td>\n<td>meist keine direkte Pflicht<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Merksatz:<\/strong> Gehört die E-Mail zu einer Verbraucher-Dienstleistung, ist Barrierefreiheit besonders wichtig.<\/p>\n<\/blockquote>\n<p><strong>So wird ein Mailing barrierefrei:<\/strong> gut lesbar (klarer Text, Kontrast) · einfach verständlich (kurze Sätze) · klar aufgebaut (Überschriften, aussagekräftige Links) · per Tastatur und Screenreader nutzbar.<\/p>\n<hr />\n<h2>Tools &amp; Gruppenübung<\/h2>\n<p>Getestet wurden KI-, Segmentierungs-, Personalisierungs- und Automatisierungsfunktionen in <strong>Bitrix24, Brevo, HubSpot, CleverReach, Mailjet, GetResponse<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Fallunternehmen<\/th>\n<th>Fokus<\/th>\n<th>Tool<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>AlpenGlow Naturkosmetik GmbH<\/td>\n<td>Empfehlungen nach Hauttyp &amp; Kaufverhalten<\/td>\n<td>Bitrix24<\/td>\n<\/tr>\n<tr>\n<td>FitMeal Express UG<\/td>\n<td>Ernährungspläne, Re-Order-Kampagnen<\/td>\n<td>Brevo<\/td>\n<\/tr>\n<tr>\n<td>UrbanBike Store<\/td>\n<td>saisonale Kampagnen, Inspektions-Erinnerungen<\/td>\n<td>HubSpot<\/td>\n<\/tr>\n<tr>\n<td>TechSolutions IT-Systemhaus<\/td>\n<td>B2B-Lead-Nurturing<\/td>\n<td>CleverReach<\/td>\n<\/tr>\n<tr>\n<td>GreenPack Verpackungssysteme<\/td>\n<td>Account-Based Marketing<\/td>\n<td>Mailjet<\/td>\n<\/tr>\n<tr>\n<td>HRConnect Consulting UG<\/td>\n<td>Segmentierung Firmenkunden, Follow-ups<\/td>\n<td>GetResponse<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Tutoriumsaufgaben (2 von 3 Pflicht)<\/h2>\n<ol>\n<li><strong>Datenqualität:<\/strong> Warum Datenqualität und Segmentierung entscheidend sind; drei typische Datenfehler; Erkennen/Beheben in HubSpot, Brevo oder Bitrix24; Checkliste mit fünf Prüfpunkten.<\/li>\n<li><strong>Ethik &amp; Transparenz:<\/strong> drei Risiken des KI-Einsatzes, je eine Gegenmaßnahme, Ethik-Policy mit drei Grundsätzen.<\/li>\n<li><strong>Erfolgsmessung:<\/strong> drei Kennzahlen zur Kampagnenbewertung, Verbesserungsansätze, Tool zur Trend-Früherkennung, Begründung einer strategischen KPI.<\/li>\n<\/ol>\n<blockquote>\n<p>💡 Die Folien nennen keine konkreten Kennzahlen. Für Aufgabe 3 bieten sich gängige E-Mail-KPIs an (z. B. Öffnungsrate, Klickrate, Conversion-Rate, Abmelderate, Umsatz pro Mail) – diese Ergänzung stammt nicht aus den Unterlagen.<\/p>\n<\/blockquote>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Warum gilt E-Mail als Owned Media?<\/strong>\n   → Das Unternehmen hat volle Datenhoheit und ist nicht von Plattform-Algorithmen abhängig.<\/li>\n<li><strong>Was ist beim Double-Opt-In zu tun?<\/strong>\n   → Nach der Anmeldung eine Bestätigungsmail senden; erst nach Bestätigung ist der Kontakt eingetragen.<\/li>\n<li><strong>Welche drei Pflichtangaben gehören in jede Marketing-Mail?<\/strong>\n   → Impressum, Abmeldelink, Hinweis auf die Datenschutzerklärung.<\/li>\n<li><strong>Aus welchen drei Bausteinen besteht ein Automations-Workflow?<\/strong>\n   → Trigger, Aktion, Bedingung.<\/li>\n<li><strong>Was ist Predictive Scoring?<\/strong>\n   → KI berechnet die Wahrscheinlichkeit für Kauf, Öffnung oder Abwanderung eines Kontakts.<\/li>\n<li><strong>Wo liegt die Grenze der „Best Send Time per User“?<\/strong>\n   → Sie braucht genug historische Daten; bei wenig Daten können Muster zufällig sein.<\/li>\n<li><strong>Muss ein Rabatt-Newsletter nach BFSG barrierefrei sein?<\/strong>\n   → Meist keine direkte Pflicht; Service-Mails im Rahmen eines Kaufs/Vertrags sind dagegen meist relevant.<\/li>\n<li><strong>Welche Kampagne passt zu „Kunde hat seit 6 Monaten nicht geöffnet“?<\/strong>\n   → Re-Engagement („Vermisst du uns?“ + Anreiz).<\/li>\n<li><strong>Nenne zwei ethische Risiken der KI-Personalisierung.<\/strong>\n   → Bias (diskriminierende Empfehlungen) und Verstoß gegen Datensparsamkeit (sensible Merkmale).<\/li>\n<li><strong>Welche Rechtsgrundlage verlangt seit August 2026 Transparenz bei KI-Inhalten?<\/strong>\n    → Der EU AI Act.<\/li>\n<\/ol>"}, {"id": "ecommerce", "title": "Einführung in den E-Commerce", "course": "MKT-E231 (1–6)", "html": "<p><strong>Modul:<\/strong> MKT-E231 (Einheiten 1–6, E-Commerce-Teil) · <strong>Grundlage:<\/strong> 6 Vorlesungen + 6 Tutorien in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Bedeutung &amp; aktuelle Trends im E-Commerce<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Vertriebskanäle smart steuern: eigener Shop, Marktplätze, Social Commerce<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>E-Commerce-Wachstum mit Daten<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Conversion-Optimierung entlang der Customer Journey<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>UX/UI-Testings mit KI: Heatmaps &amp; Personalisierung<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>Rechtliche Grundlagen &amp; KI im E-Commerce<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> E-Commerce ist ein strategisches Muss. Erfolg entsteht durch die richtige Kanalwahl, datenbasiertes Wachstum („messen statt vermuten“), eine reibungslose Customer Journey mit guter UX – und rechtssicheres Arbeiten, gerade beim KI-Einsatz.<\/p>\n<hr />\n<h2>1 · Bedeutung &amp; Trends<\/h2>\n<p><strong>E-Commerce<\/strong> = elektronischer Handel mit Waren und Dienstleistungen über das Internet – vom ersten Kontakt über Kauf, Bezahlung und Lieferung bis zur Betreuung.\n<strong>Abgrenzung:<\/strong> E-Commerce ist Teil des <strong>E-Business<\/strong>, das auch interne Prozesse umfasst. <em>Beispiel:<\/em> Schuhkauf bei OTTO = E-Commerce; KI-gesteuertes Lager bei OTTO = E-Business.<\/p>\n<table>\n<thead>\n<tr>\n<th>Konsument:innen<\/th>\n<th>Unternehmen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Zeitersparnis (24/7)<\/td>\n<td>Erreichbarkeit (national/global)<\/td>\n<\/tr>\n<tr>\n<td>Komfort (Lieferung)<\/td>\n<td>Skalierbarkeit<\/td>\n<\/tr>\n<tr>\n<td>Transparenz (Preisvergleich)<\/td>\n<td>datenbasierte Optimierung<\/td>\n<\/tr>\n<tr>\n<td>Vielfalt (Nischen)<\/td>\n<td>Kostenvorteile (keine Ladenmiete)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Aktuelle Zahlen (Stand November 2026, statt der Folienwerte von 2024):<\/strong>\n| Kennzahl | Wert | Quelle |\n|---|---|---|\n| Online-Umsatz mit Waren, Deutschland 2025 | <strong>83,1 Mrd. €<\/strong> (+3,2 % ggü. 80,6 Mrd. € in 2024) | bevh, Jan. 2026 |\n| inkl. digitaler Dienstleistungen | <strong>97,5 Mrd. €<\/strong> (Dienstleistungen 14,4 Mrd. €, +7,3 %) | bevh |\n| Anteil Online-Marktplätze | <strong>56 %<\/strong> (46,2 Mrd. €, +4,9 %) | bevh |\n| Prognose Waren-E-Commerce 2026 | <strong>+3,8 %<\/strong> nominal | bevh / EHI |\n| Weltweiter E-Commerce 2025 | ca. <strong>6,4–6,9 Billionen USD<\/strong>, rund 20–21 % des Einzelhandels | Schätzungen verschiedener Marktforscher |\n| Mobile-Anteil | über 50 % (weltweit Schätzungen um 59 %) | Branchenschätzungen |<\/p>\n<p><em>Die Folie nannte „ca. 90 Mrd. €“ für 2024 – laut bevh waren es 80,6 Mrd. € mit Waren. Der Unterschied kommt vermutlich daher, dass die Folie Dienstleistungen mitzählt.<\/em><\/p>\n<h3>Geschäftsmodelle<\/h3>\n<table>\n<thead>\n<tr>\n<th>Modell<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiele<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>B2C<\/td>\n<td>Unternehmen → Endkunden<\/td>\n<td>Amazon, Zalando, Otto<\/td>\n<\/tr>\n<tr>\n<td>B2B<\/td>\n<td>zwischen Unternehmen<\/td>\n<td>Alibaba, SAP Commerce Cloud<\/td>\n<\/tr>\n<tr>\n<td>C2C<\/td>\n<td>Privat → Privat<\/td>\n<td>eBay, Vinted, Kleinanzeigen<\/td>\n<\/tr>\n<tr>\n<td>D2C<\/td>\n<td>Hersteller direkt → Endkunden<\/td>\n<td>Nike, Tesla<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Dropshipping:<\/strong> Händler lagert keine Ware; der Lieferant versendet direkt an die Kundin.\n✅ kein Lager, schneller Start, breites Sortiment, automatisierbar · ⚠️ wenig Kontrolle über Versand/Qualität, lange Lieferzeiten, Reklamationen landen beim Händler, geringe Margen, rechtliche Fallstricke.<\/p>\n<p><strong>Stufenmodell des Handels:<\/strong> stationär → Multichannel (Kanäle nebeneinander) → Omnichannel (vernetzt) → Plattform-Strategie.<\/p>\n<p><strong>Meilensteine:<\/strong> 1995 Amazon · 1998 PayPal · 2001 eBay populär in DE · 2007 iPhone (Mobile Commerce) · 2010 Zalando · 2016 Instagram Shopping · 2020 Corona-Schub · 2023 ChatGPT.<\/p>\n<p><strong>Mobile first:<\/strong> über 50 % der Käufe mobil – Design, Ladezeit und Checkout müssen auf dem Smartphone funktionieren.<\/p>\n<h3>Trends<\/h3>\n<table>\n<thead>\n<tr>\n<th>Trend<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>KI<\/td>\n<td>Content, Personalisierung, Empfehlungen, Dynamic Pricing, Chatbots<\/td>\n<\/tr>\n<tr>\n<td>Plattformisierung<\/td>\n<td>Amazon, OTTO, Kaufland, Etsy dominieren – 2025 liefen bereits 56 % des deutschen Online-Umsatzes über Marktplätze, getrieben auch von China-Plattformen wie Temu und Shein<\/td>\n<\/tr>\n<tr>\n<td>Social &amp; Creator Commerce<\/td>\n<td>TikTok Shop, Instagram Shopping, Livestream-Shopping<\/td>\n<\/tr>\n<tr>\n<td>Nachhaltigkeit<\/td>\n<td>Green Commerce, Circular Economy, <strong>Re-Commerce<\/strong> (refurbed, momox)<\/td>\n<\/tr>\n<tr>\n<td>Datenschutz &amp; Vertrauen<\/td>\n<td>First-Party-Daten, Consent Management, Privacy UX<\/td>\n<\/tr>\n<tr>\n<td>AR / VR<\/td>\n<td>AR praktisch erprobt (Möbel einblenden), VR eher Vision<\/td>\n<\/tr>\n<tr>\n<td>Re-Commerce &amp; Mietmodelle<\/td>\n<td>refurbed, Grover, momox, Vinted<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>2 · Vertriebskanäle smart steuern<\/h2>\n<p><strong>Vertriebskanal<\/strong> = Weg, über den ein Produkt vom Anbieter zur Kundschaft gelangt.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Direkter Vertrieb<\/th>\n<th>Indirekter Vertrieb<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beispiel<\/td>\n<td>eigener Online-Shop<\/td>\n<td>Amazon, Zalando<\/td>\n<\/tr>\n<tr>\n<td>Vorteil<\/td>\n<td>volle Kontrolle, volle Marge<\/td>\n<td>größere Reichweite<\/td>\n<\/tr>\n<tr>\n<td>Nachteil<\/td>\n<td>mehr Aufwand<\/td>\n<td>Provision, weniger Kontrolle<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Die drei Hauptkanäle<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Eigener Shop<\/th>\n<th>Marktplatz<\/th>\n<th>Social Commerce<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Vorteile<\/strong><\/td>\n<td>volle Kontrolle, höhere Marge, eigene Kundendaten, Unabhängigkeit<\/td>\n<td>Reichweite, Vertrauen &amp; Infrastruktur, schneller Einstieg, Ads auf der Plattform<\/td>\n<td>dort, wo die Zielgruppe ist; niedrige Einstiegshürde; emotional &amp; unterhaltsam<\/td>\n<\/tr>\n<tr>\n<td><strong>Nachteile<\/strong><\/td>\n<td>kein automatischer Traffic, Technik, Recht (Impressum, AGB, Widerruf, DSGVO), Kosten<\/td>\n<td>Provisionen, Preisdruck, wenig Markenbindung, Abhängigkeit von Plattformregeln<\/td>\n<td>Plattformabhängigkeit, technische Anbindung, Content-Aufwand, ohne Community wenig Reichweite<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Shop-Systeme:<\/strong> Shopify (Einsteiger, Cloud) · WooCommerce (WordPress, content-orientiert) · Shopware (KMU, DACH) · Wix/Jimdo (Baukasten) · Magento (Großunternehmen).\n<strong>Aufgaben im Shop-Betrieb:<\/strong> Produktpflege · Logistik &amp; Versand · Zahlung &amp; Checkout · Kundenservice · Marketing.<\/p>\n<p><strong>Marktplatz-Erfolgsfaktoren:<\/strong> Produktdatenqualität &amp; Amazon-SEO · Bewertungen &amp; Service · Versandstrategie (Eigenversand vs. <strong>FBA<\/strong>, Prime) · Preisstrategie (Repricing, Aktionstage).<\/p>\n<table>\n<thead>\n<tr>\n<th>Plattform<\/th>\n<th>geeignet für<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Amazon<\/td>\n<td>Standardprodukte, Technik, Haushalt<\/td>\n<\/tr>\n<tr>\n<td>OTTO Market<\/td>\n<td>Markenmode, Wohnaccessoires, Qualität<\/td>\n<\/tr>\n<tr>\n<td>eBay<\/td>\n<td>Gebrauchtes, Einzelstücke<\/td>\n<\/tr>\n<tr>\n<td>Etsy<\/td>\n<td>Kreatives, Handgemachtes, Vintage<\/td>\n<\/tr>\n<tr>\n<td>Kaufland.de<\/td>\n<td>breite Sortimente<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Social-Commerce-Formate:<\/strong> Shoppable Posts · Livestream Shopping · Story Shopping · Creator-verlinkter Content. Voraussetzungen: Business-Account, verknüpfter Produktkatalog, freigeschaltete Shopping-Funktionen.<\/p>\n<h3>Kanalsteuerung<\/h3>\n<p>„Smart steuern“ = nicht alle Kanäle wahllos bespielen, sondern gezielt planen, kombinieren, priorisieren.<\/p>\n<table>\n<thead>\n<tr>\n<th>Kombination<\/th>\n<th>Bewertung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Shop + Instagram Shopping<\/td>\n<td>🟢 Reichweite + Markenbindung<\/td>\n<\/tr>\n<tr>\n<td>Amazon + eigener Shop<\/td>\n<td>🔴🟢 Preiskonflikte, aber Risikostreuung<\/td>\n<\/tr>\n<tr>\n<td>TikTok + Etsy<\/td>\n<td>🟢 Kreativprodukte mit Reichweite<\/td>\n<\/tr>\n<tr>\n<td>OTTO Market + WooCommerce<\/td>\n<td>🔴 doppelter Pflegeaufwand<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Kanal-Mixe:<\/strong> D2C-Marke → Shop + Instagram + Google Ads · Nische → Etsy + Instagram · Technik → Amazon + Google Shopping + TikTok · Regional → Shop + Facebook Marketplace.\n<strong>Tools:<\/strong> PIM (zentrale Produktdaten) · Feed-Management (Channable, Productsup) · Omnichannel-CRM · Meta Commerce Manager, TikTok Seller Center.<\/p>\n<blockquote>\n<p><strong>Fazit:<\/strong> Nicht auf jedem Kanal präsent sein, aber auf den richtigen. Strategie kommt vor Tools.<\/p>\n<\/blockquote>\n<hr />\n<h2>3 · Wachstum mit Daten<\/h2>\n<table>\n<thead>\n<tr>\n<th>Wachstumsart<\/th>\n<th>Zielgröße<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Umsatz<\/td>\n<td>mehr Verkäufe / höherer Warenkorb<\/td>\n<\/tr>\n<tr>\n<td>Reichweite<\/td>\n<td>Besuche, Impressionen<\/td>\n<\/tr>\n<tr>\n<td>Marke<\/td>\n<td>Bekanntheit, Bindung<\/td>\n<\/tr>\n<tr>\n<td>Sortiment<\/td>\n<td>Produkte, Kategorien<\/td>\n<\/tr>\n<tr>\n<td>Profitabilität<\/td>\n<td>Deckungsbeitrag, geringere Akquisekosten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Wege:<\/strong> organisch (günstig, langsam) · bezahlt (schnell, budgetabhängig) · viral (Potenzial, schwer planbar) · partnerschaftlich (Kooperationen, Influencer).\n<strong>Startphase<\/strong> = Sichtbarkeit, erste Kund:innen; <strong>Skalierung<\/strong> = Funktionierendes hochfahren mit Automatisierung, Analyse, Retargeting.<\/p>\n<h3>Datenbasierte Denkweise<\/h3>\n<table>\n<thead>\n<tr>\n<th>Prinzip<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Testen statt raten<\/td>\n<td>A/B-Tests<\/td>\n<\/tr>\n<tr>\n<td>Messen statt vermuten<\/td>\n<td>Conversion Rate, Bounce Rate, CAC<\/td>\n<\/tr>\n<tr>\n<td>Zuhören statt annehmen<\/td>\n<td>Umfragen, Heatmaps<\/td>\n<\/tr>\n<tr>\n<td>Hypothesenbasiert handeln<\/td>\n<td>„Wenn wir X tun, erwarten wir Y“<\/td>\n<\/tr>\n<tr>\n<td>Iterativ verbessern<\/td>\n<td>kleine Schritte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Subjektiv:<\/em> „Die neue Landingpage sieht schöner aus.“ <em>Datenbasiert:<\/em> „Sie erhöht die Conversion Rate von 2 % auf 3,4 %.“<\/p>\n<h3>Wachstumsstrategien &amp; Hebel<\/h3>\n<table>\n<thead>\n<tr>\n<th>Strategie<\/th>\n<th>Ziel<\/th>\n<th>Kennzahlen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Traffic-Wachstum<\/td>\n<td>mehr Besucher<\/td>\n<td>Sitzungen, CTR, Sichtbarkeit, CPM, CPC<\/td>\n<\/tr>\n<tr>\n<td>Conversion-Wachstum<\/td>\n<td>mehr Käufe pro Besuch<\/td>\n<td>CR, Warenkorbabbruch<\/td>\n<\/tr>\n<tr>\n<td>Warenkorbwert<\/td>\n<td>mehr pro Kauf (Cross-Selling, Bundles)<\/td>\n<td><strong>AOV<\/strong><\/td>\n<\/tr>\n<tr>\n<td>Wiederkaufrate<\/td>\n<td>Bindung, CLV<\/td>\n<td>CLV, Wiederkaufrate<\/td>\n<\/tr>\n<tr>\n<td>Sortiment / International / Channel<\/td>\n<td>neue Produkte, Märkte, Kanäle<\/td>\n<td>Umsatzanteile, ROAS, CPA<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Priorisierung:<\/strong> Was ist der größte Engpass? Beste Kosten-Nutzen-Relation? Was belegen die Daten? Was lässt sich testen? <em>Beispiel:<\/em> Viele Besucher, wenig Käufe → <strong>Conversion vor Traffic.<\/strong><\/p>\n<p><strong>Skalierung<\/strong> = Wachstum ohne lineare Kostensteigerung, durch Automatisierung und KI (Produktfeeds, E-Mail-Flows, Dynamic Pricing, Chatbots, Nachfrageprognosen, Empfehlungen). Tools u. a.: Channable, Brevo/Klaviyo, Pricemonitor, Google Smart Bidding, Meta Advantage+, trbo, Nosto.<\/p>\n<h3>Metrik – Kennzahl – KPI<\/h3>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Metrik<\/td>\n<td>Messgröße ohne Aussage allein<\/td>\n<td>Ladezeit, Sitzungsdauer<\/td>\n<\/tr>\n<tr>\n<td>Kennzahl<\/td>\n<td>verdichtete Metrik mit Kontext<\/td>\n<td>Conversion Rate, Absprungrate<\/td>\n<\/tr>\n<tr>\n<td><strong>KPI<\/strong><\/td>\n<td>strategisch relevant, mit Zielbezug<\/td>\n<td>ROAS, CAC, Umsatz pro Kanal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Typische KPIs:<\/strong> CPC, ROAS, Neukundenanteil · CR, Abbruchquote · AOV, Umsatz pro Kanal · CLV, Wiederkaufsrate · KUR (Kosten-Umsatz-Relation), CPO, CAC.<\/p>\n<hr />\n<h2>4 · Conversion-Optimierung entlang der Customer Journey<\/h2>\n<p><strong>Conversion<\/strong> = gewünschte Aktion der Besucher:innen.<\/p>\n<table>\n<thead>\n<tr>\n<th>Makro-Conversions<\/th>\n<th>Mikro-Conversions<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kauf<\/td>\n<td>Klick auf Produkt<\/td>\n<\/tr>\n<tr>\n<td>Newsletter-Anmeldung<\/td>\n<td>Download eines Ratgebers<\/td>\n<\/tr>\n<tr>\n<td>Beratung buchen<\/td>\n<td>Scrolltiefe &gt; 75 %<\/td>\n<\/tr>\n<tr>\n<td>Kundenkonto registrieren<\/td>\n<td>In den Warenkorb legen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Conversion Rate = Conversions ÷ Besucher × 100<\/strong> (1.000 Besucher, 25 Käufe → 2,5 %). Sie beeinflusst direkt den <strong>ROAS<\/strong>.<\/p>\n<p><strong>Was die Conversion beeinflusst:<\/strong> Relevanz · Vertrauen (Siegel, Bewertungen, sichere Zahlung) · Usability (mobil!) · Klarheit (eindeutige CTAs) · Ladegeschwindigkeit.<\/p>\n<h3>5A-Modell statt AIDA<\/h3>\n<p>AIDA greift zu kurz: keine Informationsphase, keine Phase nach dem Kauf. Kotlers 5A-Modell berücksichtigt Recherche, Interaktion und Loyalität – und Kund:innen springen zwischen den Phasen.<\/p>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Verhalten<\/th>\n<th>Conversion-Hebel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aware<\/strong><\/td>\n<td>erste Sichtbarkeit (SEO, Ads, Social, KI)<\/td>\n<td>Targeting, Reichweite, Wiedererkennung<\/td>\n<\/tr>\n<tr>\n<td><strong>Appeal<\/strong><\/td>\n<td>Interesse, Produktbilder<\/td>\n<td>Bilder/Videos, Storytelling, Trust-Elemente<\/td>\n<\/tr>\n<tr>\n<td><strong>Ask<\/strong><\/td>\n<td>Preisvergleich, Bewertungen, FAQ<\/td>\n<td>Content für Suchanfragen, Live-Chat, transparente Infos, Q&amp;A<\/td>\n<\/tr>\n<tr>\n<td><strong>Act<\/strong><\/td>\n<td>Kauf<\/td>\n<td>1-Click-Checkout, kein Registrierungszwang, transparente Versandkosten, Zahlarten, A/B-Tests<\/td>\n<\/tr>\n<tr>\n<td><strong>Advocate<\/strong><\/td>\n<td>Bewertung, Teilen, Wiederkauf<\/td>\n<td>Loyalty, After-Sales-Mails, Bewertungs-Reminder<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Testmethoden<\/h3>\n<ul>\n<li><strong>A/B-Test:<\/strong> zwei Varianten parallel – ideal für Buttons, Headlines, CTAs<\/li>\n<li><strong>Multivariater Test:<\/strong> mehrere Elemente gleichzeitig – braucht viel Traffic<\/li>\n<li><strong>Segmentvergleich:<\/strong> Neu- vs. Stammkunden, Mobil vs. Desktop<\/li>\n<\/ul>\n<p><strong>Erfolgsfaktoren:<\/strong> klares Ziel · Nutzersicht · Daten · iterativ (Test → Erkenntnis → Umsetzung → neuer Test) · technische Performance.\n<strong>Stolperfallen:<\/strong> Tests ohne Hypothese · zu viele Änderungen gleichzeitig · fehlende Signifikanz · falsche Kennzahlen (Time on Site, Likes) · vertrauenszerstörende Maßnahmen (aggressive Pop-ups) · kein Buy-in im Team.<\/p>\n<p><em>Tutoriums-Case FashionX:<\/em> typische Schwachstellen sind Banner ohne CTA, lange Ladezeit, versteckte Bewertungen, unauffälliger „Weiter“-Button, fehlendes Apple Pay, <strong>Versandkosten erst im letzten Schritt<\/strong>, Bestätigungsmail ohne Personalisierung, kein Bewertungs-Follow-up.<\/p>\n<hr />\n<h2>5 · UX/UI-Testing mit KI<\/h2>\n<ul>\n<li><strong>UX (User Experience):<\/strong> Menschen bewegen sich einfach, schnell, selbsterklärend und sicher durch den Shop.<\/li>\n<li><strong>UI (User Interface):<\/strong> was man sieht und bedient – Buttons, Menüs, Farben. Ohne gutes UI keine gute UX.<\/li>\n<\/ul>\n<p><strong>Typische UX-Probleme:<\/strong> zu viele Produkte pro Seite · zu viele Bestellschritte · Zoomen auf dem Handy · Buttons nicht auffindbar.<\/p>\n<p><strong>Heatmaps:<\/strong> farbige Grafik, wo geklickt/gescrollt wird (rot = viel, blau = wenig). Zeigen übersehene Elemente, Klicks auf Nicht-Buttons, ungelesene Texte, mobile Probleme. <em>Beispiel:<\/em> Rabattcode ganz unten, aber kaum jemand scrollt so weit → nach oben.\n<strong>Tools:<\/strong> <strong>Microsoft Clarity<\/strong> (kostenlos, DSGVO-freundlich) · <strong>Hotjar<\/strong> (Free-Version) – Klick-Karten, Scroll-Karten, anonymisierte Sitzungsaufzeichnungen.<\/p>\n<p><strong>KI-gestütztes Eye-Tracking<\/strong> (z. B. Attention Insight): KI ist mit echten Eye-Tracking-Daten trainiert und sagt vorher, was auffällt, was übersehen wird und in welcher Reihenfolge Inhalte wahrgenommen werden.\n<strong>Grenzen:<\/strong> KI schätzt nur · keine Emotionen/Vorlieben · passt evtl. nicht zu neuen Zielgruppen · ersetzt keine echten Nutzertests.<\/p>\n<p><strong>Einfache Personalisierung:<\/strong> Begrüßung mit Namen · „Zuletzt angesehen“ · „Kunden kauften auch …“ · unterschiedliche Startseiten für Neue/Wiederkehrende. Braucht Daten, <strong>Einwilligung<\/strong> und ein Tool/Plugin.\n| Sinnvoll | Weniger sinnvoll |\n|---|---|\n| wiederkehrende Kund:innen, Login-Bereich, genug Traffic | wenig Traffic, nur Einmalkäufe, keine Tracking-Zustimmung |<\/p>\n<p><strong>Für kleine Shops:<\/strong> mit kostenlosen Tools starten, 1–2 Dinge gezielt testen statt alles gleichzeitig; Heatmaps nur mit Zustimmung.<\/p>\n<hr />\n<h2>6 · Recht &amp; KI im E-Commerce<\/h2>\n<p><em>(Hinweis der Folien: keine Rechtsberatung, Stand Mitte 2025. Die AI-Act-Fristen unten sind auf den Stand November 2026 aktualisiert.)<\/em><\/p>\n<h3>Pflichtangaben<\/h3>\n<table>\n<thead>\n<tr>\n<th>Regel<\/th>\n<th>Inhalt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Impressum<\/strong> (§§ 5, 6 DDG, vormals TMG)<\/td>\n<td>Name/Firma, ladungsfähige Anschrift, E-Mail + schnelle Kontaktmöglichkeit, ggf. Handelsregister, USt-ID, Aufsichtsbehörde<\/td>\n<\/tr>\n<tr>\n<td><strong>PAngV<\/strong><\/td>\n<td>Gesamtpreis inkl. MwSt. und Versand; <strong>Grundpreis<\/strong> bei Lebensmitteln, Kosmetik usw. (z. B. 4,99 €/100 ml); unzulässig: „zzgl. Versand“ ohne Link<\/td>\n<\/tr>\n<tr>\n<td><strong>Widerruf<\/strong> (§§ 355 ff. BGB)<\/td>\n<td>14 Tage ab Warenerhalt, Belehrung + Muster-Formular, Rücksendekosten; bei digitalen Inhalten erlischt es nach ausdrücklicher Zustimmung + Bestätigung<\/td>\n<\/tr>\n<tr>\n<td><strong>Lieferzeit<\/strong><\/td>\n<td>konkret („2–3 Werktage“), auch für Digitales; keine künstliche Verknappung<\/td>\n<\/tr>\n<tr>\n<td><strong>Nachhaltigkeit<\/strong><\/td>\n<td>ElektroG, VerpackG, BattG; LkSG; EU Green Claims Directive (gegen Greenwashing)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Datenschutz<\/h3>\n<ul>\n<li><strong>DSGVO<\/strong> gilt für Daten von Personen in der EU; personenbezogen sind auch IP-Adresse und Nutzerverhalten.<\/li>\n<li><strong>Cookies (EuGH Planet49):<\/strong> keine Cookies ohne aktive Zustimmung, keine vorausgewählten Checkboxen, „Ablehnen“ gleichwertig sichtbar; Consent-Tools wie Borlabs, Cookiebot, Usercentrics.<\/li>\n<li><strong>Newsletter:<\/strong> Double-Opt-In, Impressum, Abmeldelink.<\/li>\n<li><strong>GA4:<\/strong> nur mit IP-Anonymisierung, AV-Vertrag, Consent; Alternativen Matomo (self-hosted), etracker.<\/li>\n<li><strong>KI-Tools im Shop:<\/strong> Transparenz, Datenminimierung, Zweckbindung, Hinweis in der Datenschutzerklärung.<\/li>\n<li><strong>Doku:<\/strong> Datenschutzerklärung, Verzeichnis der Verarbeitungstätigkeiten, <strong>AV-Verträge<\/strong> mit allen Dienstleistern.<\/li>\n<\/ul>\n<h3>KI, Werbung &amp; Haftung<\/h3>\n<ul>\n<li><strong>Haftung:<\/strong> Nicht die KI ist Urheber, sondern wer sie einsetzt – bei Fehlern haftet der Shopbetreiber. KI-Bilder haben keine klassische Urheberschaft; Ähnlichkeit zu Marken prüfen.<\/li>\n<li><strong>UWG:<\/strong> verboten sind KI-manipulierte Bewertungen, Chatbots, die vorgeben, Menschen zu sein, „Drip-Pricing“; § 5 Irreführung (z. B. KI-Text „wirkt garantiert in 24 Stunden“); § 6 vergleichende Werbung nur objektiv nachprüfbar.<\/li>\n<li><strong>Werbekennzeichnung &amp; Trennungsgebot:<\/strong> „Anzeige“/„Werbung“ bei Influencer-Posts, Advertorials, Affiliate-Links – keine Schleichwerbung.<\/li>\n<\/ul>\n<h3>EU AI Act – risikobasierter Ansatz<\/h3>\n<table>\n<thead>\n<tr>\n<th>Risikostufe<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiele<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verboten<\/td>\n<td>unvereinbar mit EU-Werten<\/td>\n<td>Social Scoring, Emotionserkennung im Job<\/td>\n<\/tr>\n<tr>\n<td>Hochrisiko<\/td>\n<td>erlaubt, stark reguliert<\/td>\n<td>Kreditbewertung, Bewerberauswahl<\/td>\n<\/tr>\n<tr>\n<td>Begrenztes Risiko<\/td>\n<td>Transparenzpflichten<\/td>\n<td>Chatbots, KI-Bildgeneratoren<\/td>\n<\/tr>\n<tr>\n<td>Geringes Risiko<\/td>\n<td>keine besonderen Pflichten<\/td>\n<td>Produktempfehlungen, Spamfilter<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Für Shops:<\/strong> meist geringes oder begrenztes Risiko – aber Transparenz (Kund:innen müssen wissen, dass sie mit KI sprechen), Kennzeichnung täuschend echter KI-Inhalte, Hinweis bei automatisierter Personalisierung, <strong>Dokumentation<\/strong>, wie die KI funktioniert. Vereinfachte Vorgaben für KMU.\n<strong>Empfehlungen:<\/strong> KI-Einsatz im Shop inventarisieren · Transparenzhinweise einbauen · Anbieter-Dokumentation einholen.<\/p>\n<h3>Fristen des AI Act – aktueller Stand (November 2026)<\/h3>\n<p><em>Die Folien (Stand Mitte 2025) nennen veraltete Daten, u. a. den 11. Juni 2027 für die Kennzeichnung. Hier der aktuelle Stand nach dem <\/em><em>Digital Omnibus<\/em><em> (in Kraft seit 27. Juli 2026):<\/em><\/p>\n<table>\n<thead>\n<tr>\n<th>Datum<\/th>\n<th>Was gilt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. August 2024<\/td>\n<td>Inkrafttreten der Verordnung (EU) 2024/1689<\/td>\n<\/tr>\n<tr>\n<td>2. Februar 2025<\/td>\n<td>Verbotene Praktiken (z. B. Social Scoring) + KI-Kompetenzpflicht<\/td>\n<\/tr>\n<tr>\n<td>2. August 2025<\/td>\n<td>Regeln für General-Purpose-AI-Modelle, Governance, Sanktionen<\/td>\n<\/tr>\n<tr>\n<td><strong>2. August 2026<\/strong><\/td>\n<td><strong>Transparenzpflichten nach Art. 50 gelten<\/strong> – Hinweis bei KI-Interaktion (Chatbots), Kennzeichnung von Deepfakes und von KI-Texten zu Themen öffentlichen Interesses (ohne menschliche redaktionelle Verantwortung), Information bei Emotionserkennung<\/td>\n<\/tr>\n<tr>\n<td>2. Dezember 2026<\/td>\n<td>Maschinenlesbare Markierung (Wasserzeichen) für generative KI-Systeme, die <strong>vor<\/strong> dem 2. August 2026 auf den Markt kamen; neue Systeme müssen das schon ab Markteintritt · neues Verbot von KI für nicht-einvernehmliche intime Bilder („Nudifier“)<\/td>\n<\/tr>\n<tr>\n<td>2. Dezember 2027<\/td>\n<td>Hochrisiko-KI nach Anhang III (z. B. Bewerberauswahl, Kreditbewertung) – ursprünglich 2. August 2026<\/td>\n<\/tr>\n<tr>\n<td>2. August 2028<\/td>\n<td>Hochrisiko-KI in regulierten Produkten (Anhang I)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Für Online-Shops heißt das:<\/strong> Chatbot-Hinweis und Kennzeichnung täuschend echter KI-Bilder/Videos sind <strong>seit 2. August 2026 Pflicht<\/strong> – die Verschiebung betrifft vor allem Hochrisiko-Systeme, nicht den typischen Shop.<\/p>\n<hr />\n<h2>Fallunternehmen &amp; Kennzahlen (Gruppenübungen)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Unternehmen<\/th>\n<th>Auffällige Kennzahlen<\/th>\n<th>Naheliegender Hebel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Hoffmanns Modehaus<\/td>\n<td>CR 0,9 %, Retouren 28 %, 82 % mobil, Warenkorb 42 €<\/td>\n<td>Mobile UX, Conversion, Retourenreduktion<\/td>\n<\/tr>\n<tr>\n<td>GesundLeben Shop<\/td>\n<td>72 % über Google Ads, 69 % Warenkorbabbrüche, CLV 59 €<\/td>\n<td>Checkout prüfen, SEO, Retention<\/td>\n<\/tr>\n<tr>\n<td>FeinSchmecker GmbH<\/td>\n<td>Warenkorb 216 €, Wiederkauf 52 %, 34 % telefonisch, 17 % mobil<\/td>\n<td>CRM, Digitalisierung, Desktop-first<\/td>\n<\/tr>\n<tr>\n<td>Smartconsulting<\/td>\n<td>Lead→Kunde 11 %, Ladezeit 6,2 s, 21 s Verweildauer<\/td>\n<td>Performance, Leistungsseite, LinkedIn/Webinare<\/td>\n<\/tr>\n<tr>\n<td>Haus &amp; Garten Müller<\/td>\n<td>97 % Umsatz über Amazon, nur 3 % bewerten, ACoS 29 %<\/td>\n<td>Eigenen Kanal aufbauen, Bewertungen<\/td>\n<\/tr>\n<tr>\n<td>EcoBeauty<\/td>\n<td>Abbruch 66 %, 81 % Erstkäufer, Wiederkauf 6 %<\/td>\n<td>Checkout, Bindung, Upselling<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Die Spalte „Hebel“ ist eine Lesehilfe, keine Musterlösung aus den Folien.<\/em><\/p>\n<h2>Typische Tutoriumsaufgaben<\/h2>\n<p>Vertriebskanal-Finder (Miro) · Vertriebsstrategie für „EcoDrink“ · Social Commerce zusammenfassen · E-Commerce-Entwicklung für einen „Zeitreisenden aus den 1970ern“ · Trends 2026 · Moodboard „E-Commerce 2035“ · Wachstumsstrategien abgrenzen · datenbasiertes Denken + Tool (z. B. Looker Studio) · KI im E-Commerce · FashionX-Journey analysieren · 8 Fehler in einem Text finden · Mikro-/Makro-Conversions · Heatmaps, KI-UX-Tools, Personalisierung · Pflichtangaben, KI-Empfehlungssystem &amp; Datenschutz, KI-Content-Risiken, AI-Act-Einordnung.<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Was ist der Unterschied zwischen E-Commerce und E-Business?<\/strong>\n   → E-Commerce ist der Online-Verkauf; E-Business umfasst zusätzlich interne digitale Prozesse wie Lager oder Buchhaltung.<\/li>\n<li><strong>Nenne je einen Vor- und Nachteil von Dropshipping.<\/strong>\n   → Vorteil: kein Lager/geringe Fixkosten. Nachteil: wenig Kontrolle über Versand und Qualität.<\/li>\n<li><strong>Was unterscheidet direkten und indirekten Vertrieb?<\/strong>\n   → Direkt: eigener Shop, volle Kontrolle und Marge. Indirekt: über Plattformen, mehr Reichweite, aber Provision.<\/li>\n<li><strong>Ein Shop hat viele Besucher, aber kaum Käufe. Welche Strategie zuerst?<\/strong>\n   → Conversion-Wachstum vor Traffic-Wachstum.<\/li>\n<li><strong>Was ist der Unterschied zwischen Kennzahl und KPI?<\/strong>\n   → Eine KPI ist eine Kennzahl mit strategischem Zielbezug (z. B. ROAS, CAC).<\/li>\n<li><strong>Berechne die CR: 2.000 Besucher, 50 Käufe.<\/strong>\n   → 2,5 %.<\/li>\n<li><strong>Warum ersetzt das 5A-Modell AIDA?<\/strong>\n   → Es berücksichtigt die Recherchephase (Ask) und die Phase nach dem Kauf (Advocate) sowie Sprünge zwischen Phasen.<\/li>\n<li><strong>Was zeigt eine Heatmap – und welches Tool ist kostenlos?<\/strong>\n   → Wo geklickt und wie weit gescrollt wird; z. B. Microsoft Clarity.<\/li>\n<li><strong>Was sagt das Planet49-Urteil?<\/strong>\n   → Keine Cookies ohne aktive Zustimmung; vorausgewählte Checkboxen sind ungültig.<\/li>\n<li><strong>In welche AI-Act-Risikoklasse fallen Produktempfehlungen und Chatbots?<\/strong>\n    → Produktempfehlungen: geringes Risiko. Chatbots: begrenztes Risiko mit Transparenzpflicht.<\/li>\n<\/ol>"}, {"id": "d2c", "title": "D2C Marketing mit KI", "course": "MKT-E232 (D2C 1–4)", "html": "<p><strong>Modul:<\/strong> MKT-E232 (D2C-Teil, Einheiten 1–4) · <strong>Grundlage:<\/strong> 4 Vorlesungen + 4 Tutorien in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Warum D2C – Vorteile &amp; Erfolgsfaktoren im Direktvertrieb<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Smarte Optimierungen: Kundenbindung &amp; personalisierte Ansprache mit KI<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>D2C-Kampagnen: Struktur, Priorisierung &amp; Budgetsteuerung mit Predictive Forecasts<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Direktmarketing mit KI: Automatisierte Segmentierung &amp; dynamische Inhalte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> D2C ist mehr als ein eigener Shop – es ist ein strategisches Modell aus eigenem Markenaufbau, voller Kontrolle über die Customer Journey und datengetriebener Optimierung. Weil die Marke alles selbst macht, sind KI und Automatisierung der Hebel, um mit kleinem Team zu skalieren. <strong>„Neukund:innen kosten Geld. Stammkund:innen bringen Geld.“<\/strong><\/p>\n<hr />\n<h2>1 · Warum D2C?<\/h2>\n<p><strong>D2C (Direct-to-Consumer)<\/strong> = Hersteller oder Marken verkaufen <strong>ohne Zwischenhändler<\/strong> direkt an Endkund:innen, meist über eigene digitale Kanäle (Shop, Social Commerce, App).<\/p>\n<table>\n<thead>\n<tr>\n<th>Kriterium<\/th>\n<th>Klassisches B2C über Handel<\/th>\n<th>D2C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verkaufsweg<\/td>\n<td>Großhandel → Einzelhandel → Kund:in<\/td>\n<td>Hersteller → Kund:in<\/td>\n<\/tr>\n<tr>\n<td>Kundendaten<\/td>\n<td>beim Händler<\/td>\n<td>vollständig bei der Marke<\/td>\n<\/tr>\n<tr>\n<td>Kommunikation<\/td>\n<td>über Dritte<\/td>\n<td>direkt, kontrollierbar<\/td>\n<\/tr>\n<tr>\n<td>Produktpräsentation<\/td>\n<td>eingeschränkt<\/td>\n<td>vollständig<\/td>\n<\/tr>\n<tr>\n<td>Preis<\/td>\n<td>Händlereinfluss<\/td>\n<td>eigenständig<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Warum D2C boomt:<\/strong> Shops schnell aufsetzbar (Shopify, WooCommerce) · direkter Zugang über Social Media · KI &amp; Automatisierung auch für kleine Teams · Kund:innen wollen Transparenz, Nachhaltigkeit, Nähe. <em>Beispiel:<\/em> Purelei (Schmuck, via Instagram gewachsen).<\/p>\n<p><strong>Gut geeignet:<\/strong> Kosmetik &amp; Nahrungsergänzung · Fashion &amp; Schmuck · Möbel &amp; Home · Food &amp; Getränke (Abos) · erklärungsbedürftige Nischenprodukte.\n<strong>Merkmale erfolgreicher D2C-Produkte:<\/strong> emotional aufladbar · leicht zu versenden · gut in Content erklärbar · Wiederkauf-/Abo-Potenzial.<\/p>\n<h3>Die 6 Vorteile von D2C<\/h3>\n<ol>\n<li><strong>Höhere Marge<\/strong> – im Handel gehen 30–60 % des Preises an Zwischenhändler. <em>Beispiel:<\/em> T-Shirt, Produktion 5 €, Handel 39 €, D2C 29 € – Kunde spart, Marke verdient mehr.<\/li>\n<li><strong>Volle Kontrolle über Zielgruppendaten<\/strong> – First-Party-Daten für CRM, Retargeting, KI.<\/li>\n<li><strong>Schnellere Produkt- &amp; Preisoptimierung<\/strong> – A/B-Tests ohne Händlerabstimmung, keine Listungshürden.<\/li>\n<li><strong>Stärkere Kundenbindung<\/strong> – dynamische Startseiten, Empfehlungen, Abo- und Treueprogramme.<\/li>\n<li><strong>Eigenständige Marke &amp; Storytelling<\/strong> – Werte, Gründungsgeschichte, Social Proof (z. B. Snocks, KoRo).<\/li>\n<li><strong>Kontrolle über Preis, Service &amp; Logistik<\/strong> – eigene Verpackung, Giveaways, Dankeskarten.<\/li>\n<\/ol>\n<h3>Herausforderungen &amp; Erfolgsfaktoren<\/h3>\n<table>\n<thead>\n<tr>\n<th>4 Herausforderungen<\/th>\n<th>Erfolgsfaktoren<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Markenaufbau von null (keine Reichweite, kein Vertrauen)<\/td>\n<td><strong>Customer Obsession<\/strong> – UX, personalisiertes Einkaufen, einfacher Checkout &amp; Retouren<\/td>\n<\/tr>\n<tr>\n<td>Logistik &amp; Fulfillment („Amazon-Standard“)<\/td>\n<td>Nahtlose <strong>Customer Experience<\/strong> über alle Touchpoints<\/td>\n<\/tr>\n<tr>\n<td>Technologische Komplexität (Shop, CRM, Payment, DSGVO)<\/td>\n<td>Datenbasierte Optimierung (Heatmaps, A/B-Tests, Funnel-Analyse)<\/td>\n<\/tr>\n<tr>\n<td>Traffic-Aufbau &amp; Conversion, teure Paid Media<\/td>\n<td>Skalierbare Ads (Testing, Retargeting, Lookalikes, ROAS-orientiert)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Identitätsstarke Marke („Aus einem Produkt wird eine Beziehung.“)<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>CLV &amp; Loyalität (Abos, Bundles, Empfehlungsprogramme)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>KI im D2C<\/h3>\n<table>\n<thead>\n<tr>\n<th>Einsatzfeld<\/th>\n<th>Tools (laut Folien)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Produkt-/Content-Personalisierung<\/td>\n<td>Nosto, Dynamic Yield, Personyze<\/td>\n<\/tr>\n<tr>\n<td>E-Mail &amp; CRM<\/td>\n<td>Klaviyo, Mailchimp (Predictive Flows)<\/td>\n<\/tr>\n<tr>\n<td>Predictive Analytics<\/td>\n<td>GA4, Shopify Audiences, RetentionX<\/td>\n<\/tr>\n<tr>\n<td>Chatbots / Conversational Commerce<\/td>\n<td>ChatGPT API, ManyChat, Tidio, WhatsApp Business<\/td>\n<\/tr>\n<tr>\n<td>Visual Content<\/td>\n<td>Canva Magic, Midjourney, Adobe Firefly<\/td>\n<\/tr>\n<tr>\n<td>Texte<\/td>\n<td>ChatGPT, Jasper, neuroflash<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Beispiel:<\/em> Kauf eines Muskelaufbau-Präparats → Segment „Sport | Muskelaufbau“ → dynamische E-Mail-Strecke mit Empfehlungen, Verbrauchs-Reminder, Cross-Selling.<\/p>\n<h3>D2C vs. Plattform<\/h3>\n<table>\n<thead>\n<tr>\n<th>Kriterium<\/th>\n<th>D2C<\/th>\n<th>Plattform (Amazon, Zalando, Etsy …)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Kundendaten<\/td>\n<td>volle Kontrolle<\/td>\n<td>bleiben weitgehend bei der Plattform<\/td>\n<\/tr>\n<tr>\n<td>Marge<\/td>\n<td>höher<\/td>\n<td>geringer (Gebühren, Werbung)<\/td>\n<\/tr>\n<tr>\n<td>Reichweite<\/td>\n<td>selbst aufbauen<\/td>\n<td>sofort vorhanden<\/td>\n<\/tr>\n<tr>\n<td>Markenpräsentation<\/td>\n<td>frei<\/td>\n<td>standardisierte Listings<\/td>\n<\/tr>\n<tr>\n<td>CRM &amp; Bindung<\/td>\n<td>möglich<\/td>\n<td>keine direkte Beziehung<\/td>\n<\/tr>\n<tr>\n<td>Start<\/td>\n<td>höherer Aufwand<\/td>\n<td>geringe Hürde<\/td>\n<\/tr>\n<tr>\n<td>Risiko<\/td>\n<td>Eigenverantwortung<\/td>\n<td>Sperren, AGB, Rankings, Plattform kopiert Topseller<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>D2C sinnvoll, wenn …<\/th>\n<th>Plattform sinnvoll, wenn …<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Marke emotional, Produkt erklärungsbedürftig<\/td>\n<td>funktionale Standardware (Kabel, Socken)<\/td>\n<\/tr>\n<tr>\n<td>Marketing-/CRM-Know-how vorhanden<\/td>\n<td>erst einmal nur verkaufen<\/td>\n<\/tr>\n<tr>\n<td>Budget für Ads &amp; Content<\/td>\n<td>Plattform-Reichweite nutzen<\/td>\n<\/tr>\n<tr>\n<td>langfristige Kundenbeziehung gewünscht<\/td>\n<td>Fokus auf Transaktion<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Hybride Mischstrategie:<\/strong> Amazon für Volumenprodukte, D2C-Shop für Sondereditionen und Personalisierung. Typischer Start-up-Weg: Start auf Amazon → eigener Shop aufbauen → Bindung und Marge über D2C (<em>Beispiel Snocks<\/em>).<\/p>\n<blockquote>\n<p>„Plattformkunden sind nicht automatisch Markenfans – D2C-Kunden können es werden.“<\/p>\n<\/blockquote>\n<hr />\n<h2>2 · Kundenbindung &amp; Personalisierung<\/h2>\n<table>\n<thead>\n<tr>\n<th>Harte Kundenbindung<\/th>\n<th>Emotionale Kundenbindung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Verträge/Systeme: Abos, Kundenkarten, exklusive Mitgliedschaften<\/td>\n<td>Verbundenheit: gutes Produkt, Service, persönliche Ansprache, Werte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Personalisierung<\/strong> = nicht alle gleich behandeln, sondern passend zu Interessen und Käufen ansprechen.\n<em>Nicht personalisiert:<\/em> „20 % Rabatt auf alle Schuhe“ · <em>Personalisiert:<\/em> „Hallo Julia, wir haben neue Laufschuhe in deiner Größe – perfekt für dein nächstes Training!“<\/p>\n<p><strong>Datenarten:<\/strong> Transaktionsdaten (was, wie oft, was zusammen) · Verhaltensdaten (angesehen, Verweildauer, Warenkorbabbruch) · Präferenzdaten (Farben, Größen, Interessen) · im Direktmarketing zusätzlich CRM-Stammdaten und <strong>externe Daten<\/strong> (Wetter, Wirtschaftslage, Google Trends).<\/p>\n<p><strong>Was KI anders macht:<\/strong> Muster erkennen · Vorhersagen treffen · in Echtzeit reagieren · Quellen kombinieren.\n<strong>KI-Anwendungen:<\/strong> Recommendation Engines („Kund:innen kauften auch …“) · personalisierte Newsletter (Inhalt, Zeitpunkt, Zielgruppe) · Chatbots &amp; Conversational AI · dynamische Website-Inhalte.\n<strong>Technik:<\/strong> <strong>Machine Learning<\/strong> erkennt Muster selbstständig; <strong>Predictive Analytics<\/strong> schätzt, was als Nächstes passiert (z. B. Proteinpulver-Reminder vor Verbrauchsende).<\/p>\n<p><strong>Risiken:<\/strong> Datenschutz (nur mit Einwilligung) · falsche Daten → falsche Empfehlungen · <strong>„Creepy Marketing“<\/strong> – Kund:innen fühlen sich überwacht.<\/p>\n<h3>Vier smarte Segmente mit KI<\/h3>\n<table>\n<thead>\n<tr>\n<th>Segment<\/th>\n<th>Funktionsweise<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lookalike Audiences<\/strong><\/td>\n<td>Merkmale der besten Kund:innen → ähnliche Menschen für Werbung finden<\/td>\n<\/tr>\n<tr>\n<td><strong>Verhaltensbasiert<\/strong><\/td>\n<td>Abbrecher (schaut, kauft nie), Stammkund:innen, Preisjäger<\/td>\n<\/tr>\n<tr>\n<td><strong>RFM-Analyse<\/strong><\/td>\n<td><strong>R<\/strong>ecency (letzter Kauf), <strong>F<\/strong>requency (Häufigkeit), <strong>M<\/strong>onetary (Ausgaben)<\/td>\n<\/tr>\n<tr>\n<td><strong>Churn Prediction<\/strong><\/td>\n<td>erkennt drohende Abwanderung (viele Besuche ohne Kauf, sinkende Mail-Interaktion)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Zusätzlich: <strong>Clustering<\/strong> (z. B. K-Means) teilt Kund:innen automatisch in ähnliche Gruppen.\n<strong>Vorteile:<\/strong> Präzision · bessere Kampagnenergebnisse · weniger Streuverluste · Segmente aktualisieren sich selbst.<\/p>\n<hr />\n<h2>3 · D2C-Kampagnen, Priorisierung &amp; Budget<\/h2>\n<p><strong>D2C-Kampagne<\/strong> = gezielte Marketing-Aktion, um Kund:innen direkt zu gewinnen, zu binden oder zum Kauf zu bewegen.<\/p>\n<table>\n<thead>\n<tr>\n<th>Kampagnentyp<\/th>\n<th>Ziel<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Launch<\/td>\n<td>neues Produkt bekannt machen<\/td>\n<td>Social Posts, Bestandskunden-Mail, Countdown<\/td>\n<\/tr>\n<tr>\n<td>Promotion &amp; Sales<\/td>\n<td>kurzfristiger Umsatz<\/td>\n<td>Mid-Season-Sale, Black Friday<\/td>\n<\/tr>\n<tr>\n<td>Retention<\/td>\n<td>Kund:innen halten<\/td>\n<td>Danke-Mail, Geburtstagsgutschein, Treuepunkte<\/td>\n<\/tr>\n<tr>\n<td>Cross-Selling<\/td>\n<td>passende Ergänzung<\/td>\n<td>„Laufschuhe gekauft – hier passende Socken!“<\/td>\n<\/tr>\n<tr>\n<td>Up-Selling<\/td>\n<td>höherwertiges Produkt<\/td>\n<td>„1-Monats-Abo → 1-Jahres-Abo zum Sparpreis“<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Kampagnenziele:<\/strong> Awareness · Conversion · Loyalty.<\/p>\n<h3>D2C-Kennzahlen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Kennzahl<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Conversion Rate<\/td>\n<td>Anteil Käufer:innen<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td><strong>CPA<\/strong> – Cost per Acquisition<\/td>\n<td>Kosten pro gewonnenem Kunden<\/td>\n<td>500 € Budget, 10 Kunden → CPA 50 €<\/td>\n<\/tr>\n<tr>\n<td><strong>CLV<\/strong> – Customer Lifetime Value<\/td>\n<td>Umsatz über die gesamte Beziehung<\/td>\n<td>200 €/Jahr × 5 Jahre → 1.000 €<\/td>\n<\/tr>\n<tr>\n<td><strong>ROAS<\/strong> – Return on Ad Spend<\/td>\n<td>Umsatz pro Werbe-Euro<\/td>\n<td>1.000 € Kosten, 4.000 € Umsatz → ROAS 4<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Aufbau:<\/strong> Zielgruppe → Bedürfnis → Kampagnen-Story → Kanal-Mix entlang der 5A-Journey.\n<em>Beispiel:<\/em> Instagram Ads (Awareness) → Landingpage (Info) → E-Mail mit Rabattcode (Conversion) → Follow-up-Mail (Retention).\n<strong>Budgetblöcke:<\/strong> Paid · Owned · Earned Media. <em>Je stärker die eigenen Kanäle, desto günstiger das Marketing langfristig.<\/em><\/p>\n<h3>Priorisierung – vier Kriterien<\/h3>\n<ol>\n<li><strong>Business Impact<\/strong> – Umsatz/Gewinnpotenzial<\/li>\n<li><strong>Zielgruppen-Potenzial<\/strong> – wie viele Menschen erreichbar?<\/li>\n<li><strong>Zeitliche Dringlichkeit<\/strong> – Feiertage, Saison<\/li>\n<li><strong>Wettbewerbssituation<\/strong> – mitziehen oder bewusst anders positionieren?<\/li>\n<\/ol>\n<h3>Budgetsteuerung<\/h3>\n<table>\n<thead>\n<tr>\n<th>Budgetart<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fix<\/td>\n<td>vorher festgelegt<\/td>\n<td>10.000 € Facebook im Juli<\/td>\n<\/tr>\n<tr>\n<td>Variabel<\/td>\n<td>erfolgsabhängig<\/td>\n<td>ROAS &gt; 4 → Budget +20 %<\/td>\n<\/tr>\n<tr>\n<td>Kampagnenbudget<\/td>\n<td>für eine Aktion<\/td>\n<td>Black Friday 15.000 €<\/td>\n<\/tr>\n<tr>\n<td>Always-On<\/td>\n<td>dauerhaft<\/td>\n<td>Google Ads für „vegane Kosmetik“<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Herausforderungen:<\/strong> schwankende Werbepreise · Wettbewerb um Klickpreise · viele Kanäle gleichzeitig.\n<strong>Tools:<\/strong> Facebook Ads Manager, Google Ads Dashboard, Shopify Reports, HubSpot Marketing Hub, Google Sheets.\n<em>Praxisbeispiel GesundLeben:<\/em> Facebook-Ads ROAS 1,2 → Budget reduziert und in Newsletter (ROAS 5) umgeschichtet. <strong>Budget flexibel dorthin, wo es sich lohnt.<\/strong><\/p>\n<h3>Predictive Forecasting<\/h3>\n<p><strong>Vorausschauende Prognosen:<\/strong> Statt Durchschnittswerten der Vergangenheit („Letzten Dezember 1.000 Stück“) analysiert Machine Learning viele Daten inkl. Trends, Saison und externer Faktoren („Steigende Suchanfragen + Wetter → 30 % mehr Winterjacken“).<\/p>\n<p><strong>Einsatz:<\/strong> Kampagnenergebnisse · Conversion-Rate-Prognose · <strong>Absatzplanung<\/strong> (keine Ladenhüter, keine Engpässe) · <strong>Churn Prediction<\/strong> („Julia, 4 Monate kein Kauf, 85 % Churn-Risiko → Gutschein“).\n<strong>Datenbasis:<\/strong> historische Kampagnendaten · Produktdaten · Kundendaten · externe Daten.\n<strong>Vorteile:<\/strong> Planungssicherheit · effizienteres Budget · weniger Risiko · schneller auf Trends reagieren.<\/p>\n<hr />\n<h2>4 · Direktmarketing mit KI<\/h2>\n<p><strong>Direktmarketing<\/strong> = Marken sprechen Kund:innen direkt und personalisiert an, mit dem Ziel einer <strong>messbaren Reaktion<\/strong> (Klick, Kauf, Registrierung). Kanäle: Newsletter, Postwurf, SMS, WhatsApp.\n<strong>Ziele:<\/strong> Kundenbindung · Cross-/Upselling · Reaktivierung · Neukundengewinnung (z. B. Custom Audiences).<\/p>\n<table>\n<thead>\n<tr>\n<th>Massenmarketing<\/th>\n<th>Direktmarketing<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TV, Radio, Plakat<\/td>\n<td>personalisierte E-Mails, SMS, Social Ads<\/td>\n<\/tr>\n<tr>\n<td>eine Botschaft für alle<\/td>\n<td>individuelle Botschaften<\/td>\n<\/tr>\n<tr>\n<td>schwer messbar<\/td>\n<td>klare Messgrößen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Klassische vs. KI-Segmentierung:<\/strong> klassisch nach Alter, Geschlecht, Wohnort; KI erkennt feinere, dynamische Muster („kauft oft, aber wenig“, „selten, aber teuer“, „kurz vor Absprung“).\n<em>Beispiele:<\/em> Haus &amp; Garten Müller – Hobbygärtner kaufen bei Sonne mehr → Mail vor sonnigem Wochenende · GesundLeben – Eiweißpulver-Nachkauf-Erinnerung nach 25 Tagen.<\/p>\n<h3>Dynamische Inhalte<\/h3>\n<p>Inhalte passen sich in Echtzeit an – je nach Person, Zeitpunkt, Verhalten, Region, Wetter, Gerät.\n- <strong>Startseiten:<\/strong> „Hallo Julia, neue Laufschuhe in deiner Größe!“ vs. „Willkommen zurück, Max!“\n- <strong>Produkt-Listings:<\/strong> München sieht Winterjacken, Spanien Sommermode\n- <strong>Banner &amp; Pop-ups:<\/strong> Neukunden Willkommensrabatt, Stammkunden Treuebonus\n- <strong>B2B:<\/strong> Smartconsulting zeigt Mittelständlern andere Referenzen als Konzernen<\/p>\n<p><strong>Technik:<\/strong> Tracking-Daten + Regeln („Wenn Produkt X angesehen → zeige X“) – automatisiert per KI oder Plattformregeln (HubSpot, Salesforce).<\/p>\n<p><strong>Fünf dynamische E-Mail-Inhalte:<\/strong> Produktempfehlungen · Warenkorbabbrecher-Mail (nach 24 Std.) · Lifecycle-Mails (Begrüßung, Geburtstag, Reaktivierung) · standortbasierte Inhalte · Countdown-Timer. Umsetzbar mit Brevo, Inxmail, HubSpot, CleverReach, RapidMail über Platzhalter wie <code>[Vorname]<\/code>, <code>[Lieblingsprodukt]<\/code>.<\/p>\n<h3>Predictive Content<\/h3>\n<p>Nicht „Was hat der Kunde gekauft?“, sondern <strong>„Was wird der Kunde als Nächstes wollen?“<\/strong>\nVier Beispiele: Produktempfehlungen (Proteinpulver → Magnesium) · individuelle Angebote vor Vorratsende oder bei Churn-Risiko · vorausschauende Website-Banner · optimaler Versandzeitpunkt.\n<em>Fallbeispiele:<\/em> Haus &amp; Garten Müller bewirbt Gartenmöbel vor Sonnen-Wochenende · FeinSchmecker zeigt Tapenade-Banner bei mediterranen Käufen · Hoffmanns Modehaus schickt im Mai eine Vorschau an Kundinnen, die alle 4 Monate Sommerkleider kaufen.<\/p>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>D2C<\/td>\n<td>Direct-to-Consumer – Direktvertrieb ohne Zwischenhandel<\/td>\n<\/tr>\n<tr>\n<td>Customer Obsession<\/td>\n<td>Kundenbedürfnisse konsequent im Zentrum<\/td>\n<\/tr>\n<tr>\n<td>RFM<\/td>\n<td>Recency, Frequency, Monetary<\/td>\n<\/tr>\n<tr>\n<td>Churn<\/td>\n<td>Abwanderung (von „to churn“ = Butter rühren)<\/td>\n<\/tr>\n<tr>\n<td>Lookalike Audience<\/td>\n<td>neue Zielgruppe, die den besten Kund:innen ähnelt<\/td>\n<\/tr>\n<tr>\n<td>CPA / CLV / ROAS<\/td>\n<td>Kosten pro Kunde / Kundenwert über die Zeit / Umsatz pro Werbe-Euro<\/td>\n<\/tr>\n<tr>\n<td>Always-On-Budget<\/td>\n<td>dauerhaft laufendes Werbebudget<\/td>\n<\/tr>\n<tr>\n<td>Predictive Content<\/td>\n<td>Inhalte auf Basis vorhergesagter Interessen<\/td>\n<\/tr>\n<tr>\n<td>Creepy Marketing<\/td>\n<td>Personalisierung, die sich nach Überwachung anfühlt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Typische Tutoriumsaufgaben<\/h2>\n<p>Vorteile von D2C für ein eigenes Start-up · zwei Herausforderungen eines Snack-Shops mit Lösungen · zwei KI-Anwendungen für Sportnahrung inkl. DSGVO · D2C vs. Plattform + Mischstrategie · harte vs. emotionale Bindung einer eigenen Marke · Standard- vs. personalisierter Newsletter in Brevo/Bitrix24 · Abbrecher-Segment anlegen · Kampagnentyp zuordnen (nachhaltige Sneaker) · Black Friday vs. Reaktivierung entscheiden und als Management-Memo begründen · Segmente erkennen · dynamische Mail schreiben · Predictive Content: Nachbestellung vs. Erstkäufer-Churn.<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Was unterscheidet D2C vom klassischen B2C über den Handel?<\/strong>\n   → Kein Zwischenhandel; Kundendaten, Kommunikation, Präsentation und Preis liegen vollständig bei der Marke.<\/li>\n<li><strong>Nenne drei der sechs D2C-Vorteile.<\/strong>\n   → z. B. höhere Marge, eigene First-Party-Daten, eigenständige Markenbildung (außerdem: schnellere Optimierung, stärkere Bindung, Kontrolle über Preis/Service/Logistik).<\/li>\n<li><strong>Wann ist eine Plattformstrategie sinnvoller als D2C?<\/strong>\n   → Bei funktionaler Standardware, wenig Budget/Know-how für Marketing und reinem Transaktionsfokus.<\/li>\n<li><strong>Was ist der Unterschied zwischen harter und emotionaler Kundenbindung?<\/strong>\n   → Hart: über Verträge/Systeme (Abo, Kundenkarte). Emotional: über Verbundenheit (Produkt, Service, Werte).<\/li>\n<li><strong>Wofür stehen die Buchstaben R, F und M?<\/strong>\n   → Recency, Frequency, Monetary.<\/li>\n<li><strong>Berechne den ROAS: 2.000 € Werbekosten, 9.000 € Umsatz.<\/strong>\n   → 4,5.<\/li>\n<li><strong>Was ist ein variables Budget?<\/strong>\n   → Ein Budget, das sich am Erfolg orientiert, z. B. Erhöhung bei ROAS &gt; 4.<\/li>\n<li><strong>Welche vier Kriterien helfen bei der Kampagnenpriorisierung?<\/strong>\n   → Business Impact, Zielgruppen-Potenzial, zeitliche Dringlichkeit, Wettbewerbssituation.<\/li>\n<li><strong>Worin unterscheidet sich Predictive Forecasting von einer klassischen Prognose?<\/strong>\n   → Es nutzt Machine Learning über viele Daten inkl. Trends und externer Faktoren statt einfacher Vorjahreswerte.<\/li>\n<li><strong>Was ist „Creepy Marketing“?<\/strong>\n    → Personalisierung, die so weit geht, dass sich Kund:innen überwacht fühlen.<\/li>\n<\/ol>"}, {"id": "amazon", "title": "Amazon Marketing mit KI", "course": "MKT-E233 (Amazon 1–3)", "html": "<p><strong>Modul:<\/strong> MKT-E233 (Amazon-Teil, Einheiten 1–3) · <strong>Grundlage:<\/strong> 3 Vorlesungen + 3 Tutorien in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Amazon-SEO, Produktdaten-Optimierung &amp; Ranking-Faktoren<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Amazon Champions: KI-Analysen erfolgreicher Vendor- &amp; Seller-Strategien<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Amazon-Prozess mit KI-Unterstützung &amp; Wachstumsstrategien mit KI<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> Amazon ist eine <strong>Produktsuchmaschine mit Kaufabsicht<\/strong> – keine Informationsplattform. Gerankt wird nach <strong>Relevanz + Verkaufsperformance<\/strong>: Wer gute Produktdaten liefert und verkauft, steigt im Ranking, was wieder mehr Verkäufe bringt. KI beschleunigt Listung, Keyword-Arbeit, Conversion-Tests, Gebote und Lagerplanung.<\/p>\n<blockquote>\n<p>„Amazon ist eine Datenmaschine. Wer gute Daten liefert, wird besser gerankt – und besser verkauft.“<\/p>\n<\/blockquote>\n<hr />\n<h2>1 · Amazon-SEO &amp; Ranking-Faktoren<\/h2>\n<h3>Amazon vs. Google<\/h3>\n<table>\n<thead>\n<tr>\n<th>Aspekt<\/th>\n<th>Amazon<\/th>\n<th>Google<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Suchintention<\/td>\n<td>Kaufabsicht, Produktsuche<\/td>\n<td>Information, Navigation, Transaktion<\/td>\n<\/tr>\n<tr>\n<td>Erfolgskennzahl<\/td>\n<td>Umsatz, Conversion<\/td>\n<td>Klicks, Traffic, Leads<\/td>\n<\/tr>\n<tr>\n<td>Ranking<\/td>\n<td>Relevanz + <strong>Verkaufsperformance<\/strong><\/td>\n<td>Relevanz + Autorität/Backlinks<\/td>\n<\/tr>\n<tr>\n<td>Content<\/td>\n<td>kurze, präzise Produktdaten<\/td>\n<td>Texte, Blogs, Ratgeber<\/td>\n<\/tr>\n<tr>\n<td>Effekte<\/td>\n<td>schnell bei hoher Sales Velocity<\/td>\n<td>eher langfristig<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Amazon-SEO<\/strong> = Produkte bei relevanten Suchen möglichst weit vorne platzieren. Keine Backlinks, kein Content-Marketing zur Autorität – Fokus auf Produktdaten und Verkaufszahlen.\n<strong>Warum wichtig:<\/strong> 70–80 % der Käufer klicken auf Ergebnisse der ersten Seite · Sichtbarkeit erhöht die Sales Velocity, die wieder das Ranking stärkt · organische Plätze sparen Werbebudget.<\/p>\n<p><strong>A9/A10-Algorithmus – drei Prinzipien:<\/strong> Relevanz (Keywords) · Performance (Sales Velocity, CR) · Kundenerfahrung (Bewertungen, Retouren, Lieferzeit, Verfügbarkeit).\n<strong>Organisch vs. Paid:<\/strong> Ads (Sponsored Products, Sponsored Brands …) kaufen Sichtbarkeit und schieben über höhere Sales Velocity das organische Ranking an.<\/p>\n<p><strong>Suchverhalten:<\/strong> sehr konkrete Suchen („Nike Laufschuhe Herren Größe 43“), Fokus auf Seite 1. Kaufentscheidend: Titel &amp; Hauptbild · Rezensionen &amp; Sterne · Preis &amp; Prime-Logo · Lieferzeit.<\/p>\n<p><strong>Ökosystem:<\/strong> Marketplace (Seller) · Vendor Central (Lieferant an Amazon) · <strong>FBA<\/strong> (Amazon übernimmt Lager &amp; Versand) · Amazon Ads · Analyse-Tools.<\/p>\n<h3>Zwei Gruppen von Ranking-Faktoren<\/h3>\n<table>\n<thead>\n<tr>\n<th>Relevanzfaktoren – „Passt es zur Suche?“<\/th>\n<th>Performance-Faktoren – „Verkauft es sich?“<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Keywords in Titel, Bullet Points, Beschreibung, Backend<\/td>\n<td><strong>Sales Velocity<\/strong> (Verkaufsgeschwindigkeit)<\/td>\n<\/tr>\n<tr>\n<td>Kategorie &amp; Attribute<\/td>\n<td>Conversion Rate<\/td>\n<\/tr>\n<tr>\n<td>Produktbilder (Visual Search)<\/td>\n<td>Click-Through-Rate<\/td>\n<\/tr>\n<tr>\n<td>A+ Content<\/td>\n<td>Bewertungen &amp; Sterne<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>Retourenquote, Preis-Leistung, Prime/Lieferfähigkeit<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Beispiel:<\/em> Suche „wasserdichte Bluetooth Lautsprecher“ – ohne „wasserdicht“ im Titel taucht das Produkt oft nicht weit oben auf.<\/p>\n<h3>Die Listing-Elemente<\/h3>\n<table>\n<thead>\n<tr>\n<th>Element<\/th>\n<th>Regeln<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Titel<\/strong><\/td>\n<td>wichtigster Keyword-Platz; max. ca. <strong>200 Zeichen<\/strong>; mobil nur ca. <strong>70–80 Zeichen<\/strong> sichtbar → Wichtiges nach vorne. Aufbau: Marke + Hauptkeyword + Merkmale + Anwendung + Variante<\/td>\n<\/tr>\n<tr>\n<td><strong>Bullet Points<\/strong><\/td>\n<td>ca. <strong>5 Punkte<\/strong> à 200–250 Zeichen; Features, Vorteile, USPs; Keywords natürlich, kein Stuffing<\/td>\n<\/tr>\n<tr>\n<td><strong>Backend Keywords<\/strong><\/td>\n<td>für Kund:innen unsichtbar; Synonyme, Schreibvarianten, andere Sprachen; keine Wiederholung aus dem Titel; meist <strong>250 Bytes<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Beschreibung<\/strong><\/td>\n<td>weniger gewichtet; Storytelling, Zusatz-Keywords, einfache HTML-Tags<\/td>\n<\/tr>\n<tr>\n<td><strong>Bilder<\/strong><\/td>\n<td>Hauptbild: <strong>weißer Hintergrund<\/strong>, Produkt füllt <strong>≥ 85 %<\/strong>, keine Logos/Texte; mind. <strong>1000 × 1000 px<\/strong> (besser 2000 × 2000) für Zoom; dazu Lifestyle-, Detail-, Größenbilder und Videos<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>✅ <em>Gut:<\/em> „JBL Flip 6 Bluetooth Lautsprecher, Wasserdicht, Tragbar, PartyBoost, Schwarz“\n❌ <em>Schlecht:<\/em> „Lautsprecher Bluetooth kabellos Bluetooth Box Speaker Musikbox tragbar tragbar …“ (Keyword-Stuffing)<\/p>\n<p><strong>Weitere Faktoren:<\/strong> Preis (zu teuer → CR sinkt → Ranking fällt; Preispsychologie 19,99 €) · Prime-Vorteil · <strong>Out of Stock = Ranking bricht ein<\/strong> · richtige Kategorie · vollständige Attribute (sonst nicht in Filtern) · Retourenquote · Verkäufer-Performance.\n<strong>Varianten-Listings<\/strong> (Größen, Farben, Packs) bündeln Bewertungen und Sales Velocity → besseres Ranking.<\/p>\n<blockquote>\n<p>Ein schlechtes Hauptbild kann die CTR ruinieren – selbst bei Top-Ranking. Bilder und Videos sind auf Amazon oft wichtiger als Texte.<\/p>\n<\/blockquote>\n<h3>Keyword-Recherche<\/h3>\n<p><strong>Quellen:<\/strong> Amazon Auto-Suggest · Bestsellerlisten &amp; Kategorien · Listings der Top-Wettbewerber · Tools: <strong>Helium10, JungleScout, Amalyze<\/strong> (im Tutorium auch Sistrix „für Amazon“).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Short Tail<\/th>\n<th>Long Tail<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beispiel<\/td>\n<td>Bluetooth Lautsprecher<\/td>\n<td>Bluetooth Lautsprecher wasserdicht outdoor klein<\/td>\n<\/tr>\n<tr>\n<td>Suchvolumen / Wettbewerb<\/td>\n<td>hoch / hoch<\/td>\n<td>niedriger / niedriger<\/td>\n<\/tr>\n<tr>\n<td>Kaufabsicht<\/td>\n<td>breiter<\/td>\n<td>höher → bessere Conversion<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Kleinere Händler sollten über Long-Tail Nischen besetzen. Synonyme, Singular/Plural, Schreibweisen („USB Stick“/„USB-Stick“) gehören ins Backend.<\/p>\n<p><strong>Workflow:<\/strong> Haupt-Keyword → Auto-Suggest → Konkurrenzanalyse → Tools → Long-Tail notieren → priorisieren (Relevanz, Kaufabsicht, Wettbewerb) → in Titel, Bullets, Beschreibung, Backend einpflegen.<\/p>\n<p><strong>Häufige Fehler:<\/strong> Keyword-Stuffing · leere Felder · schlechte Bilder · falsche Kategorie · unvollständige Attribute · irreführende Inhalte (rechtliches Risiko).<\/p>\n<hr />\n<h2>2 · Vendor vs. Seller<\/h2>\n<table>\n<thead>\n<tr>\n<th>Aspekt<\/th>\n<th><strong>Vendor Central<\/strong><\/th>\n<th><strong>Seller Central<\/strong><\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beziehung<\/td>\n<td>B2B: Lieferant → Amazon<\/td>\n<td>B2C: Händler → Endkunde<\/td>\n<\/tr>\n<tr>\n<td>Preis<\/td>\n<td>Amazon bestimmt<\/td>\n<td>Händler bestimmt<\/td>\n<\/tr>\n<tr>\n<td>Produktseite<\/td>\n<td>„Verkauf durch Amazon“<\/td>\n<td>„Verkauf durch [Händler]“<\/td>\n<\/tr>\n<tr>\n<td>Lager<\/td>\n<td>Amazon<\/td>\n<td>Händler (außer <strong>FBA<\/strong>; alternativ <strong>FBM<\/strong> = selbst versenden)<\/td>\n<\/tr>\n<tr>\n<td>Marketing<\/td>\n<td>teils exklusiv (Retail Media Premium)<\/td>\n<td>Self-Service-Werbung<\/td>\n<\/tr>\n<tr>\n<td>Reports<\/td>\n<td>Retail Analytics (teils kostenpflichtig)<\/td>\n<td>Business Reports (kostenlos)<\/td>\n<\/tr>\n<tr>\n<td>Typisch für<\/td>\n<td>etablierte Marken, große Volumina (z. B. JBL)<\/td>\n<td>kleinere Marken, Private Label<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Vorteile<\/th>\n<th>Nachteile<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Vendor<\/strong><\/td>\n<td>Glaubwürdigkeit, Amazon übernimmt Logistik &amp; Service, große Bestellmengen<\/td>\n<td>wenig Preis-/Margenkontrolle, Preisdruck, komplexe Verträge, Chargebacks &amp; Gebühren<\/td>\n<\/tr>\n<tr>\n<td><strong>Seller<\/strong><\/td>\n<td>volle Preis-/Margenkontrolle, direktes Feedback, flexibles Sortiment, eigene Werbung<\/td>\n<td>operativer Aufwand, hoher Wettbewerb, Sperrrisiko, Steuer-/Zollfragen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Viele Unternehmen fahren eine <strong>Hybrid-Strategie<\/strong>.<\/p>\n<h3>Kennzahlen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Für Vendoren<\/th>\n<th>Für Seller<\/th>\n<th>Für beide<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Net PPM<\/strong> (in der Praxis: Gewinn pro Stück)<\/td>\n<td><strong>RoAS<\/strong> = Umsatz aus Ads ÷ Werbekosten<\/td>\n<td><strong>Sales Velocity<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Chargebacks &amp; Fees<\/strong> (Strafen für Lieferfehler, Etiketten, Verpackung)<\/td>\n<td><strong>Contribution Margin<\/strong> (nach Herstell-, Amazon- und Werbekosten)<\/td>\n<td><strong>Buybox-Quote<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Retail Analytics<\/strong>: Sell-In vs. Sell-Through, Lager, Trends<\/td>\n<td><strong>Account Health<\/strong> (Stornos, Pünktlichkeit, Zufriedenheit)<\/td>\n<td>Retourenquote<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td><\/td>\n<td>Bewertungen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Buybox<\/strong> = der „In den Einkaufswagen“-Platz; <strong>80–90 % der Käufe<\/strong> laufen darüber. Faktoren: Preis, Lieferzeit, Verkäufer-Performance.<\/p>\n<p><em>Rechenbeispiel (Tutorium; Lösung selbst gerechnet, nicht aus den Folien):<\/em> 500 € Ads, 2.500 € Umsatz, 800 € Produktkosten, 200 € Gebühren → <strong>RoAS = 2.500 ÷ 500 = 5<\/strong>; <strong>Contribution Margin = 2.500 − 800 − 200 − 500 = 1.000 € (40 %)<\/strong>.<\/p>\n<h3>Datenquellen &amp; KI-Tools<\/h3>\n<table>\n<thead>\n<tr>\n<th>Quelle<\/th>\n<th>Für wen<\/th>\n<th>Inhalt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Brand Analytics<\/strong><\/td>\n<td>Markeninhaber<\/td>\n<td>häufigste Suchbegriffe, Marktanteile Top-3-Produkte, Wettbewerbsvergleich<\/td>\n<\/tr>\n<tr>\n<td><strong>Retail Analytics<\/strong><\/td>\n<td>Vendoren<\/td>\n<td>Sell-In/Sell-Through, Lager, Retouren<\/td>\n<\/tr>\n<tr>\n<td><strong>Business Reports<\/strong><\/td>\n<td>Seller (kostenlos)<\/td>\n<td>Sessions, Page Views, CR, Umsätze<\/td>\n<\/tr>\n<tr>\n<td><strong>Advertising Reports<\/strong><\/td>\n<td>beide<\/td>\n<td>Keyword-Performance, CTR, CPC, RoAS<\/td>\n<\/tr>\n<tr>\n<td><strong>JungleScout<\/strong><\/td>\n<td>extern<\/td>\n<td>Produktrecherche, Umsatzschätzung, Nischen<\/td>\n<\/tr>\n<tr>\n<td><strong>Amalyze<\/strong><\/td>\n<td>extern<\/td>\n<td>Fokus DACH: Keyword-Tracking, Wettbewerb, Buybox<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>KI-Features:<\/strong> Trend Detection · Predictive Analytics · Dynamic Pricing · Keyword Clustering · Anomalie-Erkennung.<\/p>\n<h3>Erfolgreiche Strategien<\/h3>\n<p><strong>Vendoren:<\/strong> Premium-Positionierung mit <strong>A+ Content<\/strong> &amp; Brand Stores (JBL, Logitech) · Retail Analytics für Sortiment und Nachlieferung · Distributions- und Preisstrategien (MAP – rechtlich sensibel; Amazon-exklusive Bundles) · Promotions planen (Blitzangebote, Coupons, Deal des Tages) · Schutz vor Amazon-Eigenmarken durch Markenmehrwert, Patente, Designschutz.\n<strong>Seller:<\/strong> Nischen finden (hohe Nachfrage, wenig Wettbewerb, gute Marge – „rutschfeste Fitnessmatte für Yoga bei starkem Schwitzen“) · Produktideen mit KI validieren, bevor man sourct · Buybox halten · <strong>Dynamic Pricing<\/strong> · Ads-Mix (Sponsored Products = Produkte pushen, Sponsored Brands = Markenaufbau, Sponsored Display = Retargeting) · Bewertungen über Service und <strong>Vine-Programm<\/strong>.<\/p>\n<h3>KI-Wettbewerbsanalyse<\/h3>\n<p>Preise &amp; Preisuntergrenzen · Keyword- und Ads-Strategien der Konkurrenz · Bewertungsprofile (wiederkehrende Kritik → Chance für ein besseres Produkt, z. B. undichte Verschlüsse) · Sortimentslücken (Farben, Größen) · Werbeaktivität.\n<strong>Tipps:<\/strong> nicht nur Preise vergleichen · Konkurrenz-Reviews lesen · neue Player beobachten · Erkenntnisse in Listings und Produktentwicklung einfließen lassen.<\/p>\n<hr />\n<h2>3 · KI im Amazon-Prozess<\/h2>\n<h3>Listung<\/h3>\n<p><strong>Listung<\/strong> = Produktseite anlegen: Daten (Titel, Bullets, Beschreibung, Bilder, Preis, Bestand) → Kategorie → Keywords → prüfen und aktivieren.\n| Klassisch | KI-gestützt |\n|---|---|\n| Keywords, Texte, Bilder manuell – zeitintensiv, fehleranfällig | automatische Keyword-Vorschläge (Amalyze Keyword Cluster), KI-Texte (Jasper, ChatGPT), Bilderkennung für die Kategorie |<\/p>\n<p>Menschen bleiben wichtig für Kreativität, Emotion und <strong>Endkontrolle<\/strong>.<\/p>\n<h3>Sichtbarkeit<\/h3>\n<ol>\n<li><strong>Keyword Clustering<\/strong> – ähnliche Begriffe gruppieren (Helium10, Amalyze, DataHawk)<\/li>\n<li><strong>Long-Tail-Erkennung<\/strong> – Potenziale und Suchvolumen schätzen<\/li>\n<li><strong>Predictive Content<\/strong> – Inhalte anpassen, bevor die Konkurrenz es merkt (z. B. Trend „nachhaltige Materialien“ → Bullets anpassen)<\/li>\n<\/ol>\n<h3>Conversion<\/h3>\n<p><strong>CR = Käufe ÷ Besucher × 100.<\/strong> KI analysiert, welch
