Risiken der KI-Personalisierung nennt die Vorlesung?", "options": ["Zu viele Abonnenten und zu hohe Kosten", "Bias (diskriminierende Empfehlungen) und Verstoß gegen Datensparsamkeit", "Zu kurze Betreffzeilen und zu viele Bilder", "Zu niedrige Öffnungsraten und Spam-Ordner"], "correct": 1, "explanation": "Außerdem: Transparenz und Einwilligung (aktives DOI)."}, {"id": "email-10", "question": "Welche Rechtsgrundlage verlangt Transparenz bei KI-generierten Inhalten?", "options": ["Das BFSG", "Die Preisangabenverordnung", "Das Markengesetz", "Der EU AI Act"], "correct": 3, "explanation": "KI-generierte Inhalte unterliegen einer Transparenz- bzw. Kennzeichnungspflicht."}]}, {"id": "ecommerce", "title": "Einführung in den E-Commerce", "course": "MKT-E231 (1–6)", "questions": [{"id": "ecommerce-01", "question": "Was ist der Unterschied zwischen E-Commerce und E-Business?", "options": ["Es gibt keinen Unterschied.", "E-Business ist nur der B2B-Handel.", "E-Commerce umfasst auch Buchhaltung und Personal.", "E-Commerce ist der Online-Verkauf; E-Business umfasst zusätzlich interne digitale Prozesse."], "correct": 3, "explanation": "Schuhkauf bei OTTO = E-Commerce; KI-gesteuertes Lager bei OTTO = E-Business."}, {"id": "ecommerce-02", "question": "Was ist ein Nachteil von Dropshipping?", "options": ["Hohe Lagerkosten", "Kein breites Sortiment möglich", "Sehr langsamer Start", "Wenig Kontrolle über Versand und Qualität"], "correct": 3, "explanation": "Vorteile: kein Lager, schneller Start. Weitere Nachteile: lange Lieferzeiten, geringe Margen."}, {"id": "ecommerce-03", "question": "Was kennzeichnet indirekten Vertrieb?", "options": ["Verkauf über externe Plattformen: mehr Reichweite, aber Provision und weniger Kontrolle", "Verkauf ohne jede Gebühr", "Verkauf nur im Ladengeschäft", "Verkauf im eigenen Shop mit voller Marge"], "correct": 0, "explanation": "Direkt = eigener Shop; indirekt = z. B. Amazon, Zalando."}, {"id": "ecommerce-04", "question": "Ein Shop hat viele Besucher, aber kaum Käufe. Welche Strategie zuerst?", "options": ["Conversion-Wachstum vor Traffic-Wachstum", "Neue Märkte im Ausland erschließen", "Das Sortiment verdoppeln", "Mehr Google Ads schalten"], "correct": 0, "explanation": "Erst den größten Engpass beheben."}, {"id": "ecommerce-05", "question": "Was unterscheidet eine KPI von einer Kennzahl?", "options": ["KPIs werden nur jährlich erhoben.", "Eine KPI ist eine Kennzahl mit strategischem Zielbezug.", "Kennzahlen sind wichtiger als KPIs.", "Eine KPI ist immer eine Prozentzahl."], "correct": 1, "explanation": "Beispiele für KPIs: ROAS, CAC, Umsatz pro Kanal."}, {"id": "ecommerce-06", "question": "2.000 Besucher, 50 Käufe – wie hoch ist die Conversion Rate?", "options": ["2,5 %", "4 %", "25 %", "0,25 %"], "correct": 0, "explanation": "CR = Conversions ÷ Besucher × 100 = 50 ÷ 2.000 × 100."}, {"id": "ecommerce-07", "question": "Warum ersetzt das 5A-Modell im E-Commerce das AIDA-Modell?", "options": ["Es berücksichtigt Recherchephase und Phase nach dem Kauf sowie Sprünge zwischen Phasen.", "Weil AIDA nur für B2B gilt.", "Weil AIDA mehr Phasen hat.", "Weil das 5A-Modell keine Kaufphase kennt."], "correct": 0, "explanation": "Ask = aktive Recherche, Advocate = Weiterempfehlung/Wiederkauf."}, {"id": "ecommerce-08", "question": "Was zeigt eine Heatmap – und welches Tool ist kostenlos?", "options": ["Die Serverauslastung; z. B. Shopify", "Die Lagerbestände; z. B. Excel", "Die Werbekosten; z. B. Google Ads", "Wo geklickt und wie weit gescrollt wird; z. B. Microsoft Clarity"], "correct": 3, "explanation": "Rot = viel Aktivität, Blau = kaum Aktivität. Hotjar hat eine kostenlose Grundversion."}, {"id": "ecommerce-09", "question": "Was besagt das EuGH-Urteil Planet49?", "options": ["Cookie-Banner sind freiwillig.", "Nur Marketing-Cookies brauchen Zustimmung, wenn sie vorausgewählt sind.", "Cookies sind grundsätzlich verboten.", "Keine Cookies ohne aktive Zustimmung; vorausgewählte Checkboxen sind ungültig."], "correct": 3, "explanation": "Best Practice: „Ablehnen“ gleichwertig sichtbar wie „Zustimmen“."}, {"id": "ecommerce-10", "question": "In welche AI-Act-Risikoklassen fallen Produktempfehlungen und Chatbots?", "options": ["Chatbots: geringes Risiko; Produktempfehlungen: Hochrisiko", "Produktempfehlungen: geringes Risiko; Chatbots: begrenztes Risiko mit Transparenzpflicht", "Beide sind verboten", "Beide sind Hochrisiko-KI"], "correct": 1, "explanation": "Hochrisiko z. B. Kreditbewertung, Bewerberauswahl; verboten z. B. Social Scoring."}]}, {"id": "d2c", "title": "D2C Marketing mit KI", "course": "MKT-E232 (D2C 1–4)", "questions": [{"id": "d2c-01", "question": "Was unterscheidet D2C vom klassischen B2C über den Handel?", "options": ["D2C verkauft nur an Unternehmen.", "D2C läuft immer über Amazon.", "Beim D2C liegen die Kundendaten beim Händler.", "Kein Zwischenhandel; Kundendaten, Kommunikation, Präsentation und Preis liegen bei der Marke."], "correct": 3, "explanation": "Im Handel gehen laut Vorlesung 30–60 % des Preises an Zwischenhändler."}, {"id": "d2c-02", "question": "Welche Aussage nennt einen der sechs D2C-Vorteile?", "options": ["Kein Bedarf an Markenaufbau", "Keine Logistikaufgaben", "Volle Kontrolle über First-Party-Daten", "Sofortige Reichweite ohne Marketing"], "correct": 2, "explanation": "Weitere: höhere Marge, schnellere Optimierung, stärkere Bindung, eigene Marke, Kontrolle über Preis/Service."}, {"id": "d2c-03", "question": "Wann ist eine Plattformstrategie sinnvoller als D2C?", "options": ["Bei emotional aufladbaren Marken mit Storytelling", "Bei erklärungsbedürftigen Produkten", "Bei funktionaler Standardware, wenig Budget/Know-how und reinem Transaktionsfokus", "Bei langfristigem Kundenbeziehungsaufbau"], "correct": 2, "explanation": "Viele Marken fahren eine Mischstrategie (z. B. Snocks)."}, {"id": "d2c-04", "question": "Was ist harte Kundenbindung?", "options": ["Bindung über Verträge oder Systeme, z. B. Abo oder Kundenkarte", "Bindung über Werte und Sympathie", "Bindung über Social-Media-Likes", "Bindung über guten Service allein"], "correct": 0, "explanation": "Emotionale Bindung entsteht über Produkt, Service, persönliche Ansprache, Werte."}, {"id": "d2c-05", "question": "Wofür steht RFM?", "options": ["Retention, Forecast, Media", "Recency, Frequency, Monetary", "Return, Feedback, Margin", "Reach, Funnel, Marketing"], "correct": 1, "explanation": "Wann zuletzt gekauft, wie oft, wie viel Geld."}, {"id": "d2c-06", "question": "2.000 € Werbekosten, 9.000 € Umsatz – wie hoch ist der ROAS?", "options": ["7.000", "0,22", "4,5", "18"], "correct": 2, "explanation": "ROAS = Umsatz ÷ Werbekosten = 9.000 ÷ 2.000."}, {"id": "d2c-07", "question": "Was ist ein variables Budget?", "options": ["Ein Budget, das vorher fest und unabhängig vom Ergebnis ist", "Ein Budget nur für Black Friday", "Ein erfolgsabhängiges Budget, z. B. +20 % bei ROAS über 4", "Ein dauerhaft laufendes Google-Ads-Budget"], "correct": 2, "explanation": "Fix = vorher festgelegt; Always-On = läuft dauerhaft."}, {"id": "d2c-08", "question": "Welche vier Kriterien helfen bei der Kampagnenpriorisierung?", "options": ["Owned, Paid, Earned, Shared", "Logo, Farbe, Schrift, Bildsprache", "CPA, CLV, ROAS, CTR", "Business Impact, Zielgruppen-Potenzial, zeitliche Dringlichkeit, Wettbewerbssituation"], "correct": 3, "explanation": "Beispiel: Winterjacken-Kampagne vor Dezember, nicht im März."}, {"id": "d2c-09", "question": "Worin unterscheidet sich Predictive Forecasting von einer klassischen Prognose?", "options": ["Es nutzt Machine Learning über viele Daten inkl. Trends und externer Faktoren.", "Es betrachtet nur die Vergangenheit.", "Es übernimmt einfach die Vorjahreszahlen.", "Es arbeitet ohne Daten."], "correct": 0, "explanation": "Beispiel: Suchanfragen + Wetterdaten → 30 % mehr Nachfrage nach Winterjacken."}, {"id": "d2c-10", "question": "Was ist „Creepy Marketing“?", "options": ["Halloween-Kampagnen", "Personalisierung, die so weit geht, dass sich Kund:innen überwacht fühlen", "Werbung ohne Bilder", "Marketing nur per Brief"], "correct": 1, "explanation": "Neben Datenschutz und Datenqualität eine der Grenzen der Personalisierung."}]}, {"id": "amazon", "title": "Amazon Marketing mit KI", "course": "MKT-E233 (Amazon 1–3)", "questions": [{"id": "amazon-01", "question": "Worin unterscheidet sich das Amazon-Ranking grundlegend vom Google-Ranking?", "options": ["Google rankt nur nach Verkaufszahlen.", "Amazon rankt nach Backlinks.", "Beide ranken ausschließlich nach Preis.", "Amazon rankt nach Relevanz + Verkaufsperformance, Google nach Relevanz + Autorität"], "correct": 3, "explanation": "Amazon ist eine Transaktionsplattform mit Kaufabsicht."}, {"id": "amazon-02", "question": "Warum gehören die wichtigsten Keywords an den Anfang des Titels?", "options": ["Weil Amazon nur das erste Wort indexiert.", "Weil Keywords am Ende verboten sind.", "Mobil werden nur ca. 70–80 Zeichen angezeigt.", "Weil Titel max. 20 Zeichen haben dürfen."], "correct": 2, "explanation": "Titel dürfen bis ca. 200 Zeichen lang sein."}, {"id": "amazon-03", "question": "Welche Anforderungen gelten für das Amazon-Hauptbild?", "options": ["Beliebiger Hintergrund, mind. 300 × 300 px", "Produkt nur zu 50 % sichtbar, mit Wasserzeichen", "Weißer Hintergrund, Produkt füllt ≥ 85 %, keine Logos/Texte, mind. 1000 × 1000 px", "Lifestyle-Hintergrund mit Rabatt-Text"], "correct": 2, "explanation": "Lifestyle- und Detailbilder gehören in die Zusatzbilder."}, {"id": "amazon-04", "question": "Wofür sind Backend Keywords da?", "options": ["Für Keywords, die schon im Titel stehen", "Für Synonyme, Schreibvarianten und alternative Begriffe, die Kund:innen nicht sehen", "Für Preisangaben", "Für sichtbare Verkaufsargumente"], "correct": 1, "explanation": "Meist auf 250 Bytes begrenzt, ohne Wiederholungen aus dem Titel."}, {"id": "amazon-05", "question": "Was passiert bei Out of Stock auf Amazon?", "options": ["Nichts, das Ranking bleibt gleich.", "Keine Verkäufe und das Ranking bricht ein.", "Das Ranking steigt durch Verknappung.", "Amazon liefert aus eigenem Lager."], "correct": 1, "explanation": "Deshalb Predictive Inventory Management."}, {"id": "amazon-06", "question": "Was unterscheidet Vendor und Seller?", "options": ["Beide haben keine Preishoheit.", "Vendor ist nur für Privatpersonen.", "Seller liefert an Amazon, Vendor an Endkunden.", "Vendor verkauft an Amazon (Amazon bestimmt den Preis); Seller verkauft selbst an Endkunden."], "correct": 3, "explanation": "Vendor Central = B2B, Seller Central = B2C."}, {"id": "amazon-07", "question": "60 € Werbekosten, 300 € Umsatz – wie hoch ist der ACoS?", "options": ["5 %", "500 %", "50 %", "20 %"], "correct": 3, "explanation": "ACoS = Werbekosten ÷ Umsatz × 100."}, {"id": "amazon-08", "question": "Was ist die Buybox?", "options": ["Amazons Versandkarton", "Ein Werbeformat für Marken", "Das Retourenportal", "Das Kauf-Feld auf der Produktseite – darüber laufen 80–90 % der Käufe"], "correct": 3, "explanation": "Faktoren: Preis, Lieferzeit, Verkäufer-Performance."}, {"id": "amazon-09", "question": "Was ist der Nachteil von regelbasiertem Bidding?", "options": ["Starre Regeln ohne intelligente Anpassung an Tageszeit, Gerät oder Markt", "Es kann keine Gebote senken.", "Es ist schwer verständlich.", "Es funktioniert nur mit KI."], "correct": 0, "explanation": "Beispielregel: „Wenn ACoS > 30 %, senke Gebot um 20 %“."}, {"id": "amazon-10", "question": "Was bedeuten Sell-In und Sell-Through?", "options": ["Sell-In: Werbeumsatz; Sell-Through: organischer Umsatz", "Sell-In: wie viel Amazon beim Vendor einkauft; Sell-Through: wie viel Amazon an Endkunden verkauft", "Beides bezeichnet Lagerkosten", "Sell-In: Retouren; Sell-Through: Neukunden"], "correct": 1, "explanation": "Daten aus Retail Analytics, nur für Vendoren."}]}, {"id": "kundenkommunikation", "title": "Service & Kundenkommunikation", "course": "MKT-235", "questions": [{"id": "kundenkommunikation-01", "question": "Was unterscheidet Service von Support?", "option , "Entscheidungsfall – menschliche Bearbeitung nötig", "Mischfall – Template reicht"], "correct": 2, "explanation": "Rechtlich, emotional oder finanziell relevant → menschliche Entscheidung zwingend."}, {"id": "kundenkommunikation-07", "question": "Wozu dienen Fallbacks in Templates?", "options": ["Damit Mails schneller versendet werden", "Damit die Nachricht auch bei fehlenden Daten korrekt klingt", "Damit Spamfilter umgangen werden", "Damit Kund:innen nicht antworten können"], "correct": 1, "explanation": "Beispiel: „Guten Tag“ statt „Hallo ,“, wenn der Vorname fehlt."}, {"id": "kundenkommunikation-08", "question": "Welche Fälle werden laut Sampling-Plan zu 100 % geprüft?", "options": ["Alle KI-Drafts", "Keine – es wird nur stichprobenartig geprüft", "Nur Lieferstatus-Mails", "Entscheidungsfälle und Beschwerden mit negativem Ton"], "correct": 3, "explanation": "KI-Drafts allgemein: 10 % Stichprobe."}, {"id": "kundenkommunikation-09", "question": "Welche Reihenfolge haben die 5 Phasen eines Service-Calls?", "options": ["Begrüßung, Lösung, Anliegen, Abschluss, Checkback", "Anliegen, Lösung, Abschluss, Begrüßung, Checkback", "Begrüßung + Rahmen, Anliegen klären, Lösung führen, Checkback, Abschluss", "Lösung, Begrüßung, Checkback, Anliegen, Abschluss"], "correct": 2, "explanation": "Start → Klarheit → Lösung → Kontrolle → Abschluss."}, {"id": "kundenkommunikation-10", "question": "Was ist der erste Schritt des 6-Schritte-Deeskalationsprotokolls?", "options": ["Schuld eingestehen", "Stopp + Tempo runter", "Den Anruf beenden", "Zwei Optionen anbieten"], "correct": 1, "explanation": "„Okay – ich bin bei Ihnen. Ich kläre das jetzt mit Ihnen.“ Danach: Anerkennen, Ziel klären, 2 Optionen, Commitment, Abschluss."}]}, {"id": "recht", "title": "Recht im Online-Marketing", "course": "MKT-E241 (2.4.1, Teile 1–3)", "questions": [{"id": "recht-01", "question": "Wer ist nach deutschem Recht Urheber:in eines Werkes?", "options": ["Immer ein Mensch, also eine natürliche Person (§ 7 UrhG).", "Das Unternehmen, das den Auftrag bezahlt hat.", "Bei KI-Bildern das KI-Tool bzw. dessen Anbieter.", "Wer das Werk zuerst veröffentlicht."], "correct": 0, "explanation": "KI, Software und Unternehmen können kein Urheberrecht haben. Unternehmen erwerben nur Nutzungsrechte (Arbeitsvertrag, Lizenz, AGB)."}, {"id": "recht-02", "question": "Ab wann ist ein Werk urheberrechtlich geschützt?", "options": ["Nach Registrierung beim Patent- oder Markenamt.", "Erst mit einem ©-Vermerk.", "Automatisch mit der Schöpfung, ohne Registrierung.", "Erst ab der Veröffentlichung."], "correct": 2, "explanation": "Der Schutz entsteht ohne Registrierung oder Vermerk. Beispiel aus der Vorlesung: die Grafikerin, die ihr Logo „sicherheitshalber“ anmelden wollte."}, {"id": "recht-03", "question": "Ein Fotograf liefert Bilder „für den Online-Shop“. Darf der Shop sie auch auf Plakaten nutzen?", "options": ["Nein, nach der Zweckübertragungsregel gelten nur die Rechte für den vereinbarten Zweck.", "Ja, mit der Bezahlung gehen alle Rechte über.", "Ja, Auftragsfotos gehören immer dem Auftraggeber.", "Ja, solange der Fotograf genannt wird."], "correct": 0, "explanation": "§ 31 Abs. 5 UrhG: Was nicht ausdrücklich eingeräumt ist, gilt als nicht eingeräumt."}, {"id": "recht-04", "question": "Warum ist ein Bild unter CC BY-NC für einen Online-Shop meist tabu?", "options": ["Weil CC-Lizenzen nur für Privatpersonen gelten.", "„Non-Commercial“ schließt Werbung, Produktseiten und Shops ein.", "Weil man den Urheber nicht nennen darf.", "Weil NC-Bilder nur in den USA genutzt werden dürfen."], "correct": 1, "explanation": "Im E-Commerce ist kommerzielle Nutzung der Normalfall, deshalb passt NC fast nie."}, {"id": "recht-05", "question": "Was unterscheidet ein ausschließliches von einem einfachen Nutzungsrecht?", "options": ["Beim ausschließlichen geht das Urheberrecht mit über.", "Beim ausschließlichen darf nur ein Lizenznehmer nutzen, auch die Urheber:in selbst nicht mehr.", "Das einfache Nutzungsrecht ist immer zeitlich unbegrenzt.", "Es gibt keinen Unterschied, nur verschiedene Namen."], "correct": 1, "explanation": "Einfach = mehrere parallel (z. B. Stockfotos). Ausschließlich = typisch bei Auftragstexten und Kampagnen. Das Urheberrecht selbst ist nicht übertragbar (§ 29 UrhG)."}, {"id": "recht-06", "question": "Ist ein rein automatisch erzeugtes KI-Bild urheberrechtlich geschützt?", "options": ["Ja, der Prompt macht den Nutzer immer zum Urheber.", "Ja, das Urheberrecht liegt beim KI-Anbieter.", "Nein, Schutz entsteht nur durch kreativ-prägenden menschlichen Beitrag.", "Ja, aber nur 10 Jahre lang."], "correct": 2, "explanation": "„Die KI produziert, der Mensch gestaltet.“ Beispiel: Théâtre D'opéra Spatial – das US-Copyright-Amt lehnte den Schutz ab."}, {"id": "recht-07", "question": "Seit wann ist die KI-Kennzeichnungspflicht nach Art. 50 AI Act verbindlich?", "options": ["Seit Mai 2023.", "Seit dem 1. Januar 2025.", "Seit dem 2. August 2026.", "Erst ab 2030."], "correct": 2, "explanation": "Danach müssen bestimmte KI-Inhalte erkennbar sein, insbesondere täuschend echte Bilder, Audio oder Video (Deepfakes)."}, {"id": "recht-08", "question": "Eine Freelancerin übernimmt die laufende Betreuung eines Instagram-Kanals. Welcher Vertragstyp passt?", "options": ["Werkvertrag: geschuldet ist ein fertiges Ergebnis.", "Kaufvertrag über die Posts.", "Dienstvertrag (§ 611 BGB): geschuldet ist die Tätigkeit, nicht ein Erfolg.", "Auftragsverarbeitungsvertrag."], "correct": 2, "explanation": "Merksatz: Werk = liefern (Website, Video), Dienst = begleiten (laufende Betreuung, Beratung)."}, {"id": "recht-09", "question": "Eine Agentur schickt ein Angebot per E-Mail, der Kunde antwortet „Passt, macht das.“ Liegt ein Vertrag vor?", "options": ["Nein, ohne Unterschrift gibt es keinen Vertrag.", "Ja, Angebot und Annahme genügen, es gibt keinen Formzwang.", "Nur wenn die AGB beigefügt waren.", "Nur bei Aufträgen unter 1.000 Euro."], "correct": 1, "explanation": "§§ 145–157 BGB: zwei übereinstimmende Willenserklärungen. Schriftform ist nur für den Beweis besser."}, {"id": "recht-10", "question": "Ein Freelancer stellt seine AGB nur als PDF auf die Website und weist im Angebot nie darauf hin. Gelten sie?", "options": ["Nein, AGB müssen vor Vertragsschluss mit Hinweis und zumutbarer Kenntnisnahme einbezogen werden.", "Ja, man hätte sie auf der Website finden können.", "Ja, AGB gelten immer automatisch.", "Ja, ab 14 Tagen nach Vertragsbeginn."], "correct": 0, "explanation": "Einbeziehung nach §§ 305 ff. BGB. Ohne wirksame AGB gilt das Gesetz (dispositives Recht)."}, {"id": "recht-11", "question": "Zwei Kunden wollen eine fertige Website „widerrufen“, eine Privatperson und ein Unternehmen. Wer kann ein gesetzliches Widerrufsrecht haben?", "options": ["Beide, weil es online abgeschlossen wurde.", "Nur die Privatperson, denn nur Verbraucher:innen haben das Widerrufsrecht im Fernabsatz.", "Nur das Unternehmen, weil es besser geschützt ist.", "Keiner von beiden."], "correct": 1, "explanation": "14 Tage Widerruf im Fernabsatz (§§ 312g, 355 BGB) gibt es nur im B2C-Geschäft."}, {"id": "recht-12", "question": "Eine Agentur verspricht der Marke Plakatrechte, hat von der Fotografin aber nur „Nutzung für Social Media“. Wer sitzt in der Klemme?", "options": ["Die Marke, sie hätte selbst prüfen müssen.", "Die Agentur, sie hat mehr Rechte weitergegeben, als sie selbst besaß.", "Niemand, mit der Zahlung gehen alle Rechte über.", "Die Fotografin, sie hätte widersprechen müssen."], "correct": 1, "explanation": "Die Agentur kann nur so viele Rechte weitergeben, wie sie selbst hat. Jede Stufe der Rechtekette muss abgedeckt sein."}, {"id": "recht-13", "question": "Wann muss ein Influencer-Post laut den BGH-Urteilen vom 9.9.2021 als Werbung gekennzeichnet werden?", "options": ["Immer, sobald ein Produkt im Bild ist.", "Vor allem dann, wenn es eine Gegenleistung gibt, etwa Geld oder Gratisprodukte.", "Nie, solange sie das Produkt selbst gekauft hat.", "Nur, wenn die Marke ausdrücklich dazu auffordert."], "correct": 1, "explanation": "Hummels und Hanne mussten nicht kennzeichnen, weil sie kein Geld für die Links bekamen. Huss wurde wegen fehlender Kennzeichnung verurteilt."}, {"id": "recht-14", "question": "Eine Kundin schreibt per DM „Klar, gerne!“ zur Nutzung ihres Fotos. Reicht das für Anzeige und Schaufensterplakat?", "options": ["Ja, jede Zustimmung deckt jede Nutzung.", "Ja, ein Repost per Share-Button genügt ohnehin.", "Nicht sicher: Die Einwilligung muss Zweck, Medium und Dauer umfassen, am besten schriftlich.", "Nein, Kundenfotos dürfen nie genutzt werden."], "correct": 2, "explanation": "Recht am eigenen Bild (§ 22 KUG) und Urheberrecht der Kundin: für Werbung ausdrückliche, konkrete Einwilligung einholen."}, {"id": "recht-15", "question": "Bis zu welchem Anteil des Weltjahresumsatzes kann ein DSA-Bußgeld reichen?", "options": ["1 Prozent.", "6 Prozent (Art. 74 DSA).", "4 Prozent.", "20 Prozent."], "correct": 1, "explanation": "Dezember 2025: erste reguläre DSA-Strafe, 120 Mio. € gegen eine sehr große Plattform. Für kleine Shops eher relevant: das DDG mit bis zu 50.000 €."}, {"id": "recht-16", "question": "Was ist die „goldene Regel“ beim Datenschutz mit KI-Tools?", "options": ["Keine personenbezogenen Daten in öffentliche KI-Tools eingeben.", "Kundendaten nur am Wochenende hochladen.", "Personenbezogene Daten sind erlaubt, wenn sie verschlüsselt sind.", "Nur Namen eingeben, E-Mail-Adressen weglassen."], "correct": 0, "explanation": "Fall Sarah: Kundenliste mit Namen und E-Mails in ChatGPT kopiert → DSGVO-Risiko (Zweckbindung, Rechtsgrundlage, Datenexport)."}]}]};
const GROUPS = [
  { label: "Block 2.2 · Sichtbarkeit, Content & CRM", ids: ["seo-geo", "content", "crm", "email"] },
  { label: "Block 2.3 · E-Commerce & Marktplätze", ids: ["ecommerce", "d2c", "amazon"] },
  { label: "Block 2.4 · Recht im Online-Marketing", ids: ["recht"] },
  { label: "Service & Masterclass", ids: ["kundenkommunikation", "masterclass"] }
];
const KEY = "lp-spez2-v1";
const byId = Object.fromEntries(MODULES.map(m => [m.id, m]));
const qById = {};
QUIZ.modules.forEach(m => m.questions.forEach(q => { qById[q.id] = { ...q, module: m.id }; }));
const ALL_Q = Object.keys(qById);

function load() {
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && typeof s === "object") return { read: s.read || {}, best: s.best || {}, wrong: s.wrong || {} }; } catch (e) {}
  return { read: {}, best: {}, wrong: {} };
}
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const shuffle = a => { const r = a.slice(); for (let i = r.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [r[i], r[j]] = [r[j], r[i]]; } return r; };
const wrongCount = () => Object.keys(S.wrong).filter(id => qById[id]).length;
const qCount = id => QUIZ.modules.find(m => m.id === id).questions.length;

function status(id) {
  const best = S.best[id], total = qCount(id);
  if (S.read[id] && best != null && best / total >= 0.8) return "done";
  if (S.read[id] || best != null) return "read";
  return "";
}

function renderNav(route) {
  const nav = document.getElementById("nav");

  let h = `<div class="brand"><b>Lernplattform Spezialisierung 2</b><span>Online-Marketing & E-Commerce</span></div>
  <div class="nav-group"><a href="#start" class="${route === "start" ? "active" : ""}"><span class="t">Übersicht</span></a></div>`;
  GROUPS.forEach(g => {
    h += `<div class="nav-group"><div class="nav-label">${esc(g.label)}</div>`;
    g.ids.forEach(id => {
      const m = byId[id], st = status(id);
      h += `<a href="#modul-${id}" class="${route === "modul-" + id || route === "quiz-" + id ? "active" : ""}">
        <span class="dot ${st}" aria-hidden="true">${st === "done" ? "✓" : ""}</span>
        <span class="t">${esc(m.title)}<span class="code">${esc(m.course)}</span></span></a>`;
    });
    h += `</div>`;
  });
  h += `<div class="nav-group"><div class="nav-label">Quiz</div>
    <a href="#quiz" class="${route === "quiz" ? "active" : ""}"><span class="t">Quiz-Übersicht</span><span class="pill">${ALL_Q.length}</span></a>
    <a href="#quiz-mix" class="${route === "quiz-mix" ? "active" : ""}"><span class="t">Gemischt: 20 Fragen</span></a>
    <a href="#wiederholen" class="${route === "wiederholen" ? "active" : ""}"><span class="t">Fehler wiederholen</span><span class="pill ${w ? "hot" : ""}">${w}</span></a></div>
  <div class="nav-foot"><span>Dein Fortschritt wird nur in diesem Browser gespeichert.</span><button class="linkbtn" id="resetBtn">Fortschritt zurücksetzen</button></div>`;
  nav.innerHTML = h;
  document.getElementById("resetBtn").onclick = () => { location.hash = "reset"; };
}

function viewStart() {
  const read = MODULES.filter(m => S.read[m.id]).length;
  const tested = Object.keys(S.best).filter(id => byId[id]).length;
  const pts = Object.entries(S.best).filter(([id]) => byId[id]).reduce((a, [id, v]) => a + v / qCount(id), 0);
  const avg = tested ? Math.round(pts / tested * 100) : 0;
  const w = wrongCount();
  let h = `<div class="head"><span class="eyebrow">Übersicht</span><h1 class="page">Was steht heute an?</h1>
    <p class="lead">Zehn Module aus deinen Vorlesungen, Tutorien und Masterclasses. Lies die Zusammenfassung, teste dich im Quiz und wiederhole gezielt, was noch nicht sitzt.</p></div>
  <div class="stats">
    <div class="stat"><b>${read}/${MODULES.length}</b><span>Module gelesen</span><div class="bar"><i style="width:${read / MODULES.length * 100}%"></i></div></div>
    <div class="stat"><b>${tested}/${MODULES.length}</b><span>Quizze gemacht</span><div class="bar"><i style="width:${tested / MODULES.length * 100}%"></i></div></div>
    <div class="stat"><b>${tested ? avg + " %" : "–"}</b><span>Ø Bestwert im Quiz</span><div class="bar"><i style="width:${avg}%"></i></div></div>
    <div class="stat"><b>${w}</b><span>Fragen zum Wiederholen</span><div class="bar"><i style="width:${Math.min(100, w / ALL_Q.length * 100)}%;background:var(--bad)"></i></div></div>
  </div>`;
  const next = MODULES.find(m => !S.read[m.id]) || MODULES.find(m => status(m.id) !== "done");
  if (w) h += `<div class="actions" style="margin-top:0"><a class="btn primary" href="#wiederholen">${w} falsch beantwortete ${w === 1 ? "Frage" : "Fragen"} wiederholen</a>${next ? `<a class="btn" href="#modul-${next.id}">Weiter mit ${esc(next.title)}</a>` : ""}</div>`;
  else if (next) h += `<div class="actions" style="margin-top:0"><a class="btn primary" href="#modul-${next.id}">Weiter mit ${esc(next.title)}</a><a class="btn" href="#quiz-mix">Gemischtes Quiz</a></div>`;
  h += `<div class="blocks">`;
  GROUPS.forEach(g => {
    h += `<div class="block"><h3>${esc(g.label)}</h3><div class="grid">`;
    g.ids.forEach(id => {
      const m = byId[id], best = S.best[id], total = qCount(id);
      const chips = [];
      chips.push(S.read[id] ? `<span class="chip acc">gelesen</span>` : `<span class="chip">noch nicht gelesen</span>`);
      if (best != null) chips.push(`<span class="chip ${best / total >= 0.8 ? "ok" : "bad"}">Quiz ${best}/${total}</span>`);
      h += `<a class="mcard" href="#modul-${id}"><span class="code">${esc(m.course)}</span><b>${esc(m.title)}</b><span class="chips">${chips.join("")}</span></a>`;
    });
    h += `</div></div>`;
  });
  h += `</div><p class="note">Ein Modul gilt als abgeschlossen, wenn du es gelesen und im Quiz mindestens 8 von 10 Fragen richtig hast. Die AI-Act-Fristen und E-Commerce-Zahlen sind auf dem Stand November 2026.</p>`;
  return h;
}

function viewModule(id) {
  const m = byId[id];
  if (!m) return viewStart();
  const html = m.html;
  const tmp = document.createElement("div");
  tmp.innerHTML = html;
  tmp.querySelectorAll("table").forEach(t => { const w = document.createElement("div"); w.className = "tbl"; t.replaceWith(w); w.appendChild(t); });
  const toc = [];
  tmp.querySelectorAll("h2").forEach((h2, i) => { h2.id = id + "-s" + i; toc.push(`<a href="#${id}" data-target="${h2.id}">${esc(h2.textContent.replace(/^\d+\s*·\s*/, ""))}</a>`); });
  const best = S.best[id];
  return `<div class="head"><span class="eyebrow">${esc(m.course)} · Lernzusammenfassung</span><h1 class="page">${esc(m.title)}</h1>
    <div class="actions"><a class="btn primary" href="#quiz-${id}">Quiz starten (${qCount(id)} Fragen)</a>
    ${S.read[id] ? `<button class="btn ok" data-unread="${id}">✓ Gelesen</button>` : `<button class="btn" data-read="${id}">Als gelesen markieren</button>`}
    ${best != null ? `<span class="chip ${best / qCount(id) >= 0.8 ? "ok" : "bad"}" style="align-self:center">Bestwert ${best}/${qCount(id)}</span>` : ""}</div></div>
    <nav class="toc" aria-label="Abschnitte">${toc.join("")}</nav>
    <article class="md">${tmp.innerHTML}</article>
    <div class="endbar"><span>Fertig gelesen? Teste dein Wissen.</span><span class="actions" style="margin:0">${S.read[id] ? "" : `<button class="btn" data-read="${id}">Als gelesen markieren</button>`}<a class="btn primary" href="#quiz-${id}">Zum Quiz</a></span></div>`;
}

function viewQuizHome() {
  let h = `<div class="head"><span class="eyebrow">Quiz</span><h1 class="page">Teste dein Wissen</h1>
    <p class="lead">${ALL_Q.length} Multiple-Choice-Fragen, je zehn pro Modul. Nach jeder Antwort siehst du die Erklärung. Falsche Antworten landen in deiner Wiederholungsliste.</p>
    <div class="actions"><a class="btn primary" href="#quiz-mix">Gemischt: 20 zufällige Fragen</a><a class="btn" href="#wiederholen">Fehler wiederholen (${wrongCount()})</a></div></div><div class="picker">`;
  MODULES.forEach(m => {
    const best = S.best[m.id];
    h += `<a class="mcard" href="#quiz-${m.id}"><span class="code">${esc(m.course)}</span><b>${esc(m.title)}</b><span class="chips">${best != null ? `<span class="chip ${best / qCount(m.id) >= 0.8 ? "ok" : "bad"}">Bestwert ${best}/${qCount(m.id)}</span>` : `<span class="chip">noch nicht gemacht</span>`}</span></a>`;
  });
  return h + `</div>`;
}

let Q = null;
function startQuiz(kind) {
  let ids, title, moduleId = null;
  if (kind === "mix") { ids = shuffle(ALL_Q).slice(0, 20); title = "Gemischtes Quiz"; }
  else if (kind === "wiederholen") { ids = shuffle(Object.keys(S.wrong).filter(id => qById[id])); title = "Fehler wiederholen"; }
  else { moduleId = kind; ids = QUIZ.modules.find(m => m.id === kind).questions.map(q => q.id); title = byId[kind].title; }
  Q = { kind, moduleId, title, ids, i: 0, answered: null, correct: 0, missed: [] };
}

function viewQuiz() {
  if (!Q.ids.length) return `<div class="head"><span class="eyebrow">Fehler wiederholen</span><h1 class="page">Nichts zu wiederholen</h1>
    <p class="lead">Du hast gerade keine falsch beantworteten Fragen offen. Mach ein Modul-Quiz oder das gemischte Quiz – Fehler landen dann automatisch hier.</p>
    <div class="actions"><a class="btn primary" href="#quiz-mix">Gemischtes Quiz starten</a><a class="btn" href="#quiz">Zur Quiz-Übersicht</a></div></div>`;
  if (Q.i >= Q.ids.length) return viewResult();
  const q = qById[Q.ids[Q.i]], a = Q.answered;
  let opts = q.options.map((o, k) => {
    let cls = "";
    if (a != null) { if (k === q.correct) cls = "right"; else if (k === a) cls = "wrong"; }
    return `<button class="opt ${cls}" data-opt="${k}" ${a != null ? "disabled" : ""}><span class="k">${"ABCD"[k]}</span><span>${esc(o)}</span></button>`;
  }).join("");
  let fb = "";
  if (a != null) fb = `<div class="feedback ${a === q.correct ? "ok" : "no"}"><b>${a === q.correct ? "Richtig." : "Nicht ganz. Richtig ist " + "ABCD"[q.correct] + "."}</b>${esc(q.explanation)}</div>`;
  return `<div class="head"><span class="eyebrow">Quiz · ${esc(Q.title)}</span></div>
  <div class="qbox">
    <div class="qmeta"><span>Frage ${Q.i + 1} von ${Q.ids.length}</span><span>${esc(byId[q.module].title)} · ${Q.correct} richtig</span></div>
    <div class="bar"><i style="width:${(Q.i + (a != null ? 1 : 0)) / Q.ids.length * 100}%"></i></div>
    <p class="qtext">${esc(q.question)}</p>
    <div class="opts">${opts}</div>${fb}
    <div class="qnav"><a class="btn" href="#quiz">Quiz beenden</a>${a != null ? `<button class="btn primary" id="nextBtn">${Q.i + 1 < Q.ids.length ? "Nächste Frage" : "Ergebnis anzeigen"}</button>` : `<span style="color:var(--muted);font-size:.85rem">Tipp: Tasten 1–4 wählen eine Antwort</span>`}</div>
  </div>`;
}

function viewResult() {
  const n = Q.ids.length, pct = Math.round(Q.correct / n * 100);
  const msg = pct >= 80 ? "Stark – das sitzt." : pct >= 50 ? "Solide Basis. Die Fehler unten lohnen einen zweiten Blick." : "Hier lohnt sich noch einmal die Zusammenfassung.";
  let h = `<div class="head"><span class="eyebrow">Ergebnis · ${esc(Q.title)}</span><h1 class="page">${msg}</h1></div>
  <div class="qbox"><div class="score">${Q.correct}/${n}</div><div class="bar"><i style="width:${pct}%"></i></div>
  <div class="actions" style="margin:0">
    ${Q.moduleId ? `<a class="btn primary" href="#quiz-${Q.moduleId}" data-restart="1">Nochmal</a><a class="btn" href="#modul-${Q.moduleId}">Zur Zusammenfassung</a>` : `<a class="btn primary" href="#${Q.kind === "mix" ? "quiz-mix" : "wiederholen"}" data-restart="1">Nochmal</a>`}
    ${wrongCount() ? `<a class="btn" href="#wiederholen" data-restart="1">Alle Fehler wiederholen (${wrongCount()})</a>` : ""}
    <a class="btn" href="#start">Zur Übersicht</a></div>`;
  if (Q.missed.length) {
    h += `<h2 class="section-title">Falsch beantwortet</h2><div class="review">` + Q.missed.map(id => {
      const q = qById[id]; return `<div><b>${esc(q.question)}</b><small>Richtig: ${esc(q.options[q.correct])}</small></div>`;
    }).join("") + `</div>`;
  }
  return h + `</div>`;
}

function answer(k) {
  if (!Q || Q.answered != null || Q.i >= Q.ids.length) return;
  const id = Q.ids[Q.i], q = qById[id];
  Q.answered = k;
  if (k === q.correct) { Q.correct++; delete S.wrong[id]; }
  else { Q.missed.push(id); S.wrong[id] = 1; }
  if (Q.i + 1 >= Q.ids.length && Q.moduleId) S.best[Q.moduleId] = Math.max(S.best[Q.moduleId] ?? 0, Q.correct);
  save(); paint(false);
}
function next() { if (!Q || Q.answered == null) return; Q.i++; Q.answered = null; paint(true); }

function viewReset() {
  return `<div class="head"><span class="eyebrow">Fortschritt</span><h1 class="page">Fortschritt zurücksetzen?</h1>
  <p class="lead">Gelesen-Markierungen, Quiz-Bestwerte und die Wiederholungsliste werden in diesem Browser gelöscht. Die Inhalte bleiben erhalten.</p>
  <div class="actions"><button class="btn primary" id="doReset">Ja, zurücksetzen</button><a class="btn" href="#start">Abbrechen</a></div></div>`;
}

let route = "start";
function paint(scrollTop) {
  const v = document.getElementById("view");
  let h;
  if (route === "start") h = viewStart();
  else if (route.startsWith("modul-")) h = viewModule(route.slice(6));
  else if (route === "quiz") h = viewQuizHome();
  else if (route === "reset") h = viewReset();
  else if (Q) h = viewQuiz();
  else h = viewStart();
  v.innerHTML = h;
  renderNav(route);
  if (scrollTop) window.scrollTo(0, 0);
}

function go() {
  route = (location.hash || "#start").slice(1) || "start";
  if (route === "quiz-mix") startQuiz("mix");
  else if (route === "wiederholen") startQuiz("wiederholen");
  else if (route.startsWith("quiz-") && byId[route.slice(5)]) startQuiz(route.slice(5));
  else if (!byId[route.slice(6)] && !["start", "quiz", "reset"].includes(route)) route = "start";
  closeNav(); paint(true);
}

document.addEventListener("click", e => {
  const t = e.target.closest("[data-opt],[data-read],[data-unread],#nextBtn,#doReset,[data-target],[data-restart]");
  if (!t) return;
  if (t.dataset.opt != null) answer(+t.dataset.opt);
  else if (t.dataset.read) { S.read[t.dataset.read] = 1; save(); paint(false); }
  else if (t.dataset.unread) { delete S.read[t.dataset.unread]; save(); paint(false); }
  else if (t.id === "nextBtn") next();
  else if (t.id === "doReset") { S = { read: {}, best: {}, wrong: {} }; save(); location.hash = "start"; }
  else if (t.dataset.target) { e.preventDefault(); document.getElementById(t.dataset.target)?.scrollIntoView({ behavior: "smooth", block: "start" }); }
  else if (t.dataset.restart && ("#" + route) === t.getAttribute("href")) { e.preventDefault(); go(); }
});
document.addEventListener("keydown", e => {
  if (!Q || route.startsWith("modul-") || ["start", "quiz", "reset"].includes(route)) return;
  if (["1", "2", "3", "4"].includes(e.key)) answer(+e.key - 1);
  else if (e.key === "Enter" && Q.answered != null) next();
});
const nav = document.getElementById("nav"), menuBtn = document.getElementById("menuBtn");
function closeNav() { nav.classList.remove("open"); menuBtn.setAttribute("aria-expanded", "false"); }
menuBtn.onclick = () => { const o = nav.classList.toggle("open"); menuBtn.setAttribute("aria-expanded", String(o)); };
window.addEventListener("hashchange", go);
go();
</script>

</body></html>
