e Texte und Bilder verkaufen (z. B. Lifestyle-Fotos mit Menschen, helle Hintergründe), schreibt Textvarianten und unterstützt <strong>A/B-Tests<\/strong> – Amazon-Tool <strong>„Manage Your Experiments“<\/strong> (nur Markeninhaber). Personalisierung: jüngere Käufer:innen reagieren stärker auf „stylisch“, „trendig“.<\/p>\n<h3>Gebotsstrategien (Bidding)<\/h3>\n<p><strong>Bidding<\/strong> = Gebote auf Keywords; das höhere Gebot wird ausgespielt. Manuell sehr aufwendig, Marktpreise schwanken.<\/p>\n<table>\n<thead>\n<tr>\n<th>Regelbasiert<\/th>\n<th>KI-basiert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>feste Regeln: „Wenn ACoS &gt; 30 %, Gebot −20 %“<\/td>\n<td>lernt aus Klicks, CR, Tageszeit, Gerät; passt live an<\/td>\n<\/tr>\n<tr>\n<td>einfach verständlich<\/td>\n<td>reagiert schneller, nutzt Budget effizienter<\/td>\n<\/tr>\n<tr>\n<td>starr<\/td>\n<td>weniger transparent<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>ACoS<\/strong> (Advertising Cost of Sales) = Werbekosten ÷ Umsatz × 100 (30 € Ads, 100 € Umsatz → 30 %).\n<strong>Amazon-intern:<\/strong> <em>Dynamic Bids – Up and Down<\/em> (bis +100 %, wenn Conversion wahrscheinlicher) · Rule-Based Adjustments mit Ober-/Untergrenzen. <strong>Extern:<\/strong> Helium10 Ads, Perpetua, Pacvue.\n<em>Praxis:<\/em> „Solarlampe Garten“ – tags CPC 0,60 € / CR 3 %, abends CPC 0,80 € / CR 8 % → KI erhöht abends die Gebote, mehr Umsatz trotz höherer Klickkosten.<\/p>\n<h3>Predictive Inventory Management<\/h3>\n<p>Vorhersage, <strong>wann<\/strong> und <strong>wie viel<\/strong> nachbestellt werden muss. Ziele: kein Out-of-Stock, geringe Lagerkosten, bessere Cashflow-Planung.\n- Out of Stock → keine Verkäufe, Ranking sinkt · zu viel Lager → Kosten, Überalterung\n- <strong>Datenquellen:<\/strong> Verkaufshistorie · Saison · geplante Aktionen · Markttrends · Retourenquoten\n- <strong>Tools:<\/strong> Restock Inventory Report (Seller Central, kostenlos, nur Amazon-Daten) · Helium10 Inventory Protector (mehr Quellen, SKU-genau, ERP)\n- <em>Beispiel:<\/em> Fitness-Tracker 50/Monat im Winter, ab Januar (Neujahrsvorsätze) 400/Monat → rechtzeitig auffüllen.<\/p>\n<h3>Trends<\/h3>\n<p>Personalisierung · <strong>Voice Commerce<\/strong> (Alexa – Nutzer nennen oft nur die Produktart, Markenaufbau wird wichtig) · <strong>visuelle Suche<\/strong> (Fotos → ähnliche Artikel) · <strong>Retail Media<\/strong> (Amazon als Werbeplattform, mehr Video-Ads) · Nachhaltigkeit/ESG (Climate Pledge Friendly) · Self-Optimizing Listings – Risiko: zu starke Abhängigkeit von Automatisierung.<\/p>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>A9 / A10<\/td>\n<td>Amazons Suchalgorithmus<\/td>\n<\/tr>\n<tr>\n<td>Sales Velocity<\/td>\n<td>Verkaufsgeschwindigkeit pro Zeitraum<\/td>\n<\/tr>\n<tr>\n<td>Backend Keywords<\/td>\n<td>unsichtbare Suchbegriffe nur für den Algorithmus<\/td>\n<\/tr>\n<tr>\n<td>A+ Content<\/td>\n<td>erweiterte Markeninhalte auf der Produktseite<\/td>\n<\/tr>\n<tr>\n<td>FBA / FBM<\/td>\n<td>Fulfillment by Amazon / by Merchant<\/td>\n<\/tr>\n<tr>\n<td>Buybox<\/td>\n<td>„In den Einkaufswagen“-Feld, 80–90 % der Käufe<\/td>\n<\/tr>\n<tr>\n<td>Sell-In / Sell-Through<\/td>\n<td>was Amazon einkauft / was Amazon verkauft<\/td>\n<\/tr>\n<tr>\n<td>ACoS<\/td>\n<td>Werbekostenanteil am Umsatz<\/td>\n<\/tr>\n<tr>\n<td>RoAS<\/td>\n<td>Umsatz pro Werbe-Euro (ACoS ist der Kehrwert in Prozent)<\/td>\n<\/tr>\n<tr>\n<td>Chargebacks<\/td>\n<td>Strafgebühren für Vendoren<\/td>\n<\/tr>\n<tr>\n<td>Vine<\/td>\n<td>Amazon-Programm für Produkttests mit Rezensionen<\/td>\n<\/tr>\n<tr>\n<td>SKU<\/td>\n<td>Stock Keeping Unit – Artikelnummer<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Typische Tutoriumsaufgaben<\/h2>\n<p>Drei Ranking-Faktoren priorisieren und begründen · Keyword-Recherche (2 Short-Tail, 3 Long-Tail) in Sistrix für Amazon · fehlerhaftes Listing finden und verbessern · Vendor oder Seller für ein Start-up · RoAS und Contribution Margin berechnen · Wettbewerbsanalyse in Maßnahmen übersetzen (Rabatte, Qualitätskritik, Ads-Konkurrenz) · klassischer vs. KI-Listungsprozess · regelbasiertes vs. KI-Bidding für einen kleinen Shop · Predictive Inventory für Fitnessprodukte. Gruppenübungen: JungleScout vs. Amalyze, KI-Check für den gesamten Amazon-Prozess.<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Worin unterscheidet sich das Amazon-Ranking grundlegend vom Google-Ranking?<\/strong>\n   → Amazon rankt nach Relevanz + Verkaufsperformance, Google nach Relevanz + Autorität (Backlinks).<\/li>\n<li><strong>Warum gehören die wichtigsten Keywords an den Titelanfang?<\/strong>\n   → Mobil werden nur ca. 70–80 Zeichen angezeigt.<\/li>\n<li><strong>Welche Anforderungen gelten für das Hauptbild?<\/strong>\n   → Weißer Hintergrund, Produkt füllt ≥ 85 %, keine Logos/Texte/Wasserzeichen, mind. 1000 × 1000 px.<\/li>\n<li><strong>Wofür sind Backend Keywords da?<\/strong>\n   → Für Synonyme, Schreibvarianten und alternative Begriffe, die Kund:innen nicht sehen; ohne Wiederholung aus dem Titel.<\/li>\n<li><strong>Was passiert bei Out of Stock?<\/strong>\n   → Keine Verkäufe und das Ranking bricht ein.<\/li>\n<li><strong>Was unterscheidet Vendor und Seller?<\/strong>\n   → Vendor verkauft an Amazon (Amazon bestimmt Preis); Seller verkauft selbst an Endkunden (eigene Preishoheit).<\/li>\n<li><strong>Berechne den ACoS: 60 € Werbekosten, 300 € Umsatz.<\/strong>\n   → 20 %.<\/li>\n<li><strong>Was ist die Buybox und warum ist sie so wichtig?<\/strong>\n   → Das Kauf-Feld auf der Produktseite; 80–90 % der Käufe laufen darüber.<\/li>\n<li><strong>Was ist der Nachteil von regelbasiertem Bidding?<\/strong>\n   → Starre Regeln ohne intelligente Anpassung an Tageszeit, Gerät oder Marktveränderungen.<\/li>\n<li><strong>Was ist Sell-In vs. Sell-Through?<\/strong>\n    → Sell-In: wie viel Amazon beim Vendor einkauft. Sell-Through: wie viel Amazon an Endkunden verkauft.<\/li>\n<\/ol>"}, {"id": "kundenkommunikation", "title": "Service & Kundenkommunikation", "course": "MKT-235", "html": "<p><strong>Modul:<\/strong> MKT-235 (Modul 4, Tage 1–5) · <strong>Grundlage:<\/strong> 5 Vorlesungen + 5 Tutorien in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Tag<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Schriftliche Kundenkommunikation: Qualität, Service &amp; KI<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Schriftliche Kundenkommunikation mit KI: Qualität, Verantwortung &amp; Praxis<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Service-Kommunikation skalieren: Templates, Risiken, Handoff-Regeln &amp; Qualitätskontrolle<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Professioneller Telefonservice: Gespräche führen statt nur reagieren<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Professioneller Telefonservice: Eskalationen erkennen, steuern, lösen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> Service ist Teil des Geschäfts, nicht nur Support. Gute Kommunikation ist klar, konkret und nennt immer den nächsten Schritt. KI liefert Entwürfe – <strong>entscheiden und verantworten bleibt menschlich<\/strong>. Am Telefon führt, wer Struktur gibt: Phasen, Call Control, Deeskalation, saubere Übergabe.<\/p>\n<blockquote>\n<p><strong>Merksatz:<\/strong> Marketing weckt Erwartungen – Service entscheidet, ob sie erfüllt werden.<\/p>\n<\/blockquote>\n<hr />\n<h2>Tag 1 · Schriftlicher Service: Qualität &amp; Erwartungen<\/h2>\n<table>\n<thead>\n<tr>\n<th>Support<\/th>\n<th>Service<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>reagiert auf Probleme<\/td>\n<td>schafft Vertrauen und bindet Kunden<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Schriftliche Kommunikation ist kritisch:<\/strong> keine direkte Rückfrage, Ton und Inhalt bleiben dokumentiert, alles kann weitergeleitet werden. <em>„Geschriebener Service bleibt – gute wie schlechte Antworten.“<\/em>\n<strong>Kunden vergleichen branchenübergreifend<\/strong> – mit dem besten Erlebnis, das sie kennen. Servicequalität ist Wahrnehmung, keine objektive Messung.<\/p>\n<p><strong>Fünf Erwartungsdimensionen:<\/strong> Geschwindigkeit · Klarheit · Verlässlichkeit · Transparenz · Wertschätzung.<\/p>\n<h3>Service entlang der Customer Journey<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Rolle des Service<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Awareness<\/td>\n<td>Bewertungen und geteilte Antworten prägen Erwartungen<\/td>\n<\/tr>\n<tr>\n<td>Consideration<\/td>\n<td>FAQs, Liefer- und Rückgabeinfos – Unklarheit kostet Vertrauen schon vor dem Kauf<\/td>\n<\/tr>\n<tr>\n<td>Purchase<\/td>\n<td>Fragen zu Zahlung, Lieferung – Fehler brechen Käufe ab<\/td>\n<\/tr>\n<tr>\n<td>Retention<\/td>\n<td>Lieferstatus, Retouren, Reklamationen – Ton und Klarheit entscheiden<\/td>\n<\/tr>\n<tr>\n<td>Advocacy<\/td>\n<td>Umgang mit Problemen nach dem Kauf prägt Empfehlungen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Präventiver Service<\/th>\n<th>Reaktiver Service<\/th>\n<th>Lernender Service<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>verhindert Rückfragen (Awareness, Consideration)<\/td>\n<td>löst Anliegen (Purchase, Retention)<\/td>\n<td>verbessert Prozesse (alle Phasen)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>„Der beste Servicekontakt ist der, der gar nicht entsteht – weil alles klar war.“<\/p>\n<\/blockquote>\n<h3>Plain Language<\/h3>\n<ul>\n<li><strong>Kurze Sätze<\/strong> – max. 20 Wörter<\/li>\n<li><strong>Aktiv:<\/strong> „Wir senden Ihnen …“ statt „Ihnen wird zugesendet …“<\/li>\n<li><strong>Bekannte Begriffe:<\/strong> „Lieferzeit“ statt „Fulfillment-Zyklus“<\/li>\n<li><strong>Listen<\/strong> für Struktur<\/li>\n<li><strong>Nutzerperspektive:<\/strong> „Sie erhalten …“ statt „Wir bieten …“<\/li>\n<li><strong>Konkret:<\/strong> „Lieferung am Dienstag, 15. März“ statt „in 3–5 Werktagen“<\/li>\n<\/ul>\n<p>❌ „Sehr geehrter Kunde, Ihre Anfrage bezüglich der Sendungsverfolgung wurde an unsere Logistikabteilung weitergeleitet. Die Bearbeitung erfolgt gemäß unserer internen Prozesse innerhalb der nächsten 3–5 Werktage.“ → passiv, unpersönlich, vage, keine Lösung\n✅ „Hallo Frau Müller, ich habe Ihre Sendung geprüft. Sie wird am Mittwoch, 20. März, bei Ihnen ankommen. Sie erhalten am Liefertag eine SMS mit dem genauen Zeitfenster. Haben Sie weitere Fragen? Ich helfe gerne.“<\/p>\n<p><strong>Präventive Kommunikation:<\/strong> Konkrete Liefertermine statt „Shipping Speed“ senken „Where is my order?“-Anfragen laut Folien um <strong>bis zu 30 %<\/strong>.<\/p>\n<h3>Service-KPIs<\/h3>\n<table>\n<thead>\n<tr>\n<th>KPI<\/th>\n<th>Frage<\/th>\n<th>Typischer Fehler<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>FCR<\/strong> – First Contact Resolution<\/td>\n<td>Muss der Kunde nicht erneut nachfragen?<\/td>\n<td>vage Aussagen, kein nächster Schritt<\/td>\n<\/tr>\n<tr>\n<td><strong>CSAT<\/strong> – Customer Satisfaction Score<\/td>\n<td>Wie zufrieden ist der Kunde danach?<\/td>\n<td>korrekt gelöst, aber falscher Ton<\/td>\n<\/tr>\n<tr>\n<td><strong>AHT<\/strong> – Average Handle Time<\/td>\n<td>Wie lange dauert ein Fall im Schnitt?<\/td>\n<td>zu kurz kann Qualität schaden<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>„KPIs bewerten Prozesse – nicht Menschen.“<\/p>\n<\/blockquote>\n<h3>KI als Assistenz<\/h3>\n<ul>\n<li><strong>Gut für:<\/strong> Struktur, Formulierungen, sachlich-freundlicher Ton, Standardanfragen (Lieferstatus, Retoureninfos, Bestätigungen)<\/li>\n<li><strong>Grenzen:<\/strong> keine echte Empathie, keine rechtlichen Entscheidungen, kein Ermessensspielraum, kein Wissen über interne Zusagen → <strong>Kulanz, emotionale Beschwerden, Geld/Haftung = menschlich<\/strong><\/li>\n<li><strong>Transaktionale Kommunikation<\/strong> (Status, Tracking, Fakten) → gut für KI<\/li>\n<li><strong>Relationale Kommunikation<\/strong> (Beschwerden, Eskalation, Kulanz, Vertrauen) → braucht Menschen<\/li>\n<\/ul>\n<blockquote>\n<p>„KI darf informieren – entscheiden muss der Mensch.“ · „Je mehr Entscheidung, desto mehr menschliche Kontrolle.“<\/p>\n<\/blockquote>\n<hr />\n<h2>Tag 2 · KI-Drafts, Human-in-the-Loop &amp; Qualitätssicherung<\/h2>\n<p>Jede Antwort ist ein <strong>Micro-Touchpoint<\/strong> auf Marke und Conversion – oft der erste, entscheidende oder letzte Kontakt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Antwortform<\/th>\n<th>Kontrolle<\/th>\n<th>Risiko<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Textbaustein<\/td>\n<td>vollständig menschlich<\/td>\n<td>gering<\/td>\n<\/tr>\n<tr>\n<td>Regelantwort<\/td>\n<td>systemgesteuert<\/td>\n<td>mittel<\/td>\n<\/tr>\n<tr>\n<td><strong>KI-Draft<\/strong><\/td>\n<td>menschlich verpflichtend<\/td>\n<td>kontrollierbar<\/td>\n<\/tr>\n<tr>\n<td>Autonome KI<\/td>\n<td>vollautomatisch<\/td>\n<td>hoch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Qualitätsillusion:<\/strong> KI schreibt sprachlich perfekt, hat aber kein situatives Verständnis, keine Empathie, keine Verantwortung. <em>Sprachliche Brillanz ≠ Servicequalität.<\/em>\n<strong>Nutzen von KI-Drafts (laut Folien):<\/strong> Antwortzeit −60 % bei Standardanfragen, konsistente Struktur, Skalierung ohne proportional mehr Personal.<\/p>\n<h3>Human-in-the-Loop (HITL)<\/h3>\n<p><strong>Pflichtregel:<\/strong> Jeder KI-Draft wird <strong>geprüft, angepasst, freigegeben<\/strong> – kein KI-Text ohne menschliche Freigabe.\n| KI | Mensch |\n|---|---|\n| formuliert, strukturiert, beschleunigt | bewertet, entscheidet, verantwortet |<\/p>\n<p><strong>HITL nach Risikostufe:<\/strong> Standardfall → KI + kurze Prüfung · Mischfall → KI-Struktur + menschliche Feinabstimmung · Entscheidungsfall → KI nur als Hilfe.\n<strong>HITL-Fallen:<\/strong> „Durchwinken“ unter Zeitdruck · unklare Verantwortung · QA ohne Kriterien.<\/p>\n<p><strong>Sechs Qualitätskriterien:<\/strong> inhaltliche Korrektheit · Kontextangemessenheit · Tonalität &amp; Empathie · Marken- &amp; Sprachstil · rechtliche Unbedenklichkeit · Accessibility &amp; Inclusion.<\/p>\n<h3>Prompt-Bausteine &amp; Standard-Prompt<\/h3>\n<p><strong>Rolle · Kontext · Ziel · Rahmen · Länge.<\/strong><\/p>\n<blockquote>\n<p><em>Rolle:<\/em> professioneller Kundenservice-Mitarbeiter eines deutschen Unternehmens · <em>Kontext:<\/em> [Originalanfrage] · <em>Ziel:<\/em> sachlicher, freundlicher, verständlicher Entwurf · <em>Rahmen:<\/em> keine rechtlichen Zusagen, keine Schuldzuweisungen, klare Struktur, lösungsorientiert, max. 150 Wörter · <em>Hinweis:<\/em> Entwurf wird menschlich geprüft.<\/p>\n<\/blockquote>\n<h3>QA-Checkliste – nur bei durchgehend „Ja“ freigeben<\/h3>\n<p>Fachlich korrekt? · Anfrage vollständig beantwortet? · Ton angemessen? · Keine KI-Floskeln? · Markenstil eingehalten? · Rechtlich unbedenklich? · <strong>Würde ich das selbst so senden?<\/strong><\/p>\n<h3>Bewertungsmatrix (Rubric) – Zielwert Ø ≥ 4,5<\/h3>\n<table>\n<thead>\n<tr>\n<th>Kriterium<\/th>\n<th>1<\/th>\n<th>3<\/th>\n<th>5<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fachliche Richtigkeit<\/td>\n<td>fehlerhaft<\/td>\n<td>korrekt<\/td>\n<td>präzise<\/td>\n<\/tr>\n<tr>\n<td>Kontextbezug<\/td>\n<td>allgemein<\/td>\n<td>passend<\/td>\n<td>individuell<\/td>\n<\/tr>\n<tr>\n<td>Tonalität<\/td>\n<td>unpassend<\/td>\n<td>höflich<\/td>\n<td>empathisch<\/td>\n<\/tr>\n<tr>\n<td>Klarheit<\/td>\n<td>unklar<\/td>\n<td>verständlich<\/td>\n<td>sehr klar<\/td>\n<\/tr>\n<tr>\n<td>Markenwirkung<\/td>\n<td>neutral<\/td>\n<td>konsistent<\/td>\n<td>markenstärkend<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Gesamtprozess:<\/strong> Anfrage → KI-Draft mit Prompt → HITL-Prüfung → QA-Checkliste → Anpassung → (Rubric-Scoring) → Freigabe → Versand.<\/p>\n<p><em>Übungsbeispiel:<\/em> Draft B („Ihre Retoure #47892 ist eingegangen. Rückerstattung von 89,99 € spätestens Montag, 20.01. …“) schlägt Draft A („Gutschrift gemäß unseren AGB innerhalb von 14 Tagen“) – konkret, persönlich, mit nächstem Schritt.<\/p>\n<hr />\n<h2>Tag 3 · Skalieren mit Templates, Handoff &amp; QA<\/h2>\n<blockquote>\n<p><strong>Kernidee:<\/strong> Erst entscheiden, dann schreiben.<\/p>\n<\/blockquote>\n<p><strong>Zwei Fehlentwicklungen:<\/strong> <em>Überstandardisierung<\/em> (Antwort passt nicht, wirkt abweisend → Eskalation) vs. <em>Überindividualisierung<\/em> (jede Antwort neu, widersprüchlich, Zusagen ohne Befugnis → Risiko).<\/p>\n<h3>Die 3 Entscheidungsfragen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Frage<\/th>\n<th>Folge<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wiederkehrend + klar geregelt?<\/td>\n<td><strong>Standardfall<\/strong> – Template/KI möglich<\/td>\n<\/tr>\n<tr>\n<td>Braucht Kontext, Bewertung, Ermessen?<\/td>\n<td><strong>Mischfall<\/strong> – Individualisierung, Mensch im Loop<\/td>\n<\/tr>\n<tr>\n<td>Rechtlich, emotional oder finanziell relevant?<\/td>\n<td><strong>Entscheidungsfall<\/strong> – menschliche Entscheidung zwingend<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>„Automatisierung endet dort, wo Verantwortung beginnt.“<\/p>\n<\/blockquote>\n<h3>Standardantworten (Makros)<\/h3>\n<p>Prozessgebundene Vorlagen – nicht Copy-Paste. <strong>Makro-Gerüst:<\/strong> Einstieg/Bestellnummer → Fakt/Status → nächster Schritt → Zeit/Frist → Call-to-Action → Hilfe/Abschluss.\n<strong>Muster „Was passiert? Was jetzt?“:<\/strong> Status → was muss ich tun (nur wenn nötig) → bis wann → wo bekomme ich Hilfe.<\/p>\n<table>\n<thead>\n<tr>\n<th>✓ Do<\/th>\n<th>✗ Don't<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>„Ich habe das geprüft …“<\/td>\n<td>„Gemäß internen Prozessen …“<\/td>\n<\/tr>\n<tr>\n<td>„Das ist der nächste Schritt …“<\/td>\n<td>„Da können wir nichts machen …“<\/td>\n<\/tr>\n<tr>\n<td>„Spätestens am …“<\/td>\n<td>„Bitte haben Sie Geduld.“<\/td>\n<\/tr>\n<tr>\n<td>„Wenn du möchtest, übernehme ich das.“<\/td>\n<td>„wurde weitergeleitet“ ohne Ergebnis<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Makro-Governance:<\/strong> Owner je Kategorie (Shipping, Returns, Payment) + Review-Rhythmus – „Vorlagen brauchen Pflege, sonst werden sie zum Risiko.“\n<strong>Top-8-Standardfälle E-Commerce:<\/strong> WISMO (Where is my order) · Lieferverzögerung · Rechnung erneut senden · Rücksendung starten · Retoure bestätigen · Zahlungsproblem · Produktfrage · Stornierung.<\/p>\n<h3>Kontrollierte Individualisierung<\/h3>\n<ul>\n<li><strong>Variablen:<\/strong> Name, OrderID, Betrag, Datum, Tracking, Produkt<\/li>\n<li><strong>Fallbacks (Pflicht!):<\/strong> <code>Hallo {{first_name | Fallback: 'Guten Tag'}}<\/code> – ein Template ist erst fertig, wenn es auch ohne Daten sauber klingt (kein „Hallo ,“)<\/li>\n<li><strong>Mischfall-Template:<\/strong> Bezug + Fakt → Next Step → Datum/Frist → CTA → Hilfe; <strong>max. 1 Satz Freitext<\/strong><\/li>\n<li><strong>Lesbarkeit:<\/strong> kurze Absätze, Listen, beschreibende Links („Retourenlabel herunterladen“), keine wichtigen Infos in Emojis/Bildern<\/li>\n<li><strong>Zustellbarkeit:<\/strong> sachlicher Betreff („Update zu Bestellung #12345“), keine Werbesprache, wenige Links, Text zuerst<\/li>\n<li><strong>Safety:<\/strong> erst verifizieren, dann handeln; keine sensiblen Daten abfragen, keine Zusagen ohne Befugnis<\/li>\n<\/ul>\n<h3>KI-Transparenz &amp; Human Handoff<\/h3>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Wann<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Pflicht<\/strong><\/td>\n<td>KI-Chat/Bots im Dialog, vollautomatische Antworten<\/td>\n<\/tr>\n<tr>\n<td><strong>Empfohlen<\/strong><\/td>\n<td>KI-Entwürfe, die menschlich geprüft wurden (Policy-Entscheid)<\/td>\n<\/tr>\n<tr>\n<td><strong>Optional<\/strong><\/td>\n<td>rein menschliche Kommunikation<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>EU-KI-Verordnung Art. 50 (gilt seit 2. August 2026, durch den Digital Omnibus nicht verschoben):<\/strong> Kund:innen müssen eindeutig und rechtzeitig informiert werden, wenn sie mit KI interagieren oder KI-Inhalte erhalten – kanalunabhängig; entscheidend ist die Wahrnehmbarkeit.\n<strong>Disclosure-Library:<\/strong> Chat: „Hinweis: Du schreibst mit unserem Service-Assistenten (KI).“ · Mail: „Diese Antwort wurde mithilfe automatisierter Systeme erstellt und durch unser Serviceteam geprüft.“ – ein Satz reicht.\n<strong>Human Handoff:<\/strong> „Wenn du möchtest, übernimmt ein Mensch. Antworte einfach mit ‚Mensch‘.“ – nimmt Druck raus, schafft Fairness.<\/p>\n<h3>QA &amp; Review<\/h3>\n<p><strong>Häufige Praxisfehler:<\/strong> Kulanzfälle mit Standardtext abbügeln · emotionale Beschwerden wie Statusanfragen behandeln · Zusagen ohne Befugnis · fehlender Transparenzhinweis · kein Next Step.\n<strong>QA-Kalibrierung (monatlich, 30–45 Min):<\/strong> 5 echte Tickets → alle scoren unabhängig → Abweichungen diskutieren → Rubric nachschärfen → Teamstandard fixieren.\n<strong>Sampling-Plan:<\/strong> KI-Drafts <strong>10 %<\/strong> zufällig · Entscheidungsfälle <strong>100 %<\/strong> · Beschwerden mit negativem Ton <strong>100 %<\/strong>.\n<strong>Final Gate:<\/strong> Fall richtig klassifiziert · Fakten konkret · Next Step klar · Ton passend · keine riskanten Zusagen · Variablen/Fallbacks · Transparenzsatz · Datenschutz/PII (nur Ticket-/Order-ID).<\/p>\n<blockquote>\n<p>„Guter Kundenservice heißt nicht, alles zuzusagen – sondern klar, fair und verantwortungsvoll zu entscheiden.“<\/p>\n<\/blockquote>\n<hr />\n<h2>Tag 4 · Telefonservice: Gespräche führen<\/h2>\n<p>Am Telefon fehlen Mimik und Blickkontakt – darum klar führen.<\/p>\n<h3>Die 5 Gesprächsphasen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Dauer<\/th>\n<th>Kern<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Begrüßung + Rahmen<\/td>\n<td>20–30 s<\/td>\n<td>„Guten Tag, hier ist [Vorname] von [Firma]. Wie kann ich Ihnen helfen?“ (konservative Branchen: Vor- + Nachname)<\/td>\n<\/tr>\n<tr>\n<td>2. Anliegen klären<\/td>\n<td>60–120 s<\/td>\n<td>offene Frage → 1–2 Nachfragen → <strong>Ein-Satz-Zusammenfassung<\/strong> („Stimmt das so?“)<\/td>\n<\/tr>\n<tr>\n<td>3. Lösung führen<\/td>\n<td>2–4 min<\/td>\n<td>„<strong>Ich kümmere mich darum.<\/strong>“ + Zeitrahmen; <strong>zwei Optionen + Empfehlung<\/strong><\/td>\n<\/tr>\n<tr>\n<td>4. Checkback<\/td>\n<td>20–30 s<\/td>\n<td>„Passt das für Sie so? Ist noch etwas offen?“<\/td>\n<\/tr>\n<tr>\n<td>5. Abschluss<\/td>\n<td>20–30 s<\/td>\n<td>Zusammenfassung → Next Step bis [Zeitpunkt] → Dank<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Merksatz: <strong>Start → Klarheit → Lösung → Kontrolle → Abschluss.<\/strong> Wenn der Kunde lospoltert: „Alles klar – ich helfe Ihnen. Ich stelle kurz 1–2 Fragen, dann lösen wir das.“<\/p>\n<h3>Call Control<\/h3>\n<ol>\n<li><strong>Tempo runter:<\/strong> ein Gedanke pro Satz, nach Fragen 1–2 Sekunden Pause<\/li>\n<li><strong>Unterbrechungen steuern:<\/strong> „Ich stoppe Sie kurz – ich möchte es wirklich richtig lösen. Ich fasse kurz zusammen …“ (sanft bei Emotion, klar bei Dominanz – Tonlage anpassen, Struktur bleibt)<\/li>\n<li><strong>Loop-Breaker:<\/strong> „Ich verstehe Sie. Es gibt zwei Wege: A oder B. Was ist Ihnen lieber?“ – nur zwei lösbare Optionen, dann umsetzen<\/li>\n<li><strong>Hold vs. Callback:<\/strong> kurz klärbar (1–2 min) → Hold („ca. 30 Sekunden, ich bleibe dran“); aufwendig → Callback („Ich rufe Sie bis [Uhrzeit] zurück. Passt das?“)<\/li>\n<\/ol>\n<h3>Micro-Compliance (Datenschutz am Telefon)<\/h3>\n<ul>\n<li>Nur Nötiges abfragen · erst prüfen, dann handeln · keine Daten ungewollt herausgeben<\/li>\n<li><strong>Identitätsprüfung<\/strong>, wenn es „weh tun könnte“: Adressänderung, Storno/Erstattung, Konto- oder Zahlungsdaten<\/li>\n<li>Bestellanfragen → Nachname + Bestellnummer<\/li>\n<li>Konto &amp; sensible Daten → Nachname + Kundennummer + PIN/Passwort<\/li>\n<li><em>Beispiel aus den Folien:<\/em> 1&amp;1 wurde wegen zu schwacher Telefon-Authentifizierung in Millionenhöhe sanktioniert<\/li>\n<li><strong>Aufzeichnung:<\/strong> Hinweis + <strong>aktive Zustimmung<\/strong> (Information allein reicht nicht), Speicherdauer nennen, Alternative (E-Mail/Chat) anbieten<\/li>\n<li><strong>Nie herausgeben:<\/strong> Daten Dritter, interne Sicherheitsdetails, Passwörter. Sicherer Satz: „Das kann ich aus Datenschutzgründen nicht teilen – ich kann Ihnen aber Folgendes anbieten …“<\/li>\n<\/ul>\n<h3>Voice-AI Assist<\/h3>\n<p>Live-Transkript · Knowledge Assist · Next-Step-Hinweise · Post-Call Summary.\n<strong>3 goldene Regeln:<\/strong> KI ist Assistenz, du bist verantwortlich · nichts ungeprüft übernehmen · Technik in Kundensprache übersetzen („Policy: Out of Stock“ → „Das Produkt ist leider ausverkauft – ich biete Ihnen sofort eine Alternative an.“).\n<strong>Summary-Fehler:<\/strong> falsche Zeiten, vertauschte Namen/Nummern, nie Gesagtes → immer gegen Call und Bestelldaten prüfen.\n<strong>Transparenz:<\/strong> relevant bei Bot-Stimme und Emotionserkennung; meist nicht bei interner Assistenz.<\/p>\n<h3>Smart Handoff<\/h3>\n<p><strong>Smart<\/strong> = Kunde muss nichts wiederholen, nächster Agent kann sofort weitermachen, nächster Schritt klar.\n<strong>Trigger:<\/strong> Berechtigung/Limit · Spezialwissen · Eskalation.\n<strong>Warm Transfer in 20 Sekunden:<\/strong>\n- <em>Intern (10 s):<\/em> „Kunde Müller, Bestellnr. 12345, Lieferverzug, Ziel: Express oder Storno.“\n- <em>Kunde (10 s):<\/em> „Ich verbinde Sie jetzt mit meiner Kollegin aus [Team]. Sie kann das direkt lösen. Ich gebe alles mit – Sie müssen nichts wiederholen.“<\/p>\n<p><strong>Post-Call Summary im 5-Zeilen-Format:<\/strong> 1. Kunde + Bestellnummer · 2. Problem (1 Satz) · 3. Aktion · 4. Next Step + Zeitpunkt · 5. Status (offen/erledigt).\n<strong>No-Gos:<\/strong> „Da kann ich nichts machen.“ · „Rufen Sie nochmal an.“ · „Das ist nicht mein Bereich.“<\/p>\n<hr />\n<h2>Tag 5 · Eskalationen erkennen, steuern, lösen<\/h2>\n<h3>Aktives Zuhören unter Druck<\/h3>\n<p>Kurz zeigen: Ich habe verstanden, <em>was passiert ist<\/em>, <em>was es auslöst<\/em> und <em>ich löse das jetzt<\/em> – kein Therapie-Modus.\n| Technik | Wann | Beispiel |\n|---|---|---|\n| <strong>Spiegeln<\/strong> | Kunde redet schnell/chaotisch | „Okay – es geht um ein fehlendes Paket, und Sie haben schon mehrfach versucht, Hilfe zu bekommen.“ |\n| <strong>Paraphrasieren<\/strong> | aus Emotion einen Auftrag machen | „Wenn ich Sie richtig verstehe, ist das Problem X, und Ihnen ist wichtig, dass Y heute geklärt wird.“ |\n| <strong>Zusammenfassen + Check<\/strong> | vor Lösung oder Übergabe | „Kurz zusammengefasst: … – stimmt das?“ |<\/p>\n<p><strong>Empathie-Satz:<\/strong> „Ich verstehe, dass das gerade richtig ärgerlich ist.“ – bestätigt das Gefühl, nicht die Schuld. <strong>Erst Verständnis, dann Lösung.<\/strong><\/p>\n<blockquote>\n<p>„Je höher die Emotion, desto kürzer und klarer die Sätze.“<\/p>\n<\/blockquote>\n<h3>Das Ampelmodell (Sentiment)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Zeichen<\/th>\n<th>Reaktion<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>🟢 <strong>Grün<\/strong><\/td>\n<td>sachlich, kooperativ, normales Tempo<\/td>\n<td>normaler Lösungsmodus<\/td>\n<\/tr>\n<tr>\n<td>🟡 <strong>Gelb<\/strong><\/td>\n<td>schneller, Wiederholungen, „immer/nie“, Vorwürfe, Unterbrechungen<\/td>\n<td>aktives Zuhören + Struktur + Tempo runter: „Ich verstehe Sie. Ich fasse kurz zusammen, dann lösen wir es Schritt für Schritt.“<\/td>\n<\/tr>\n<tr>\n<td>🔴 <strong>Rot<\/strong><\/td>\n<td>laut, Drohungen („Anwalt“, „Shitstorm“), Beleidigungen, „Ich kündige sofort!“<\/td>\n<td>Deeskalationsprotokoll + Grenzen + ggf. Handoff<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p>„Gelb ist dein bester Moment. Rot ist dein Notfallmodus.“<\/p>\n<\/blockquote>\n<p><strong>Sentiment-AI<\/strong> (z. B. Amazon Connect + Contact Lens, Observe.AI, Cresta, Balto) ist ein <strong>Frühwarnsignal, kein Urteil<\/strong> – niemals „Die KI sagt, Sie sind negativ“. Bei Emotionserkennung besteht nach Art. 50 KI-VO eine Informationspflicht; der Wortlaut kommt vom Unternehmen.<\/p>\n<h3>Das 6-Schritte-Deeskalationsprotokoll<\/h3>\n<table>\n<thead>\n<tr>\n<th>Schritt<\/th>\n<th>Ziel<\/th>\n<th>Formulierung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Stopp + Tempo runter<\/td>\n<td>Stabilität<\/td>\n<td>„Okay – ich bin bei Ihnen. Ich kläre das jetzt mit Ihnen.“<\/td>\n<\/tr>\n<tr>\n<td>2. Anerkennen (ohne Schuld)<\/td>\n<td>Gefühl bestätigen<\/td>\n<td>„Ich verstehe, dass das gerade richtig ärgerlich ist.“<\/td>\n<\/tr>\n<tr>\n<td>3. Ziel klären<\/td>\n<td>Emotion → Ziel<\/td>\n<td>„Was ist Ihnen jetzt am wichtigsten: A oder B?“<\/td>\n<\/tr>\n<tr>\n<td>4. 2 Optionen + Führung<\/td>\n<td>Kontrolle zurückgeben<\/td>\n<td>„Ich kann Ihnen zwei Wege anbieten … Ich empfehle A, weil …“<\/td>\n<\/tr>\n<tr>\n<td>5. Commitment holen<\/td>\n<td>kleines „Ja“<\/td>\n<td>„Passt das so für Sie? Dann machen wir das genau so.“<\/td>\n<\/tr>\n<tr>\n<td>6. Abschluss mit Next Action<\/td>\n<td>Sicherheit<\/td>\n<td>„Wir machen X, und Sie bekommen Y bis [Zeitpunkt].“<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Grenzen setzen – um zur Lösung zurückzukommen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Situation<\/th>\n<th>Satz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Lauter Ton<\/td>\n<td>„Ich möchte Ihnen gern helfen. Dafür brauche ich einen ruhigen Ton.“<\/td>\n<\/tr>\n<tr>\n<td>Beleidigung<\/td>\n<td>„Ich helfe Ihnen gern weiter – Beleidigungen kann ich nicht akzeptieren. Wenn wir ruhig bleiben, lösen wir das jetzt.“<\/td>\n<\/tr>\n<tr>\n<td>Drohung<\/td>\n<td>„Ich nehme das zur Kenntnis und dokumentiere es. Ich biete Ihnen jetzt folgende Lösung an: …“<\/td>\n<\/tr>\n<tr>\n<td>Endlose Vorwürfe<\/td>\n<td>„Ich verstehe Ihren Punkt. Wichtig ist jetzt, wie wir das konkret lösen.“<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Hot-Call-Antwort in 3 Sätzen:<\/strong> „Ich verstehe, dass das ärgerlich ist.“ → „Was ist Ihnen jetzt am wichtigsten: A oder B?“ → „Ich empfehle A, weil … dann passiert X bis [Zeitpunkt].“\n<strong>Fünf Problemtypen:<\/strong> Endlosschleife · Unterbrecher · Schuldzuweiser · „Ich will sofort“ · Beleidigend – jeweils mit festem Satz-Tool statt emotionaler Reaktion.<\/p>\n<blockquote>\n<p>„Eskalation ist trainierbar: Kippmoment erkennen → richtige Technik einsetzen → Gespräch stabilisieren.“<\/p>\n<\/blockquote>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Plain Language<\/td>\n<td>klare, einfache, aktive Sprache<\/td>\n<\/tr>\n<tr>\n<td>FCR / CSAT / AHT<\/td>\n<td>Lösung beim ersten Kontakt / Zufriedenheit / Bearbeitungszeit<\/td>\n<\/tr>\n<tr>\n<td>HITL<\/td>\n<td>Human-in-the-Loop – Mensch prüft und gibt frei<\/td>\n<\/tr>\n<tr>\n<td>KI-Draft<\/td>\n<td>KI-Entwurf, kein Versandtext<\/td>\n<\/tr>\n<tr>\n<td>Rubric<\/td>\n<td>Bewertungsmatrix mit Punkteskala<\/td>\n<\/tr>\n<tr>\n<td>Makro<\/td>\n<td>prozessgebundene Standardantwort<\/td>\n<\/tr>\n<tr>\n<td>WISMO<\/td>\n<td>„Where is my order?“<\/td>\n<\/tr>\n<tr>\n<td>Fallback<\/td>\n<td>Ersatzwert, wenn eine Variable fehlt<\/td>\n<\/tr>\n<tr>\n<td>Warm Transfer<\/td>\n<td>Übergabe mit Kontext, ohne dass der Kunde wiederholen muss<\/td>\n<\/tr>\n<tr>\n<td>Loop-Breaker<\/td>\n<td>zwei Optionen, um eine Gesprächsschleife zu beenden<\/td>\n<\/tr>\n<tr>\n<td>Sentiment<\/td>\n<td>Stimmung im Gespräch (Ampel)<\/td>\n<\/tr>\n<tr>\n<td>PII<\/td>\n<td>personenbezogene Daten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Typische Tutoriumsaufgaben<\/h2>\n<p>Service-Antworten analysieren und Customer-Journey-Phasen zuordnen · drei Anliegen auf KI-Eignung prüfen · KI-Draft „Ihre Anfrage wurde registriert …“ verbessern · Drafts mit der Rubric vergleichen · Fälle A/B/C als Standard-/Misch-/Entscheidungsfall einordnen (Versandbestätigung fehlt / Teil fehlt / dritte Verspätung + Anwalt) · Rückerstattungs-Template mit Fallbacks (max. 120 Wörter) · KI-Retourentext nach Checkliste überarbeiten · Telefonat in 5 Phasen · Call-Control-Mini-Dialog · Warm Transfer + 5-Zeilen-Summary · Ampelfarben zuordnen · Hot Call analysieren · Grenzen setzen in 3 Schritten.<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Was unterscheidet Service von Support?<\/strong>\n   → Support reagiert auf Probleme; Service schafft Vertrauen und bindet Kunden.<\/li>\n<li><strong>Nenne drei Plain-Language-Regeln.<\/strong>\n   → z. B. max. 20 Wörter pro Satz, aktive Sprache, konkrete statt vager Angaben.<\/li>\n<li><strong>Was bedeutet FCR und was senkt sie?<\/strong>\n   → First Contact Resolution; vage Aussagen und fehlende nächste Schritte senken sie.<\/li>\n<li><strong>Welche Anliegen eignen sich für KI, welche nicht?<\/strong>\n   → Transaktionale (Status, Tracking, Fakten) ja; relationale (Beschwerden, Kulanz, Eskalation) brauchen Menschen.<\/li>\n<li><strong>Wann darf ein KI-Draft laut QA-Checkliste versendet werden?<\/strong>\n   → Nur wenn alle Prüffragen mit „Ja“ beantwortet sind – inkl. „Würde ich das selbst so senden?“<\/li>\n<li><strong>Welche drei Fragen ordnen einen Servicefall ein?<\/strong>\n   → Wiederkehrend &amp; geregelt? Braucht Kontext/Ermessen? Rechtlich, emotional oder finanziell relevant?<\/li>\n<li><strong>Wozu dienen Fallbacks in Templates?<\/strong>\n   → Damit die Nachricht auch bei fehlenden Daten korrekt klingt (z. B. „Guten Tag“ statt „Hallo ,“).<\/li>\n<li><strong>Welche Fälle werden in der QA zu 100 % geprüft?<\/strong>\n   → Entscheidungsfälle und Beschwerden mit negativem Ton; KI-Drafts nur zu 10 % stichprobenartig.<\/li>\n<li><strong>Nenne die 5 Phasen eines Service-Calls.<\/strong>\n   → Begrüßung + Rahmen, Anliegen klären, Lösung führen, Checkback, Abschluss.<\/li>\n<li><strong>Was ist der erste Schritt des Deeskalationsprotokolls?<\/strong>\n    → Stopp + Tempo runter („Okay – ich bin bei Ihnen. Ich kläre das jetzt mit Ihnen.“).<\/li>\n<\/ol>"}, {"id": "recht", "title": "Recht im Online-Marketing", "course": "MKT-E241 (2.4.1, Teile 1–3)", "html": "<p><strong>Modul:<\/strong> MKT-E241, Einheit 2.4.1 (Teile 1–3) · <strong>Grundlage:<\/strong> 3 Vorlesungen + 3 Tutorien „Urheberrecht &amp; Nutzungsrechte im E-Commerce“, „Vertragsmanagement im digitalen Business“, „Rechtssichere Content-Nutzung: AGB, Lizenzmodelle &amp; Nutzung in Social Media, Werbung &amp; KI“ · Rechtsstand der Folien: Ende 2025 / Anfang 2026, keine Rechtsberatung<\/p>\n<p><strong>Der rote Faden:<\/strong> Kostenlos im Netz heißt nicht rechtefrei. Wer Inhalte nutzt, braucht ein Nutzungsrecht, und wer es nicht belegen kann, steht so da, als hätte er es nicht. Für die Praxis zählen drei Dinge: <strong>Transparenz, Verträge, Dokumentation.<\/strong><\/p>\n<blockquote>\n<p><strong>Leitfall „Das 1.700-Euro-Bild“:<\/strong> Ein Mitarbeiter postet ein „gratis“ Bild aus dem Netz. Drei Wochen später: 900 € Lizenznachzahlung + 800 € Anwaltskosten.<\/p>\n<\/blockquote>\n<hr />\n<h2>1 · Grundlagen &amp; Abgrenzung<\/h2>\n<h3>3,5 Rechtsgebiete, die oft verwechselt werden<\/h3>\n<table>\n<thead>\n<tr>\n<th>Rechtsgebiet<\/th>\n<th>Schützt / regelt<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Urheberrecht<\/strong><\/td>\n<td>kreative Inhalte (Texte, Bilder, Videos, Musik, Software, Datenbanken)<\/td>\n<td>Kampagnengrafik<\/td>\n<\/tr>\n<tr>\n<td><strong>Markenrecht<\/strong><\/td>\n<td>Kennzeichen und Identität (Logos, Namen, Slogans)<\/td>\n<td>„Just Do It“ von Nike<\/td>\n<\/tr>\n<tr>\n<td><strong>Vertragsrecht<\/strong><\/td>\n<td>wer was wie nutzen darf (Lizenzen, Nutzungsrechte, AGB)<\/td>\n<td>Agenturvertrag<\/td>\n<\/tr>\n<tr>\n<td><strong>0,5 Leistungsschutzrechte<\/strong><\/td>\n<td>Leistungen von ausübenden Künstler:innen, Fotograf:innen, Produzent:innen<\/td>\n<td>Musikaufnahme, einfaches Foto<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Ideen sind frei<\/strong>, geschützt ist nur die konkrete Ausgestaltung. „Urheberrecht = Eigentum an der Idee“ ist falsch.<\/li>\n<li>Marken- und Urheberrecht können <strong>gleichzeitig<\/strong> greifen; man kann das eine verletzen, ohne das andere zu verletzen.<\/li>\n<\/ul>\n<h3>Rechtslage EU &amp; Deutschland<\/h3>\n<ul>\n<li><strong>UrhG<\/strong> = nationale Grundlage; <strong>EU-DSM-Richtlinie<\/strong> (2019, in DE 2021 umgesetzt): Plattformhaftung (YouTube, TikTok), stärkere Urheberrechte online. EU-Recht hat Anwendungsvorrang.<\/li>\n<li><strong>DSA<\/strong> (Digital Services Act, seit Feb. 2024 voll wirksam): Plattformen müssen rechtswidrige Inhalte nach Meldung entfernen, Werbung transparent machen. Höchstbußgeld <strong>6 % des Weltjahresumsatzes<\/strong> (Art. 74 DSA); Dez. 2025 erste reguläre DSA-Strafe: 120 Mio. €.<\/li>\n<li><strong>DMA<\/strong> (Digital Markets Act): reguliert große „Gatekeeper“ (Google, Meta), fairer Wettbewerb.<\/li>\n<li><strong>DDG<\/strong> (Digitale-Dienste-Gesetz): für kleine Shops realistischer, z. B. fehlendes Impressum bis 50.000 €. Impressum steht in <strong>§ 5 DDG<\/strong> und gilt auch für gewerbliche Social-Media-Accounts.<\/li>\n<li><strong>AI Act:<\/strong> Kennzeichnungspflicht für bestimmte KI-Inhalte nach <strong>Art. 50<\/strong>, verbindlich seit <strong>2. August 2026<\/strong>.<\/li>\n<\/ul>\n<hr />\n<h2>2 · Urheberrecht im E-Commerce<\/h2>\n<ul>\n<li><strong>Urheber:in ist immer ein Mensch<\/strong> (§ 7 UrhG, „Schöpfer des Werkes“). KI, Software oder Unternehmen haben kein Urheberrecht; Unternehmen erwerben nur <strong>Nutzungsrechte<\/strong> (Arbeitsvertrag, Lizenzvertrag, AGB).<\/li>\n<li><strong>Affen-Selfie (2011):<\/strong> Ein Makake drückt auf Slaters Kamera ab → kein menschlicher Schöpfer → <strong>niemand<\/strong> hat das Urheberrecht.<\/li>\n<li><strong>Schutzvoraussetzungen:<\/strong> 1) persönliche geistige Schöpfung (individuell, nicht banal), 2) wahrnehmbare Form, 3) mehr als eine bloße Idee.<\/li>\n<li>Schutz entsteht <strong>automatisch mit der Schöpfung<\/strong>, ohne Registrierung oder ©-Vermerk.<\/li>\n<li><strong>Schutzgegenstände:<\/strong> Produkttexte, Blogartikel, SEO-Texte, Produktfotos, Banner, Videos, Jingles, Quellcode, Shop-Templates, Datenbanken (§ 87a UrhG). Auch <strong>einfache Produktfotos<\/strong> sind als <strong>Lichtbild<\/strong> geschützt (§ 72 UrhG).<\/li>\n<\/ul>\n<h3>Schutzdauer<\/h3>\n<table>\n<thead>\n<tr>\n<th>Fall<\/th>\n<th>Dauer<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Einzelurheber:in<\/td>\n<td>70 Jahre nach dem Tod<\/td>\n<\/tr>\n<tr>\n<td>Mehrere Urheber:innen<\/td>\n<td>70 Jahre nach Tod des zuletzt Verstorbenen<\/td>\n<\/tr>\n<tr>\n<td>Anonyme / pseudonyme Werke<\/td>\n<td>70 Jahre nach Veröffentlichung<\/td>\n<\/tr>\n<tr>\n<td>Leistungsschutzrechte (z. B. einfache Fotos)<\/td>\n<td>50 Jahre nach Veröffentlichung<\/td>\n<\/tr>\n<tr>\n<td>Danach<\/td>\n<td>gemeinfrei, frei nutzbar<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>USA:<\/strong> flexibles „Fair Use“. <strong>Deutschland:<\/strong> nur eng gefasste Schranken (z. B. Zitatrecht). Es gilt meist das Recht des Landes, in dem genutzt wird (<strong>Schutzlandprinzip<\/strong>).<\/li>\n<\/ul>\n<h3>Typische Probleme<\/h3>\n<ol>\n<li><strong>Herstellerfotos<\/strong> ohne schriftliche Vereinbarung → Lizenz oder eigene Fotos<\/li>\n<li><strong>Duplicate Content<\/strong> (kopierte Texte) → Urheberrechts- und SEO-Risiko<\/li>\n<li><strong>Social-Media-Content<\/strong> einer Marke für eigene Werbung übernehmen<\/li>\n<li><strong>User Generated Content<\/strong> nur mit ausdrücklicher Zustimmung; bei erkennbaren Personen zusätzlich <strong>Recht am eigenen Bild<\/strong> (§ 22 KUG)<\/li>\n<li><strong>Musik:<\/strong> Auch kurze Ausschnitte sind geschützt; TikTok-/Instagram-Musik meist nur auf der Plattform selbst<\/li>\n<\/ol>\n<p><strong>Abmahnung<\/strong> = formale Aufforderung, eine Rechtsverletzung zu unterlassen, plus Kostenforderung. <strong>Gutgläubigkeit schützt nicht<\/strong>: Auch unbeabsichtigte Verstöße sind Verletzungen.\n<strong>Schutz:<\/strong> eigene Inhalte oder klare Lizenzen, Rechtekette dokumentieren, CMS/DAM nutzen, Team schulen.<\/p>\n<hr />\n<h2>3 · Nutzungsrechte &amp; Lizenzen<\/h2>\n<ul>\n<li><strong>Urheberrecht ≠ Nutzungsrecht.<\/strong> Das Urheberrecht bleibt bei der schaffenden Person und ist <strong>nicht übertragbar<\/strong> (§ 29 UrhG, nur im Erbfall). Eingeräumt werden <strong>Nutzungsrechte<\/strong>.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Art (§ 31 UrhG)<\/th>\n<th>Bedeutung<\/th>\n<th>Typisch<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Einfaches<\/strong> Nutzungsrecht<\/td>\n<td>mehrere dürfen parallel nutzen, Urheber:in darf weiter vergeben<\/td>\n<td>Stockfotos, Musikdatenbanken<\/td>\n<\/tr>\n<tr>\n<td><strong>Ausschließliches<\/strong> (exklusives)<\/td>\n<td>nur ein:e Lizenznehmer:in, auch Urheber:in selbst nicht mehr<\/td>\n<td>Auftragstexte, Kampagnen, Werbespot<\/td>\n<\/tr>\n<tr>\n<td>Zeitlich/räumlich begrenzt<\/td>\n<td>z. B. 1 Jahr, nur DE<\/td>\n<td>Kampagne 3 Monate in DE<\/td>\n<\/tr>\n<tr>\n<td>Unterlizenzierung<\/td>\n<td>Weitergabe an Dritte, nur wenn vereinbart<\/td>\n<td>Agentur → Kundenprojekt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Die vier Umfangsfragen:<\/strong> räumlich (wo?) · zeitlich (wie lange?) · inhaltlich (wofür?) · medial (welche Kanäle?) – plus: Weitergabe an Dritte erlaubt?<\/p>\n<blockquote>\n<p><strong>Zweckübertragungsregel (§ 31 Abs. 5 UrhG):<\/strong> Ist nichts Konkretes vereinbart, bekommt der Lizenznehmer nur die Rechte, die der Zweck zwingend erfordert. Fotos „für den Online-Shop“ ≠ Instagram, Plakat oder Print. <strong>Was nicht ausdrücklich eingeräumt ist, gilt als nicht eingeräumt.<\/strong><\/p>\n<\/blockquote>\n<h3>Creative Commons<\/h3>\n<table>\n<thead>\n<tr>\n<th>Lizenz<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>CC BY<\/td>\n<td>Nutzung erlaubt, Namensnennung nötig<\/td>\n<\/tr>\n<tr>\n<td>CC BY-SA<\/td>\n<td>Weitergabe nur unter gleichen Bedingungen<\/td>\n<\/tr>\n<tr>\n<td>CC BY-NC<\/td>\n<td>nur nicht-kommerziell → <strong>schließt Werbung, Produktseiten, Shops ein<\/strong>, im E-Commerce meist unzulässig<\/td>\n<\/tr>\n<tr>\n<td>CC0<\/td>\n<td>Verzicht auf Rechte, faktisch gemeinfrei (mit Vorsicht)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Stockplattformen<\/strong> (Adobe Stock, Shutterstock, Envato, Canva, Freepik, Pixabay): <strong>Royalty Free<\/strong> = einmalige Gebühr, breite Nutzung, meist einfaches Recht; <strong>Rights Managed<\/strong> = nach Zeitraum, Medium, Region begrenzt. AGB ändern sich → Nachweis speichern.<\/li>\n<li><strong>Lizenzfallen:<\/strong> „kostenlose“ Materialien; Teilen per Share-Button ist ok, <strong>Download + Neu-Upload nicht<\/strong>; KI ist kein Urheber; <strong>Plattform-AGB<\/strong> räumen der Plattform weitreichende Rechte ein (wer Fremdes hochlädt, vergibt Rechte, die er nicht hat).<\/li>\n<li><strong>Tools laut Anbieter:<\/strong> Adobe Firefly = kommerzielle Rechte (lizenziertes Training); Midjourney und OpenAI = kommerzielle Rechte nur für zahlende Accounts; Canva Pro = kommerzielle Nutzung; Pexels/Unsplash = freie Medien, aber keine Markennutzung. Das sind Vertragsversprechen, keine Garantie.<\/li>\n<\/ul>\n<h3>Checkliste für Freelancer- und Agenturverträge (6 Fragen)<\/h3>\n<ol>\n<li>Welche Werke? 2. Einfach oder ausschließlich? 3. Räumlicher, zeitlicher, medialer Umfang? 4. Weitergabe an Dritte? 5. Rechte erst nach vollständiger Zahlung? 6. Regeln zu KI-Tools und Stockmaterial? (<strong>KI-Klausel<\/strong> seit 2024 üblich)<\/li>\n<\/ol>\n<blockquote>\n<p><strong>Beweislast:<\/strong> Im Streit muss das Unternehmen den Rechteerwerb nachweisen → Lizenzverträge, Screenshots, Rechnungen archivieren; bei KI zusätzlich Prompt, Tool, Bedingungen, Datum.<\/p>\n<\/blockquote>\n<hr />\n<h2>4 · KI-generierte Inhalte<\/h2>\n<ul>\n<li><strong>Keine Urheberschaft durch KI.<\/strong> Schutz entsteht nur, wenn ein Mensch <strong>kreativ-prägend<\/strong> eingreift (Prompting, Auswahl, Anordnung, Nachbearbeitung). <em>„Die KI produziert, der Mensch gestaltet.“<\/em><\/li>\n<li><strong>Théâtre D'opéra Spatial (2022):<\/strong> Midjourney-Bild gewinnt Kunstpreis, US-Copyright-Amt lehnt Schutz ab, weil kein menschlicher Schöpfer.<\/li>\n<li><strong>Gerichtliche Linie:<\/strong> LG/OLG Hamburg (Dez. 2025): Fotos fürs KI-Training über die <strong>Text-und-Data-Mining-Schranken<\/strong> (§ 44b, § 60d UrhG) grundsätzlich zulässig; reine KI-Bilder ohne menschliche Gestaltung nicht schutzfähig. OLG Düsseldorf (2026): KI-Umgestaltung eines fremden Fotos kann zulässig sein, wenn nur das ungeschützte Motiv übernommen wird.<\/li>\n<li><strong>EU AI Act:<\/strong> Transparenz nach Art. 50 (Deepfakes, bestimmte KI-Texte), Haftung bleibt beim Menschen/Unternehmen („die KI war es“ zählt nicht), Offenlegung des Trainingsmaterials durch Anbieter, <strong>4 Risikoklassen<\/strong>: inakzeptabel (verboten), hoch, begrenzt (Transparenzpflichten), minimal. Marketing-KI fällt meist in die Transparenzstufe.<\/li>\n<li><strong>Trainingsdaten-Streitfälle:<\/strong> Getty Images vs. Stability AI, New York Times vs. OpenAI.<\/li>\n<li><strong>Haftung:<\/strong> immer beim Nutzer/Unternehmen. KI-Kundenbild ohne Hinweis → möglicher Verstoß gegen AI Act und <strong>UWG<\/strong> (Irreführung § 5, verschleierte Werbung § 5a).<\/li>\n<li><strong>KI-Inhalte trotzdem schützen:<\/strong> über Vertrag, Markenrecht, Datenbankrecht und vor allem mehr eigene kreative Gestaltung.<\/li>\n<\/ul>\n<p><strong>Praxis-Checkliste KI:<\/strong> Tools mit transparentem Training · kennzeichnen, wo nötig · Verträge um KI-Klauseln ergänzen · Prompt, Tool, Datum, Lizenz dokumentieren · <strong>keine personenbezogenen Daten in Prompts<\/strong> · eigenen menschlichen Anteil dokumentieren.<\/p>\n<hr />\n<h2>5 · Social Media, Werbung &amp; Plattformrecht<\/h2>\n<ul>\n<li><strong>Upload = Vertrag:<\/strong> Du räumst der Plattform ein weltweites, kostenloses Nutzungsrecht ein (auch für Werbung und KI-Training). Meta/Instagram: weltweite Lizenz; YouTube: Vervielfältigung und Speicherung; TikTok: Weiterverwendung zu Werbezwecken; OpenAI: Training mit Prompts, mit Widerspruchsmöglichkeit.<\/li>\n<li><strong>Werbung kennzeichnen:<\/strong> Gibt es Geld oder ein Gratisprodukt, ist es Werbung. Marke und Agentur haften mit. KI-Content kennzeichnen. Fremde Marken meiden, auch in Prompts („im Stil von Nike“).<\/li>\n<li><strong>BGH-Influencer-Urteile (9.9.2021):<\/strong> Luisa-Maxime Huss (I ZR 90/20) musste kennzeichnen (Gegenleistung, Himbeermarmelade); Cathy Hummels (I ZR 126/20) und Leonie Hanne (I ZR 125/20) nicht, weil sie für die Produktlinks <strong>kein Geld<\/strong> erhalten hatten. Kennzeichnungspflicht vor allem bei <strong>Gegenleistung<\/strong>.<\/li>\n<li><strong>UGC &amp; Personen:<\/strong> Kundenfotos nur mit ausdrücklicher Einwilligung; Personenbilder nur mit vorheriger Einwilligung (§ 22 KUG, Model Release), auch bei Mitarbeitenden. Ausnahme eng: Personen der Zeitgeschichte (§ 23 KUG). Die Einwilligung muss <strong>Zweck, Medium und Dauer<\/strong> umfassen; ein „Klar, gerne!“ per DM deckt nicht automatisch Anzeige und Plakat.<\/li>\n<li><strong>Checkliste Posts:<\/strong> Rechte an Bild und Musik prüfen · Werbung kennzeichnen · KI deklarieren · Repost nur mit Zustimmung · Social-Media-Guidelines und Freigabe-Checkliste.<\/li>\n<\/ul>\n<hr />\n<h2>6 · Vertragsmanagement im digitalen Business<\/h2>\n<ul>\n<li><strong>Ein Vertrag entsteht durch zwei übereinstimmende Willenserklärungen<\/strong> (Angebot + Annahme, §§ 145–157 BGB), <strong>ohne Formzwang<\/strong>. „Passt, macht das.“ per E-Mail = Vertrag. Häkchen bei AGB = Klickvertrag. Schweigen = <strong>keine<\/strong> Zustimmung.<\/li>\n<li><strong>Formen:<\/strong> mündlich (gültig, schwer beweisbar) · E-Mail/Chat (gültig, oft lückenhaft) · schriftlich/PDF (beste Beweislage) · Klickvertrag (wirksam, oft zugunsten der Plattform). Tipp: auch bei Kleinaufträgen eine Bestätigungs-Mail mit allen Kernpunkten.<\/li>\n<li><strong>Digitale Signatur:<\/strong> einfache elektronische Signatur (eSign-Tool) · <strong>qualifizierte elektronische Signatur (QES)<\/strong> = gleichwertig zur handschriftlichen Unterschrift · <strong>eIDAS 2.0<\/strong> (seit Mai 2024, EU Digital Identity Wallet ab 2026, Akzeptanzpflicht für Unternehmen ab 2027).<\/li>\n<li><strong>Smart Contract<\/strong> = Programm auf einer Blockchain, das sich bei Auslösern selbst ausführt. <strong>„The DAO“ (2016):<\/strong> Code-Lücke, ca. 3,6 Mio. Ether abgezogen, Hard Fork → Ethereum Classic. <em>Ein Smart Contract führt exakt aus, was im Code steht, auch den Fehler.<\/em><\/li>\n<\/ul>\n<h3>Vertragsarten<\/h3>\n<table>\n<thead>\n<tr>\n<th>Vertrag<\/th>\n<th>Geschuldet<\/th>\n<th>Beispiel<\/th>\n<th>Besonderheit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Werkvertrag<\/strong> (§ 631 BGB)<\/td>\n<td>konkretes, prüfbares <strong>Ergebnis<\/strong><\/td>\n<td>Website, Kampagnenvideo, Blogartikel, Produktfotos<\/td>\n<td>Zahlung nach <strong>Abnahme<\/strong> (§§ 640, 641 BGB), Nachbesserung<\/td>\n<\/tr>\n<tr>\n<td><strong>Dienstvertrag<\/strong> (§ 611 BGB)<\/td>\n<td>fachgerechte <strong>Tätigkeit<\/strong>, kein Erfolg<\/td>\n<td>laufende SEO- oder Social-Media-Betreuung, Beratung<\/td>\n<td>Vergütung auch ohne Erfolg, Kündigung § 621/§ 627 BGB<\/td>\n<\/tr>\n<tr>\n<td><strong>Lizenzvertrag<\/strong><\/td>\n<td>Nutzungsrechte<\/td>\n<td>Bilder, Musik, Software, KI-Content<\/td>\n<td>einfach/exklusiv, Unterlizenz nur wenn vereinbart<\/td>\n<\/tr>\n<tr>\n<td><strong>AVV<\/strong> (Art. 28 DSGVO)<\/td>\n<td>Datenschutz bei Auftragsverarbeitung<\/td>\n<td>Agentur pflegt Newsletter-Liste<\/td>\n<td>Pflicht bei personenbezogenen Daten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Merksatz:<\/strong> Werk = liefern, Dienst = begleiten.\n⚠️ <strong>Scheinselbstständigkeit:<\/strong> feste Arbeitszeiten + nur ein Auftraggeber → Sozialversicherungspflicht, Nachzahlungen.<\/p>\n<h3>Rollen &amp; Rechtekette<\/h3>\n<ul>\n<li>Agentur haftet für Subunternehmer:innen als <strong>Erfüllungsgehilfen<\/strong> (§ 278 BGB).<\/li>\n<li>Die Agentur kann dem Kunden <strong>nur so viele Rechte geben, wie sie selbst hat.<\/strong> Fehlt im Untervertrag die Rechteübertragung, reißt die Kette (§ 31 Abs. 5 UrhG).<\/li>\n<\/ul>\n<h3>Die 6 Bausteine eines Vertrags<\/h3>\n<ol>\n<li>Vertragsparteien (vollständige Kontaktdaten)<\/li>\n<li>Leistung &amp; Umfang (Menge, Format, Qualität; z. B. „10 Feed-Posts + 4 Reels/Monat, 2 Korrekturschleifen, Reporting bis zum 5.“)<\/li>\n<li>Fristen &amp; Abnahme<\/li>\n<li>Vergütung &amp; Zahlung: <strong>Festpreis<\/strong> (Planbarkeit), <strong>Retainer<\/strong> (planbare Einnahmen, Umfang begrenzen), <strong>erfolgsbasiert<\/strong> (nur bei objektiv messbaren KPIs); dazu Fälligkeit, Zahlungsverzug, <strong>Rechtevorbehalt<\/strong> (Rechte erst nach vollständiger Zahlung)<\/li>\n<li>Nutzungsrechte (räumlich, zeitlich, inhaltlich, medial, Weitergabe)<\/li>\n<li>\n<p>Haftung, Datenschutz &amp; Laufzeit: Haftungsbegrenzung auf Auftragssumme üblich (außer Vorsatz, grobe Fahrlässigkeit, Urheberrechtsverstöße), AVV, KI-Transparenz, Kündigung<\/p>\n<\/li>\n<li>\n<p><strong>Change Requests<\/strong> schriftlich: Angebot über Mehraufwand → schriftliche Freigabe → Umsetzung. Fall <strong>PixelWerk/Fizzy<\/strong>: 35 % Mehraufwand ohne Dokumentation → PixelWerk bekommt das Geld nur, wenn es beweisen kann, dass die Wünsche über das Paket hinausgingen.<\/p>\n<\/li>\n<li><strong>Dokumentation<\/strong> ist die Versicherung: Audit-Trail, <strong>CLM-Systeme<\/strong> (Contract Lifecycle Management, z. B. ContractHero, Juro, Ironclad), „single source of truth“, revisionssicheres Archiv (GoBD, i. d. R. 10 Jahre).<\/li>\n<\/ol>\n<h3>B2B vs. B2C<\/h3>\n<table>\n<thead>\n<tr>\n<th>B2B<\/th>\n<th>B2C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>mehr Gestaltungsfreiheit, Parteien selbst verantwortlich<\/td>\n<td>strengere Schutzvorschriften<\/td>\n<\/tr>\n<tr>\n<td><strong>kein gesetzliches Widerrufsrecht<\/strong><\/td>\n<td><strong>14 Tage Widerrufsrecht<\/strong> im Fernabsatz (§§ 312g, 355 BGB), Informationspflichten (§ 312d BGB i. V. m. Art. 246a EGBGB), faire AGB (§ 307 BGB), Impressum, Datenschutzerklärung, Widerrufsbelehrung<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<ul>\n<li><strong>Kooperationsverträge:<\/strong> Projektziele, Aufgaben, Vergütung, Nutzungsrechte, Vertraulichkeit, Datenschutz/Haftung. <strong>Influencer<\/strong> zusätzlich: Werbekennzeichnung, Rechte an Posts, KI-Offenlegung, Exklusivität. <strong>Affiliate<\/strong> zusätzlich: performancebasierte Vergütung, DSGVO-konformes Tracking, Haftung bei Falschwerbung.<\/li>\n<li><strong>KI im Vertragswesen:<\/strong> Erstellung, Prüfung, Fristen. Grenze: Endkontrolle bleibt menschlich.<\/li>\n<\/ul>\n<hr />\n<h2>7 · AGB, Datenschutz &amp; Rahmenbedingungen<\/h2>\n<ul>\n<li><strong>AGB<\/strong> = vorformulierte Vertragsbedingungen für viele Verträge (§ 305 BGB, §§ 305–310). Wirksam gegenüber Verbraucher:innen nur mit: 1) <strong>Einbeziehung vor Vertragsschluss<\/strong> (ausdrücklicher Hinweis + zumutbare Kenntnisnahme), 2) verständlicher Sprache, 3) keinen überraschenden oder unangemessenen Klauseln (§ 307 BGB). AGB nur als PDF auf der Website ohne Hinweis im Angebot gelten <strong>nicht<\/strong>.<\/li>\n<li>Unwirksame Klausel fällt weg, das Gesetz tritt an ihre Stelle, der Rest bleibt gültig (<strong>§ 306 BGB<\/strong>). Ohne AGB gilt das <strong>dispositive Recht<\/strong> (BGB), der Vertrag ist voll wirksam.<\/li>\n<li>Unzulässig: Haftungsausschluss bei grober Fahrlässigkeit, pauschale Urheberrechtsübertragung ohne Zweckbindung.<\/li>\n<li><strong>Vier Rechtsfelder eines Shops:<\/strong> Urheberrecht (schützt Inhalte) · DSGVO (schützt Personen) · Wettbewerbs- und Plattformrecht (UWG, DSA, DMA – Fairness) · Vertragsrecht (AGB, Lizenzen – Nutzung).<\/li>\n<li><strong>DSGVO-Prinzipien:<\/strong> Zweckbindung · Transparenz · Datenminimierung · Rechtsgrundlage (Einwilligung, Vertrag, berechtigtes Interesse). <strong>Goldene Regel:<\/strong> keine personenbezogenen Daten in öffentliche KI-Tools (Fall Sarah: Kundenliste in ChatGPT kopiert).<\/li>\n<li><strong>Kölner Dom (OLG Köln, 23.5.2025, 6 U 61/24):<\/strong> Bildagentur verkauft 220 Innenaufnahmen ohne Genehmigung, u. a. mit dem Richter-Fenster → ca. 35.000 €. Ein Bild kann <strong>mehrere Rechte gleichzeitig<\/strong> berühren (Hausrecht, Urheberrecht am abgebildeten Werk, Recht am eigenen Bild) → ganze Rechtekette prüfen.<\/li>\n<li><strong>Zeitstrahl:<\/strong> 2024 AI Act in Kraft, DSA voll wirksam · 2025 Green Claims Directive, E-Evidence · 2. Aug. 2026 KI-Kennzeichnung nach Art. 50 verbindlich · Zukunft: KI-Vertragsmanagement, Blockchain-Lizenzen, evtl. eigenes Schutzrecht für KI-Werke.<\/li>\n<\/ul>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>UrhG<\/td>\n<td>Urheberrechtsgesetz<\/td>\n<\/tr>\n<tr>\n<td>Nutzungsrecht<\/td>\n<td>Erlaubnis, ein Werk wie, wo, wann und in welchem Umfang zu nutzen<\/td>\n<\/tr>\n<tr>\n<td>Zweckübertragungsregel<\/td>\n<td>§ 31 Abs. 5 UrhG: im Zweifel nur Rechte für den vereinbarten Zweck<\/td>\n<\/tr>\n<tr>\n<td>Lichtbild<\/td>\n<td>einfaches Foto, Leistungsschutz nach § 72 UrhG (50 Jahre)<\/td>\n<\/tr>\n<tr>\n<td>Gemeinfrei<\/td>\n<td>Schutzfrist abgelaufen, frei nutzbar<\/td>\n<\/tr>\n<tr>\n<td>Schutzlandprinzip<\/td>\n<td>Es gilt das Recht des Landes, in dem genutzt wird<\/td>\n<\/tr>\n<tr>\n<td>Abmahnung<\/td>\n<td>Aufforderung zur Unterlassung plus Kostenforderung<\/td>\n<\/tr>\n<tr>\n<td>DAM<\/td>\n<td>Digital Asset Management, Verwaltung von Assets und Lizenzen<\/td>\n<\/tr>\n<tr>\n<td>KUG<\/td>\n<td>Kunsturhebergesetz, § 22 Recht am eigenen Bild<\/td>\n<\/tr>\n<tr>\n<td>UWG<\/td>\n<td>Gesetz gegen den unlauteren Wettbewerb (§ 5 Irreführung, § 5a Werbung kenntlich machen)<\/td>\n<\/tr>\n<tr>\n<td>DSA / DMA / DDG<\/td>\n<td>Digital Services Act / Digital Markets Act / Digitale-Dienste-Gesetz<\/td>\n<\/tr>\n<tr>\n<td>AI Act Art. 50<\/td>\n<td>Transparenz- und Kennzeichnungspflicht für bestimmte KI-Inhalte<\/td>\n<\/tr>\n<tr>\n<td>AVV<\/td>\n<td>Auftragsverarbeitungsvertrag nach Art. 28 DSGVO<\/td>\n<\/tr>\n<tr>\n<td>QES<\/td>\n<td>qualifizierte elektronische Signatur, gleichwertig zur Unterschrift<\/td>\n<\/tr>\n<tr>\n<td>eIDAS 2.0<\/td>\n<td>EU-Verordnung zu digitaler Identität und Signaturen<\/td>\n<\/tr>\n<tr>\n<td>CLM<\/td>\n<td>Contract Lifecycle Management<\/td>\n<\/tr>\n<tr>\n<td>Erfüllungsgehilfe<\/td>\n<td>§ 278 BGB: Verschulden von Subunternehmer:innen wird zugerechnet<\/td>\n<\/tr>\n<tr>\n<td>Rechtevorbehalt<\/td>\n<td>Nutzungsrechte gehen erst mit vollständiger Zahlung über<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Tutoriumsaufgaben (je 2 von 3 Pflicht)<\/h2>\n<p><strong>Teil 1 – Urheberrecht &amp; Nutzungsrechte:<\/strong> 1) Rechte prüfen &amp; Risiken erkennen an einem echten Shop-Beispiel · 2) KI-Inhalte rechtssicher nutzen (menschlicher Anteil, Transparenz, Lizenzen, Dokumentation) · 3) Social Media &amp; Influencer-Marketing bewerten (DSA/UWG, Urheberrecht, KI-Hinweis, Haftung)\n<strong>Teil 2 – Vertragsmanagement:<\/strong> 1) Vertragstyp bestimmen (A: Website mit KPIs → Werkvertrag · B: laufende Instagram-Betreuung → Dienstvertrag · C: Produktfotos → Werk- + Lizenzvertrag) · 2) Vertrag für eine Landingpage in 6 Abschnitten strukturieren · 3) Digitale Tools, KI &amp; Smart Contracts bewerten\n<strong>Teil 3 – Rechtssichere Content-Nutzung:<\/strong> 1) Content auf rechtliche Risiken prüfen (Tabelle Element – Rechteinhaber – Lizenz – Risiko – Maßnahme) · 2) AGB &amp; Lizenzbedingungen zweier Plattformen vergleichen · 3) Rechtssichere KI-Content-Strategie für eine Agentur (Transparenz, Dokumentation, Verträge, Tool-Auswahl)<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Wer ist nach deutschem Recht Urheber:in eines Werkes?<\/strong> → Immer ein Mensch (§ 7 UrhG). KI und Unternehmen können nur Nutzungsrechte haben bzw. erwerben.<\/li>\n<li><strong>Ab wann ist ein Werk geschützt?<\/strong> → Automatisch mit der Schöpfung, ohne Registrierung.<\/li>\n<li><strong>Was besagt die Zweckübertragungsregel?<\/strong> → Ohne konkrete Vereinbarung gibt es nur die Rechte, die der Zweck zwingend erfordert (§ 31 Abs. 5 UrhG).<\/li>\n<li><strong>Warum ist CC BY-NC im Online-Shop meist unzulässig?<\/strong> → „Nicht-kommerziell“ schließt Werbung, Produktseiten und Shops ein.<\/li>\n<li><strong>Unterschied einfaches und ausschließliches Nutzungsrecht?<\/strong> → Einfach: mehrere dürfen parallel nutzen. Ausschließlich: nur ein:e Lizenznehmer:in, auch die Urheber:in selbst nicht mehr.<\/li>\n<li><strong>Ist reiner KI-Output urheberrechtlich geschützt?<\/strong> → Nein, nur bei kreativ-prägendem menschlichem Beitrag (Prompting, Auswahl, Nachbearbeitung).<\/li>\n<li><strong>Werkvertrag oder Dienstvertrag für laufende Social-Media-Betreuung?<\/strong> → Dienstvertrag (Tätigkeit, kein Erfolg geschuldet).<\/li>\n<li><strong>Kommt durch „Passt, macht das.“ per Mail ein Vertrag zustande?<\/strong> → Ja, Angebot + Annahme, kein Formzwang.<\/li>\n<li><strong>Wann gelten AGB gegenüber Verbraucher:innen?<\/strong> → Wenn sie vor Vertragsschluss mit Hinweis und zumutbarer Kenntnisnahme einbezogen wurden.<\/li>\n<li><strong>Wer hat ein gesetzliches 14-tägiges Widerrufsrecht im Fernabsatz?<\/strong> → Nur Verbraucher:innen (B2C), nicht Unternehmen.<\/li>\n<li><strong>Wann muss ein Influencer-Post als Werbung gekennzeichnet werden?<\/strong> → Vor allem bei einer Gegenleistung (Geld, Gratisprodukt) – BGH-Urteile vom 9.9.2021.<\/li>\n<li><strong>Seit wann gilt die KI-Kennzeichnungspflicht nach Art. 50 AI Act?<\/strong> → Seit dem 2. August 2026.<\/li>\n<\/ol>"}];
const QUIZ = {"version": "2026-11-10", "source": "Lernzusammenfassungen (Selbsttests)", "modules": [{"id": "seo-geo", "title": "SEO, GEO & Content", "course": "MKT-E231 (1–5)", "questions": [{"id": "seo-geo-01", "question": "Was unterscheidet GEO grundlegend von SEO?", "options": ["GEO ersetzt SEO vollständig, technische Optimierung ist nicht mehr nötig.", "GEO optimiert ausschließlich lokale Suchergebnisse (Geo-Targeting).", "SEO und GEO sind zwei Namen für dieselbe Disziplin.", "SEO zielt auf Rankings in den Google-SERPs, GEO darauf, von KI-Systemen zitiert und in Antworten eingebunden zu werden."], "correct": 3, "explanation": "GEO = Generative Engine Optimization: Sichtbarkeit in KI-Antworten (AI Overviews, ChatGPT, Perplexity). SEO bleibt die Basis."}, {"id": "seo-geo-02", "question": "Welche Funnel-Stufe ist durch AI Overviews am stärksten betroffen?", "options": ["Keine – AI Overviews verändern das Klickverhalten nicht.", "MOFU – Vergleiche werden von Google nicht mehr angezeigt.", "TOFU – Informationsfragen werden direkt von der KI beantwortet (Zero-Click).", "BOFU – Kaufsuchen werden komplett von der KI übernommen."], "correct": 2, "explanation": "Fragen wie „Was ist ein ETF?“ werden vollständig in der KI-Antwort beantwortet. BOFU bleibt laut Vorlesung relativ stabil."}, {"id": "seo-geo-03", "question": "Welche drei Bausteine bilden laut Vorlesung das GEO-Fundament?", "options": ["Backlinks, Keyword-Dichte, Meta-Description", "Ladezeit, Cookie-Banner, Newsletter", "Pop-ups, Paid Ads, Influencer", "Modularer Content-Aufbau, Structured Data & semantische Klarheit, Named Entity Optimization"], "correct": 3, "explanation": "Modulare, einzeln zitierfähige Absätze + Schema.org-Markup + einheitliche Nennung von Marke/Person."}, {"id": "seo-geo-04", "question": "Warum ist eine Markenerwähnung ohne Link für GEO wertvoller als für SEO?", "options": ["Google wertet unverlinkte Erwähnungen stärker als Backlinks.", "Weil Erwähnungen ohne Link automatisch in AI Overviews erscheinen.", "KI erfasst den Markennamen semantisch im Zusammenhang – auch ohne Link.", "Weil Backlinks für KI-Systeme verboten sind."], "correct": 2, "explanation": "SEO-Wert einer Brand Mention ohne Link: niedrig. GEO-Wert: hoch."}, {"id": "seo-geo-05", "question": "Woran orientiert sich ChatGPT im Internetsuche-Modus?", "options": ["Ausschließlich an den Google-Rankings", "Nur an Wikipedia", "Nur an den Trainingsdaten, ohne Websuche", "An eigenen Crawlern und Bing-basierten Signalen"], "correct": 3, "explanation": "Laut Vorlesung korreliert Bing-Sichtbarkeit mit ChatGPT-Zitation."}, {"id": "seo-geo-06", "question": "Was bedeutet Content-Chunking?", "options": ["Lange Texte möglichst ohne Absätze schreiben", "Content auf mehrere Domains verteilen", "Texte in mehrere Sprachen übersetzen", "Inhalte in klar abgegrenzte, einzeln verständliche Textblöcke aufteilen"], "correct": 3, "explanation": "KI greift oft nur auf einzelne Absätze zu – diese müssen isoliert funktionieren."}, {"id": "seo-geo-07", "question": "Welches Tool zeigt, ob eigene Seiten in Googles „Übersichten mit KI“ auftauchen?", "options": ["Google Analytics 4", "Screaming Frog", "Sistrix (SERP-Features-Bericht)", "Canva"], "correct": 2, "explanation": "Im SERP-Features-Bericht lässt sich filtern, welche Seiten in AI Overviews erscheinen – auch bei Mitbewerbern."}, {"id": "seo-geo-08", "question": "Warum reicht „Seite 1 bei Google“ als Ziel nicht mehr aus?", "options": ["Weil Google Seite 1 abgeschafft hat.", "Weil Rankings seit 2025 nicht mehr messbar sind.", "Top-Platzierungen können unter der KI-Antwort liegen; die Klickrate sinkt auch bei guten Rankings.", "Weil nur noch bezahlte Anzeigen angezeigt werden."], "correct": 2, "explanation": "Sichtbarkeitsverlust ≠ Rankingverlust."}, {"id": "seo-geo-09", "question": "Was ist eine „indirekte Quelle“ im GEO-Reporting?", "options": ["Die Marke wird in der KI-Antwort erwähnt, aber ohne Link zur Website.", "Eine Website, die auf Seite 2 rankt", "Eine Quelle, die nur in bezahlten Anzeigen erscheint", "Ein Backlink von einer Fachseite"], "correct": 0, "explanation": "Direkte Quelle = mit Website-Link; indirekte Quelle = Erwähnung ohne Link."}, {"id": "seo-geo-10", "question": "Welche Plattformtypen eignen sich für GEO-PR laut Vorlesung am besten?", "options": ["Presseportale ohne Archiv", "Private Blogs ohne Indexierung", "Fachmedien/Branchenportale sowie Universitäts-, .gov- und .org-Seiten", "Instagram und Facebook"], "correct": 2, "explanation": "Diese Quellen haben hohes Vertrauen und kommen oft in LLM-Trainingsdaten vor. Social Media: geringe GEO-Eignung."}]}, {"id": "masterclass", "title": "Masterclass-Playbooks SEO & GEO", "course": "Masterclass", "questions": [{"id": "masterclass-01", "question": "Was ist der Unterschied zwischen robots.txt und noindex?", "options": ["robots.txt entfernt Seiten aus dem Index, noindex steuert das Crawling.", "Beide verhindern zuverlässig die Indexierung.", "noindex ist nur für Bing relevant.", "robots.txt steuert das Crawling, noindex verhindert die Indexierung einer abrufbaren Seite."], "correct": 3, "explanation": "Achtung: Ist eine URL per robots.txt blockiert, kann der Bot ein noindex evtl. gar nicht lesen."}, {"id": "masterclass-02", "question": "Welche Werte gelten bei den Core Web Vitals als gut?", "options": ["LCP ≤ 10 s, INP ≤ 500 ms, CLS ≤ 0,5", "LCP ≤ 0,5 s, INP ≤ 20 ms, CLS = 0", "LCP ≤ 5 s, INP ≤ 1 s, CLS ≤ 1", "LCP ≤ 2,5 s, INP ≤ 200 ms, CLS ≤ 0,1"], "correct": 3, "explanation": "LCP = Laden, INP = Reaktionsfähigkeit, CLS = visuelle Stabilität."}, {"id": "masterclass-03", "question": "Für wen ist IndexNow besonders interessant?", "options": ["Für Seiten, die nicht indexiert werden sollen", "Für eine 15-Seiten-Website mit seltenen Änderungen", "Für einen Shop mit 30.000 Produkten und häufig wechselnden Verfügbarkeiten", "Nur für Google-Shopping-Anzeigen"], "correct": 2, "explanation": "IndexNow meldet geänderte URLs aktiv an teilnehmende Suchmaschinen (zentral bei Bing). Garantiert keine Indexierung."}, {"id": "masterclass-04", "question": "Was sagt Google 2026 zu llms.txt?", "options": ["Ersetzt die XML-Sitemap", "Verbessert das Ranking um eine Position", "Pflicht für die Aufnahme in AI Overviews", "Für die Google-Suche weder erforderlich noch mit positivem oder negativem Effekt"], "correct": 3, "explanation": "Spezielle „GEO-Tricks“ ersetzen weder Crawlability noch originäre Inhalte."}, {"id": "masterclass-05", "question": "Was beschreibt die 1-5-15-Methode?", "options": ["1 Primär-Asset, 5 vertiefende Inhalte, mindestens 15 kleine Einheiten zur Distribution", "1 Keyword, 5 Backlinks, 15 Blogposts pro Monat", "1 Ziel, 5 KPIs, 15 Maßnahmen", "1 Post pro Tag auf 5 Kanälen für 15 Tage"], "correct": 0, "explanation": "Aus einem starken Pillar-Asset entsteht ein ganzes Content-System."}, {"id": "masterclass-06", "question": "Welche vier Suchintentionen unterscheidet die Masterclass?", "options": ["Organic, Paid, Earned, Owned", "Informational, Commercial, Transactional, Navigational", "Aware, Appeal, Ask, Act", "Short Tail, Long Tail, Mid Tail, Brand"], "correct": 1, "explanation": "Beispiel: „Bestes getreidefreies Hundefutter“ = Commercial."}, {"id": "masterclass-07", "question": "Viele Impressions, aber niedrige CTR in der Search Console – was prüfst du zuerst?", "options": ["Die XML-Sitemap löschen", "Die robots.txt sperren", "Mehr Backlinks kaufen", "Snippet (Title, Description) und Passung zur Suchintention"], "correct": 3, "explanation": "Die Seite wird gesehen, aber nicht angeklickt – das Suchergebnis überzeugt nicht."}, {"id": "masterclass-08", "question": "Warum ist eine Citation in KI-Antworten nicht automatisch ein Erfolg?", "options": ["Weil Citations gegen Google-Richtlinien verstoßen.", "Weil KI-Antworten nie Quellen nennen.", "Sie erzeugt nicht zwingend einen Besuch – GEO muss mit Business-KPIs verbunden werden.", "Weil Citations das Ranking verschlechtern."], "correct": 2, "explanation": "Messgrößen wie Leads, Conversions, Brand Search und AI Referrals ergänzen die Citation-Zahl."}, {"id": "masterclass-09", "question": "Welche Proof-Elemente gelten im Personal Branding als „stark“?", "options": ["Möglichst viele Hashtags", "„Top Expert“-Claims ohne Quelle", "Followerzahl und Selbstbeschreibung", "Primärdaten, dokumentierte Cases, veröffentlichte Forschung"], "correct": 3, "explanation": "Selbstbeschreibung und Followerzahl gelten allein als schwach."}, {"id": "masterclass-10", "question": "Woraus besteht die 4+1-Prompt-Formel für Marketing-Analysen in Gemini?", "options": ["Rolle, Kontext, Aufgabe, Format + Leitplanken", "Ziel, Budget, Zeit, Team + Feedback", "Titel, Text, Bild, Link + Hashtag", "Frage, Antwort, Quelle, Datum + Fazit"], "correct": 0, "explanation": "Die +1 sind Leitplanken, z. B. „Erkläre Fachbegriffe in Klammern“."}]}, {"id": "content", "title": "Content Creation & Performance", "course": "MKT-E232 (1–3)", "questions": [{"id": "content-01", "question": "Wie unterscheidet sich Content-Marketing von klassischer Werbung?", "options": ["Es liefert Mehrwert, damit Menschen freiwillig wiederkommen – statt direkt zum Kauf aufzufordern.", "Es funktioniert nur auf TikTok.", "Es verzichtet komplett auf Ziele und Kennzahlen.", "Es ist immer kostenpflichtig."], "correct": 0, "explanation": "Ziel: Vertrauen aufbauen, sichtbar werden, Kaufentscheidungen erleichtern."}, {"id": "content-02", "question": "Welche Reihenfolge haben die fünf Phasen des Content-Prozesses?", "options": ["Planung, Erstellung, Distribution, Analyse, Optimierung", "Distribution, Erstellung, Planung, Optimierung, Analyse", "Analyse, Optimierung, Planung, Erstellung, Distribution", "Erstellung, Planung, Analyse, Distribution, Optimierung"], "correct": 0, "explanation": "In jeder Phase kann KI unterstützen – der Mensch prüft."}, {"id": "content-03", "question": "Was ist der Unterschied zwischen Format und Kanal?", "options": ["Format = Plattform, Kanal = Thema", "Kanal = Länge des Inhalts", "Beide Begriffe bedeuten dasselbe", "Format = Gestaltung (z. B. Reel), Kanal = Plattform (z. B. Instagram)"], "correct": 3, "explanation": "Der Inhaltstyp ist der Zweck bzw. das Thema, z. B. „3 Styling-Tipps“."}, {"id": "content-04", "question": "Was ist Earned Media?", "options": ["Bezahlte Social Ads", "Interne Mitarbeiterkommunikation", "Verdiente Reichweite durch Dritte: geteilte Inhalte, PR, Backlinks", "Eigene Kanäle wie Website und Newsletter"], "correct": 2, "explanation": "Owned = eigene Kanäle, Paid = bezahlt, Earned = verdient."}, {"id": "content-05", "question": "Seit wann gelten die Transparenzpflichten nach EU AI Act Art. 50 (z. B. Kennzeichnung von Deepfakes)?", "options": ["Erst ab dem 11. Juni 2027", "Seit dem 2. August 2026", "Seit dem 1. August 2024", "Erst ab dem 2. Dezember 2027"], "correct": 1, "explanation": "Der Digital Omnibus hat Art. 50 nicht verschoben. Nur die maschinenlesbare Markierung für ältere KI-Systeme gilt ab 2. Dezember 2026; Hochrisiko-KI (Anhang III) ab 2. Dezember 2027."}, {"id": "content-06", "question": "Was kann KI laut Vorlesung NICHT?", "options": ["Texte entwerfen", "Muster in Daten erkennen", "Echte Empathie zeigen, die Markenstimme wirklich verstehen, Verantwortung übernehmen", "Themenideen vorschlagen"], "correct": 2, "explanation": "Der „Human Touch“ bleibt entscheidend – KI ist Co-Autor."}, {"id": "content-07", "question": "Warum ist „mehr Sichtbarkeit“ ein schlechtes Ziel?", "options": ["Weil man nur Umsatzziele formulieren darf.", "Weil Ziele nur für Paid Media gelten.", "Weil Sichtbarkeit im Content-Marketing keine Rolle spielt.", "Es ist nicht messbar – besser z. B. „+30 % organischer Traffic in 6 Monaten“."], "correct": 3, "explanation": "Weitere Fehler: alles gleichzeitig wollen, falsche Kennzahlen (Likes ≠ Umsatz)."}, {"id": "content-08", "question": "Welche Formate passen in den BOFU?", "options": ["„Was ist …?“-Blogartikel und Infografiken", "Allgemeine Trend-Reels", "Produktseiten, Bewertungen, Demos, zeitlich begrenzte Angebote, Warenkorb-Erinnerungen", "Erklärvideos für Einsteiger"], "correct": 2, "explanation": "TOFU holt die Leute ab – MOFU hält sie fest – BOFU bringt den Kauf."}, {"id": "content-09", "question": "Welches Tool eignet sich besonders für Recherche mit Quellenangaben?", "options": ["Inkscape", "Canva", "Perplexity", "CapCut"], "correct": 2, "explanation": "Tutoriumslösung fürs Whitepaper: Recherche mit Perplexity, Ausformulierung mit ChatGPT."}, {"id": "content-10", "question": "Welche Kombination nennt kostenlose Alternativen zu Photoshop, Premiere Pro und Illustrator?", "options": ["GIMP, DaVinci Resolve, Inkscape", "Scribus, Blender, Pixlr", "Canva, Excel, Word", "After Effects, InDesign, Lightroom"], "correct": 0, "explanation": "Scribus = InDesign-Alternative, Blender = After-Effects-Alternative."}]}, {"id": "crm", "title": "Smart CRM (B2B & B2C)", "course": "MKT-E233 (1–6)", "questions": [{"id": "crm-01", "question": "Warum werden First-Party-Daten immer wichtiger?", "options": ["Weil die DSGVO First-Party-Daten verbietet.", "Third-Party-Cookies fallen weg; eigene Daten werden zur Basis für Personalisierung und KI.", "Weil CRM-Systeme nur gekaufte Daten verarbeiten.", "Weil Third-Party-Daten genauer sind."], "correct": 1, "explanation": "First-Party = direkt von Kund:innen (Website, Shop, Newsletter)."}, {"id": "crm-02", "question": "Was bedeutet „Garbage in – Garbage out“ im CRM?", "options": ["Schlechte Daten führen zwangsläufig zu falscher Segmentierung und Personalisierung.", "Alte Daten müssen jährlich exportiert werden.", "Nur Müll-Mails landen im Spam.", "Gelöschte Daten werden automatisch wiederhergestellt."], "correct": 0, "explanation": "Dubletten, veraltete Adressen und leere Felder zerstören Personalisierung."}, {"id": "crm-03", "question": "Was unterscheidet Omnichannel von Multichannel?", "options": ["Omnichannel verbindet alle Kanäle über eine gemeinsame CRM-Datenbasis; Multichannel nutzt sie getrennt.", "Omnichannel nutzt nur einen Kanal.", "Multichannel ist immer kanalübergreifend vernetzt.", "Es gibt keinen Unterschied."], "correct": 0, "explanation": "Ziel: „eine Stimme“ zum Kunden über alle Touchpoints."}, {"id": "crm-04", "question": "Wer qualifiziert einen SQL?", "options": ["Das Marketing anhand von Klicks", "Die Buchhaltung nach Rechnungsstellung", "Der Vertrieb – anhand der BANT-Kriterien", "Der Kundenservice nach einer Reklamation"], "correct": 2, "explanation": "MQL = vom Marketing qualifiziert (Engagement), SQL = vom Vertrieb (Budget, Authority, Need, Timeline)."}, {"id": "crm-05", "question": "Welche Reihenfolge hat das 5A-Modell nach Kotler?", "options": ["Attention, Interest, Desire, Action, After-Sales", "Ask, Aware, Act, Appeal, Advocate", "Aware, Appeal, Ask, Act, Advocate", "Awareness, Consideration, Purchase, Retention, Loyalty"], "correct": 2, "explanation": "Das 5A-Modell berücksichtigt Recherche und Weiterempfehlung – anders als AIDA."}, {"id": "crm-06", "question": "Was unterscheidet KI-Lead-Scoring vom klassischen Scoring?", "options": ["KI vergibt immer +10 Punkte pro Download.", "Klassisches Scoring nutzt Machine Learning.", "KI-Scoring braucht keine Daten.", "KI gewichtet Signale dynamisch anhand historischer Abschlussdaten und erkennt mehrdimensionale Muster."], "correct": 3, "explanation": "Beispiel: KI erkennt, dass Webinar-Teilnahme stärker mit Käufen korreliert als Newsletter-Öffnungen."}, {"id": "crm-07", "question": "Wann ist KI-Scoring unzuverlässig?", "options": ["Wenn das CRM in der EU gehostet wird", "Bei zu wenig historischen Daten – dann sind Muster oft zufällig.", "Bei mehr als 1.000 Leads", "Wenn Marketing und Vertrieb zusammenarbeiten"], "correct": 1, "explanation": "Typisches Risiko bei Start-ups."}, {"id": "crm-08", "question": "Ein Kunde kauft eine Kaffeemaschine. Welche KI-Funktion schlägt passendes Zubehör vor?", "options": ["Next Best Offer", "Lead Routing", "Churn Prediction", "Dublettenprüfung"], "correct": 0, "explanation": "Z. B. Entkalker oder Bohnen-Abo in einer Follow-up-Mail."}, {"id": "crm-09", "question": "Was ist die typische Kostenfalle bei CRM-Systemen?", "options": ["Alle CRM-Systeme kosten dauerhaft gleich viel.", "Günstiger Einstieg, aber starke Preissteigerung bei Wachstum und für KI-Funktionen (z. B. HubSpot)", "Nur Open-Source-CRMs sind kostenpflichtig.", "Kostenlose CRMs speichern keine Kontakte."], "correct": 1, "explanation": "Deshalb Preismodell und Skalierungskosten vorab prüfen."}, {"id": "crm-10", "question": "Wie personalisiert man im B2B für ein Buying Center?", "options": ["Ausschließlich über Rabattcodes", "Alle Kontakte bekommen dieselbe Mail.", "Nur nach Geburtstag der Kontakte", "Nach Rolle: Entscheider:innen ROI-Argumente, Fachabteilung technische Details"], "correct": 3, "explanation": "Der CFO bekommt eine Case Study, Technik-Verantwortliche Produktspezifikationen."}]}, {"id": "email", "title": "E-Mail-Marketing & Automation", "course": "MKT-E234 (1)", "questions": [{"id": "email-01", "question": "Warum gilt E-Mail als Owned Media?", "options": ["Weil E-Mails öffentlich einsehbar sind", "Weil jede Mail bezahlt werden muss", "Volle Datenhoheit, keine Abhängigkeit von Plattform-Algorithmen", "Weil Mails von Influencern verschickt werden"], "correct": 2, "explanation": "E-Mail ist die „Verlängerung des Shops“."}, {"id": "email-02", "question": "Was passiert beim Double-Opt-In?", "options": ["Jede Mail wird doppelt verschickt.", "Der Kontakt muss sich zweimal abmelden.", "Nach der Anmeldung wird eine Bestätigungsmail geschickt; erst nach Bestätigung ist der Kontakt eingetragen.", "Der Newsletter wird an zwei Adressen gesendet."], "correct": 2, "explanation": "Pflicht nach DSGVO für Werbe-Mails."}, {"id": "email-03", "question": "Welche Pflichtangaben gehören in jede Marketing-Mail?", "options": ["Ein Bild und ein Video", "Firmenlogo, Rabattcode, Social-Media-Links", "Telefonnummer des Geschäftsführers", "Impressum, Abmeldelink, Hinweis auf die Datenschutzerklärung"], "correct": 3, "explanation": "Tracking (Öffnungen, Klicks) muss in der Datenschutzerklärung benannt sein."}, {"id": "email-04", "question": "Aus welchen drei Bausteinen besteht ein Automations-Workflow?", "options": ["Opt-in, Opt-out, Bounce", "Trigger, Aktion, Bedingung", "Segment, Budget, KPI", "Betreff, Text, Bild"], "correct": 1, "explanation": "Trigger löst aus, Aktion folgt, Bedingung entscheidet über Fortsetzen oder Stoppen."}, {"id": "email-05", "question": "Was ist Predictive Scoring?", "options": ["Eine manuelle Bewertung durch das Team", "KI berechnet die Wahrscheinlichkeit für Kauf, Öffnung oder Abwanderung eines Kontakts.", "Ein Spam-Filter", "Die Anzahl der versendeten Mails"], "correct": 1, "explanation": "Grundlage für Micro-Segmente und individuelle Ansprache."}, {"id": "email-06", "question": "Wo liegt die Grenze der „Best Send Time per User“?", "options": ["Sie ist in der EU verboten.", "Sie braucht genug historische Daten; bei wenig Daten können Muster zufällig sein.", "Sie gilt nur für B2B.", "Sie funktioniert nur am Wochenende."], "correct": 1, "explanation": "KI ermittelt die beste Versandzeit aus individuellen Öffnungsgewohnheiten."}, {"id": "email-07", "question": "Muss ein Rabatt-Newsletter nach BFSG barrierefrei sein?", "options": ["Nur wenn der Newsletter Bilder enthält", "Ja, jede Mail ohne Ausnahme", "Nein, das BFSG gilt nur für Print", "Meist keine direkte Pflicht; Service-Mails im Rahmen eines Kaufs sind dagegen meist relevant."], "correct": 3, "explanation": "Das BFSG gilt seit 28. Juni 2025. Merksatz: Gehört die Mail zu einer Verbraucher-Dienstleistung, ist Barrierefreiheit besonders wichtig."}, {"id": "email-08", "question": "Welche Kampagne passt zu „Kontakt hat seit 6 Monaten nicht geöffnet“?", "options": ["Welcome Series", "Transaktionsmail", "Re-Engagement („Vermisst du uns?“ + Anreiz)", "Warenkorbabbrecher-Mail"], "correct": 2, "explanation": "Ziel: inaktive Kontakte reaktivieren."}, {"id": "email-09", "question": "Welche zwei ethischen
