<style>
/* Layout: feste Navy-Navigation links, Lesespalte rechts; auf dem Handy Kopfleiste + ausklappbare Navigation */

}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b1220; --surface: #121b2e; --ink: #e2e8f0; --muted: #94a3b8; --line: #23304a;

  --nav: #070d19; --nav-hover: #141e33; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0b1220; --surface: #121b2e; --ink: #e2e8f0; --muted: #94a3b8; --line: #23304a;

* { box-sizing: border-box; }

/* Dashboard */

.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; }

/* Modul-Ansicht */

.endbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px 18px; }

/* Quiz */
.qbox { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 4vw, 30px); display: flex; flex-direction: column; gap: 16px; }

.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .k { font-family: var(--font-mono); font-weight: 600; width: 24px; height: 24px; flex: none; border-radius: 6px; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: .78rem; }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }

.feedback { border-radius: 9px; padding: 12px 16px; font-size: .95rem; }
.feedback.ok { background: var(--ok-soft); }
.feedback.no { background: var(--bad-soft); }
.feedback b { display: block; margin-bottom: 2px; }
.qnav { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
.score { font-family: var(--font-display); font-size: 3rem; line-height: 1; font-variant-numeric: tabular-nums; }
.review { display: flex; flex-direction: column; gap: 10px; }
.review div { border-left: 3px solid var(--bad); padding: 6px 12px; background: var(--bg); border-radius: 0 8px 8px 0; font-size: .92rem; }
.review small { color: var(--muted); display: block; }
.picker { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 10px; }

@media (max-width: 900px) {

<script>
const MODULES = [{"id": "seo-geo", "title": "SEO, GEO & Content", "course": "MKT-E231 (1–5)", "html": "<p><strong>Modul:<\/strong> MKT-E231 (Einheiten 1–5) · <strong>Grundlage:<\/strong> 5 Vorlesungen + 5 Tutorien in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Von SEO zu GEO: Neue Sichtbarkeitsstrategien im KI-Zeitalter<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Google- und ChatGPT-Optimierung, Offpage, KI-gestützte Content-Erstellung<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Die neue Rolle der Online-PR<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Tools für SEO &amp; GEO (Screaming Frog, Sistrix, GSC, GA4, KI-Tools)<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Tracking, Reporting &amp; KI-gestützte Analyse<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> SEO bleibt die Basis, reicht aber nicht mehr. KI-Antworten (Google „Übersichten mit KI“, KI-Modus, ChatGPT, Perplexity) beantworten viele Fragen direkt. Sichtbarkeit heißt deshalb zunehmend: <em>von der KI zitiert und genannt werden<\/em>, nicht nur: <em>auf Platz 1 ranken<\/em>.<\/p>\n<hr />\n<h2>1 · Von SEO zu GEO<\/h2>\n<h3>Wie es zum Wandel kam<\/h3>\n<ul>\n<li><strong>Klassische SEO:<\/strong> Ziel sind Top-Positionen in den organischen (unbezahlten) Google-Ergebnissen. Drei Säulen: <strong>Onpage<\/strong> (Keywords, Überschriften, Meta-Tags, Struktur), <strong>Offpage<\/strong> (Backlinks, Social Signals), <strong>Technik<\/strong> (Ladezeit, Mobilfreundlichkeit, Crawling). Lange galt das Bild der „10 blauen Links“ → Klick → Besuch → Conversion.<\/li>\n<li><strong>2022/2023:<\/strong> ChatGPT verändert das Suchverhalten – Fragen gehen direkt an Chatbots.<\/li>\n<li><strong>Mai 2023:<\/strong> Google startet die <em>Search Generative Experience (SGE)<\/em> in den USA, Vorläufer der <strong>AI Overviews<\/strong>.<\/li>\n<li><strong>2024/2025:<\/strong> AI Overviews („Übersichten mit KI“) werden ausgerollt, auch in Deutschland.<\/li>\n<li><strong>Seit Oktober 2025:<\/strong> Der <strong>KI-Modus<\/strong> (AI Mode) ist auch in der deutschen Google-Suche verfügbar.<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>AI Overviews (Übersichten mit KI)<\/th>\n<th>AI Mode (KI-Modus)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Feste Antwortblöcke über den Suchergebnissen<\/td>\n<td>Interaktiver Dialog mit Folgefragen<\/td>\n<\/tr>\n<tr>\n<td>Eher Artikel-Zusammenfassungen<\/td>\n<td>KI-gestützter Recherche-Partner<\/td>\n<\/tr>\n<tr>\n<td>Klicks noch möglich, aber seltener<\/td>\n<td>Klickraten sinken weiter (Zero Clicks)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>SEO vs. GEO<\/h3>\n<p><strong>GEO (Generative Engine Optimization)<\/strong> = Inhalte so gestalten, dass generative KI-Systeme sie zitieren, zusammenfassen und in Antworten einbinden. Die Leitfrage wechselt von „Wie komme ich auf Platz 1?“ zu „Wie bringe ich ChatGPT, Google-KI und Perplexity dazu, meine Inhalte zu verwenden?“<\/p>\n<table>\n<thead>\n<tr>\n<th>Kriterium<\/th>\n<th>SEO<\/th>\n<th>GEO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Ziel<\/td>\n<td>Ranking in Google-SERPs<\/td>\n<td>Zitierung &amp; Nutzung durch KI-Systeme<\/td>\n<\/tr>\n<tr>\n<td>Content-Form<\/td>\n<td>keywordbasiert, linear, leserfreundlich<\/td>\n<td>modular, strukturiert, „KI-snackable“<\/td>\n<\/tr>\n<tr>\n<td>Messwerte<\/td>\n<td>Position, CTR, organischer Traffic<\/td>\n<td>Zitationen, Präsenz in AI Overviews / KI-Antworten<\/td>\n<\/tr>\n<tr>\n<td>Erfolgsweg<\/td>\n<td>Google verstehen und optimieren<\/td>\n<td>von KI gelesen, verarbeitet, als vertrauenswürdig erkannt werden<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Merksatz:<\/strong> Sichtbarkeitsverlust ≠ Rankingverlust. Eine Seite kann auf Platz 1 stehen und trotzdem unter der KI-Antwort kaum gesehen werden.<\/p>\n<\/blockquote>\n<h3>Auswirkungen entlang des Funnels<\/h3>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Nutzerabsicht<\/th>\n<th>Typische Inhalte<\/th>\n<th>Wirkung der KI<\/th>\n<th>GEO-Strategie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TOFU<\/strong> (Top of Funnel)<\/td>\n<td>Information („Was ist ein ETF?“)<\/td>\n<td>Ratgeber, Definitionen<\/td>\n<td>Am stärksten betroffen – Zero-Click-Suche<\/td>\n<td>Zitiert statt geklickt werden; Named Entity Optimization<\/td>\n<\/tr>\n<tr>\n<td><strong>MOFU<\/strong> (Middle)<\/td>\n<td>Vergleich, Bewertung<\/td>\n<td>Produktvergleiche, Tests, Anleitungen<\/td>\n<td>KI fasst Vergleiche zusammen, nur noch vereinzelte Klicks<\/td>\n<td>Vergleichstabellen, Pro/Contra, Expertensicht – „Substanz + Struktur“<\/td>\n<\/tr>\n<tr>\n<td><strong>BOFU<\/strong> (Bottom)<\/td>\n<td>Kaufabsicht („Matratze 140x200 bestellen“)<\/td>\n<td>Shopseiten, Produktdaten<\/td>\n<td>Noch relativ stabil, Pfade werden kürzer<\/td>\n<td>Produktdaten mit Schema.org anreichern, modulare Landingpages<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Die drei GEO-Bausteine<\/h3>\n<ol>\n<li><strong>Modularer Content-Aufbau:<\/strong> Jeder Absatz, jede Liste, jede Tabelle ist für sich verständlich und beantwortet eine konkrete Frage.\n   <em>Nicht:<\/em> „Wir bieten viele Optionen.“ <em>Sondern:<\/em> „Unser Onlineshop bietet über 30 Bluetooth-Kopfhörer mit aktiver Geräuschunterdrückung.“<\/li>\n<li><strong>Structured Data &amp; semantische Klarheit:<\/strong> Schema.org-Markup für Produkte, FAQs (<code>FAQPage<\/code>), Events, Organisationen, Personen (<code>Person<\/code>).<\/li>\n<li><strong>Named Entity Optimization (NEO):<\/strong> Marke, Name oder Unternehmen tauchen im Web so klar und einheitlich auf, dass KI sie als verlässliche Quelle erkennt – einheitliche Schreibweise, Autorenprofile mit Qualifikation, Erwähnungen in Fachportalen.\n   ❌ „Wir sind Experten für nachhaltige Mode.“ ✅ „Hoffmanns Modehaus, gegründet 2010 in München, spezialisiert auf nachhaltige Bio-Damenmode.“<\/li>\n<\/ol>\n<table>\n<thead>\n<tr>\n<th>Klassische SEO-Strategie<\/th>\n<th>GEO-Strategie<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Keywords platzieren<\/td>\n<td>Aussagen mit semantischer Tiefe &amp; Struktur<\/td>\n<\/tr>\n<tr>\n<td>Verweildauer optimieren<\/td>\n<td>Einzeln zitierfähige Textblöcke<\/td>\n<\/tr>\n<tr>\n<td>Meta-Titel &amp; -Description<\/td>\n<td>Maschinenlesbare Einleitungen &amp; Absatzstruktur<\/td>\n<\/tr>\n<tr>\n<td>Content-Länge optimieren<\/td>\n<td>Modular: Deep Content + Snackable Nuggets<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>GEO-freundliche Formate:<\/strong> FAQ-Module, Mini-Ratgeber (TOFU), Vergleichstabellen (MOFU), Checklisten (werden oft 1:1 übernommen), Glossar-Artikel.<\/p>\n<p><strong>Vorbereitung auf den KI-Modus:<\/strong>\n- <em>Inhaltlich:<\/em> zitierbare Aussagen in 1–2 Sätzen, Frage–Antwort–Kontext-Struktur, einheitliche Markennennung („MeineMarke.de erklärt …“ statt „unser Blog“).\n- <em>Technisch:<\/em> Schema-Markup (FAQPage, Article, Author, Product), saubere H1/H2-Hierarchie, <strong>Content-Chunking<\/strong> (Inhalte in klar abgegrenzte, einzeln verständliche Blöcke teilen – KI greift oft nur auf einzelne Absätze zu).<\/p>\n<hr />\n<h2>2 · Google, ChatGPT &amp; Co.: unterschiedliche Spielregeln<\/h2>\n<table>\n<thead>\n<tr>\n<th>System<\/th>\n<th>Funktionsweise<\/th>\n<th>Wie man sichtbar wird<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Google AI Overviews &amp; KI-Modus<\/strong><\/td>\n<td>Webcrawling &amp; Index + klassische SEO-Signale + LLM-Auswertung<\/td>\n<td>Gute SEO <strong>plus<\/strong> semantische Klarheit (FAQs, Tabellen, Definitionen)<\/td>\n<\/tr>\n<tr>\n<td><strong>ChatGPT Standard (ohne Websuche)<\/strong><\/td>\n<td>Nur Trainingsdaten, kein Echtzeitzugriff<\/td>\n<td>In Trainingsdaten gelangen: oft referenzierte, strukturierte, vertrauenswürdige Inhalte<\/td>\n<\/tr>\n<tr>\n<td><strong>ChatGPT mit Internetsuche<\/strong><\/td>\n<td>Eigene Crawler + Bing-Signale<\/td>\n<td>Bing-Sichtbarkeit korreliert mit ChatGPT-Zitation<\/td>\n<\/tr>\n<tr>\n<td><strong>Gemini<\/strong><\/td>\n<td>Live-Websuche über Google, hybrid mit Trainingsdaten<\/td>\n<td>wie Google<\/td>\n<\/tr>\n<tr>\n<td><strong>Perplexity, Copilot, Claude<\/strong><\/td>\n<td>Eigene Crawler &amp; APIs, direkter Zugriff auf Wikipedia, Shop-Feeds, PDFs; nennen Quellen direkt<\/td>\n<td>Strukturierte, offen zugängliche Quellen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Begriffe:<\/strong> <em>LLM<\/em> = großes, mit riesigen Textmengen trainiertes Sprachmodell. <em>Named Entities<\/em> = benannte Dinge (Personen, Orte, Marken, Produkte). <em>Retrieval-Modell<\/em> = die KI holt vor dem Antworten gezielt passende Textstellen aus einer Datenbank.<\/p>\n<h3>Was bei Google weiterhin zählt – und was neu ist<\/h3>\n<ul>\n<li><strong>Bleibt:<\/strong> Crawling &amp; Indexierung (Mobile-First, Page Speed, XML-Sitemap, robots.txt), Onpage-Signale (Title, Meta-Description, H1-Hierarchie), Autorität (Backlinks, <strong>E-E-A-T<\/strong>, Aktualität).<\/li>\n<li><strong>Neu:<\/strong> Zitierlogik – Google zitiert <em>Aussagen<\/em>, nicht nur Seiten; strukturierte Daten (FAQPage, HowTo, Product); Tabellen, Bulletpoints, Checklisten; Content-Chunking.<\/li>\n<li><strong>Hybrid-Logik:<\/strong> Man kann bei Google ranken, ohne in AI Overviews aufzutauchen – und umgekehrt.<\/li>\n<\/ul>\n<p><strong>Sichtbarkeit außerhalb von Google erhöhen:<\/strong> Inhalte frei zugänglich (keine Paywall, kein Login), eindeutige Named Entities, prägnante geschlossene Aussagen, zitierfähige Formate, Präsenz in Wikipedia/Wikidata/Fachportalen, strukturierte PDFs (Whitepaper).<\/p>\n<h3>Offpage im GEO-Zeitalter<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Klassisches SEO<\/th>\n<th>GEO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Schwerpunkt<\/td>\n<td>Verlinkungen (Menge + Qualität)<\/td>\n<td>Erwähnungen, Named Entities, Zitationen – auch ohne Link<\/td>\n<\/tr>\n<tr>\n<td>Messwerte<\/td>\n<td>Domain Authority, Trust Flow, Linkprofil<\/td>\n<td>Kontext und Inhalt der Erwähnung<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Neue Offpage-Signale:<\/strong> Named Entity Mentions (auch ohne Link), zitierfähige Aussagen über das Unternehmen, Präsenz in <strong>Trusted Sources<\/strong> (Wikipedia, Fachportale, News), Nähe zu Themen-Clustern.\n<strong>Tipps:<\/strong> Markenprofil steuern (Wikipedia, LinkedIn, Google-Unternehmensprofil), Kooperationen und Interviews statt Linkbuilding, Pressemitteilungen mit zitierbaren Aussagen, Erwähnungen tracken (Mention, Brand24, Google Alerts, Talkwalker).<\/p>\n<h3>KI-gestützte Content-Erstellung<\/h3>\n<ul>\n<li><strong>Potenziale:<\/strong> Ideenfindung, Gliederungen, Entwürfe in Sekunden, Varianten für Zielgruppen/Kanäle, Meta-Texte, Übersetzung.<\/li>\n<li><strong>Risiko:<\/strong> Massenproduktion klingt beliebig und ist kaum zitierfähig – „A fool with a tool is still a fool“.<\/li>\n<li><strong>Strategie:<\/strong> zielgruppen- und funnelorientiert, echte Fragen beantworten, KI-verwertbare Formate, <strong>Unique Entities<\/strong> (Inhalte, die nur dein Unternehmen liefern kann).<\/li>\n<li><strong>Praxis:<\/strong> präzise Prompts mit Tonalität und Daten · strukturierte Templates (FAQ, Vergleich, Top-5, How-to) · zitierbare Aussagen mit Markenbezug · menschliche Nachbearbeitung (Faktencheck, Veredelung).<\/li>\n<\/ul>\n<hr />\n<h2>3 · Die neue Rolle der Online-PR<\/h2>\n<p><strong>Online-PR<\/strong> = redaktionelle, glaubwürdige, unbezahlte Inhalte in digitalen Kanälen: Fachmagazine, Branchenportale, Blogs, Podcasts, Interviews, Studien, Gastbeiträge, sachliche Social-Posts, Wikipedia, Q&amp;A-Plattformen.<\/p>\n<p><strong>Warum PR jetzt Teil von SEO/GEO ist:<\/strong> KI-Systeme achten stark auf autoritative Quellen, bevorzugen zitierfähige Inhalte und bekannte Expert:innen. Erwähnungen in Fachmedien „trainieren“ KI-Systeme indirekt.<\/p>\n<p><strong>Ziele 2026/2027:<\/strong> Wissensverankerung in KI-Systemen · indirektes Reputationssignal über <strong>E-E-A-T<\/strong> (Experience, Expertise, Authoritativeness, Trustworthiness; E-A-T seit 2014, E-E-A-T seit 2022).<\/p>\n<table>\n<thead>\n<tr>\n<th>Disziplin<\/th>\n<th>Ziel<\/th>\n<th>Unterschied zur Online-PR<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Content Marketing<\/td>\n<td>Leads &amp; Conversions über eigene Kanäle<\/td>\n<td>PR zielt auf externe, redaktionelle Kanäle<\/td>\n<\/tr>\n<tr>\n<td>SEO<\/td>\n<td>Ranking<\/td>\n<td>PR setzt auf Autorität &amp; externe Sichtbarkeit<\/td>\n<\/tr>\n<tr>\n<td>Social Media<\/td>\n<td>Community &amp; Interaktion<\/td>\n<td>PR nutzt Social Media eher zur Verbreitung<\/td>\n<\/tr>\n<tr>\n<td>Paid Media<\/td>\n<td>Reichweite gegen Geld<\/td>\n<td>PR ist unbezahlt und glaubwürdig<\/td>\n<\/tr>\n<tr>\n<td>Klassische PR<\/td>\n<td>Image offline<\/td>\n<td>Online-PR ist digital<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Mentions vs. Backlinks<\/h3>\n<table>\n<thead>\n<tr>\n<th>Signal<\/th>\n<th>SEO-Wert<\/th>\n<th>GEO-Wert<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Backlink von Fachportal<\/td>\n<td>hoch<\/td>\n<td>mittel<\/td>\n<\/tr>\n<tr>\n<td>Markenerwähnung ohne Link<\/td>\n<td>niedrig<\/td>\n<td><strong>hoch<\/strong> (semantisch erfasst)<\/td>\n<\/tr>\n<tr>\n<td>Zitat im Fachartikel<\/td>\n<td>mittel<\/td>\n<td><strong>sehr hoch<\/strong> (LLMs übernehmen Zitate)<\/td>\n<\/tr>\n<tr>\n<td>Social-Media-Erwähnung<\/td>\n<td>gering<\/td>\n<td>niedrig bis mittel<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Fazit der Folie:<\/strong> Für SEO zählen oft technische Signale, für GEO menschlich relevante Inhalte und öffentliche Wahrnehmung.<\/p>\n<\/blockquote>\n<h3>5 Bausteine strategischer GEO-PR<\/h3>\n<ol>\n<li>Expertenstatus zeigen (Autorenschaft, Interviews, Gastbeiträge)<\/li>\n<li>Named Entities klar und durchgängig platzieren<\/li>\n<li>Zitierbare Aussagen liefern<\/li>\n<li>Auf seriösen Plattformen erscheinen<\/li>\n<li>Zusammenhänge über das Themenumfeld herstellen<\/li>\n<\/ol>\n<p><strong>Was gut funktioniert:<\/strong> fachliche LinkedIn-Posts, Gastbeiträge auf Fachportalen, eigene Studien/Whitepaper, Podcast-Interviews <strong>mit Transkript<\/strong>, Kooperationen mit Nischenmedien (z. B. Branchen-Newsletter).<\/p>\n<h3>Plattformen &amp; Multiplikatoren<\/h3>\n<table>\n<thead>\n<tr>\n<th>Plattformtyp<\/th>\n<th>Beispiele<\/th>\n<th>GEO-Eignung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Fachmedien / Branchenportale<\/td>\n<td>t3n.de, heise.de, horizont.net<\/td>\n<td>sehr hoch<\/td>\n<\/tr>\n<tr>\n<td>Universitäts-, .gov-, .org-Seiten<\/td>\n<td>uni-muenchen.de, who.int, europa.eu<\/td>\n<td>sehr hoch<\/td>\n<\/tr>\n<tr>\n<td>Hochwertige Fachblogs<\/td>\n<td>–<\/td>\n<td>hoch<\/td>\n<\/tr>\n<tr>\n<td>KI-spezifische Quellen (Tech)<\/td>\n<td>arxiv.org, paperswithcode.com<\/td>\n<td>hoch (für Tech-Themen)<\/td>\n<\/tr>\n<tr>\n<td>Presseportale mit Archiv<\/td>\n<td>presseportal.de, openpr.de<\/td>\n<td>mittel bis hoch<\/td>\n<\/tr>\n<tr>\n<td>LinkedIn &amp; Medium<\/td>\n<td>–<\/td>\n<td>mittel (eher indirekt)<\/td>\n<\/tr>\n<tr>\n<td>Facebook, Instagram<\/td>\n<td>–<\/td>\n<td>gering<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Multiplikatoren<\/strong> = Personen oder Medien, die Inhalte weiterverbreiten. Wichtiger als reichweitenstarke Influencer:innen ohne Themenbezug sind Autor:innen und Redaktionen, die zum Thema veröffentlichen und bereits in KI-Trainingsdaten vorkommen. <strong>Qualität schlägt Menge.<\/strong><\/p>\n<hr />\n<h2>4 · Tools für SEO &amp; GEO<\/h2>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Hauptzweck<\/th>\n<th>Wichtige Insights<\/th>\n<th>Nutzen für GEO<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Screaming Frog SEO Spider<\/strong><\/td>\n<td>Crawler für technische SEO (Free-Version: bis 500 URLs)<\/td>\n<td>Fehlende Titles/Descriptions, Broken Links (404), Weiterleitungen (301 dauerhaft / 302 vorübergehend), Hreflang<\/td>\n<td>Nur was sauber gecrawlt wird, kann gerankt und zitiert werden – indirekter GEO-Hebel<\/td>\n<\/tr>\n<tr>\n<td><strong>Sistrix<\/strong><\/td>\n<td>Sichtbarkeitsindex (DACH-Standard), täglich aktualisiert<\/td>\n<td>Keyword-Rankings, Wettbewerbsvergleich, Verzeichnisebene, Mobile vs. Desktop, SERP-Features<\/td>\n<td>Zeigt im SERP-Features-Bericht, welche Seiten in AI Overviews erscheinen – auch bei Mitbewerbern<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Search Console<\/strong><\/td>\n<td>Kostenlos; zeigt, wie Google die Seite crawlt, indexiert, bewertet<\/td>\n<td>Leistung (Klicks, Impressionen, Keywords), Indexierung, Sitemaps, manuelle Maßnahmen<\/td>\n<td>Nur indexierte Seiten können in AI Overviews auftauchen<\/td>\n<\/tr>\n<tr>\n<td><strong>Google Analytics 4<\/strong><\/td>\n<td>Ereignisbasiertes Web-Analytics<\/td>\n<td>Seitenaufrufe, Engagement-Rate, Verweildauer, Conversions, Traffic-Quellen<\/td>\n<td>Nutzerverhalten wirkt als Relevanzsignal<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Sichtbarkeitsindex:<\/strong> nach oben offene Skala (kleiner Blog ≈ 0,5, Spiegel.de &gt; 1.000). Entscheidend ist die Entwicklung und der Vergleich mit Mitbewerbern – ein Frühwarnsystem bei technischen Fehlern, Google-Updates oder Content-Problemen.<\/p>\n<p><strong>GA4-Events:<\/strong> <code>page_view<\/code>, <code>scroll<\/code> (90 % der Seite), <code>click<\/code>, <code>form_submit<\/code>, <code>video_start<\/code>/<code>video_complete<\/code>, <code>purchase<\/code>.<\/p>\n<p><strong>KI-Tools für Content:<\/strong> Gemini/ChatGPT (Allrounder), Neuroflash (SEO-Analyse, Tonalität), SurferSEO (Onpage + SERP-Daten + KI-Text), Frase.io (Briefings, SERP-Auswertung, Entwürfe), Writesonic (KI-Text + Automatisierung).<\/p>\n<hr />\n<h2>5 · Tracking, Reporting &amp; KI-Analyse<\/h2>\n<p><strong>Problem:<\/strong> „Sichtbarkeit = Traffic“ gilt nicht mehr. Inhalte wirken schon beim Lesen der KI-Antwort – <strong>Zero-Click-Sichtbarkeit<\/strong> – und tauchen in Klicks, Sitzungen und Conversions nicht auf.<\/p>\n<table>\n<thead>\n<tr>\n<th>Stufe<\/th>\n<th>Früher<\/th>\n<th>Mit KI-Antworten<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>TOFU<\/td>\n<td>Viele Klicks auf Ratgeber<\/td>\n<td>0-Klick-Antworten dominieren<\/td>\n<\/tr>\n<tr>\n<td>MOFU<\/td>\n<td>Viele Klicks auf Vergleichsportale<\/td>\n<td>Nur vereinzelte Klicks<\/td>\n<\/tr>\n<tr>\n<td>BOFU<\/td>\n<td>Hohe Conversion durch klare Absicht<\/td>\n<td>Klicks bleiben relevant, Pfade kürzer und KI-vermittelt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>GA4-Kennzahlen für Traffic-Qualität:<\/strong>\n- <strong>Sessions:<\/strong> Besuche &gt; 10 Sekunden, mit Conversion-Event oder mehreren Seitenaufrufen\n- <strong>Engagement-Rate:<\/strong> Anteil engagierter Sitzungen – vergleicht KI-Traffic mit klassischem Traffic\n- <strong>Average Engagement Time per Session:<\/strong> aktive Zeit pro Sitzung\n- <strong>Mikro-Conversions<\/strong> (Scrolltiefe, Video-Views, Kontaktklick) vs. <strong>Makro-Conversions<\/strong> (Kauf, Anmeldung, Lead)\n- <strong>Traffic-Quellen-Report:<\/strong> organisch, KI-Referenzen, Social, Newsletter<\/p>\n<p><strong>Neue GEO-Messwerte:<\/strong>\n- Sichtbarkeit in Übersichten mit KI &amp; KI-Modus – <strong>direkte Quelle<\/strong> (mit Link) vs. <strong>indirekte Quelle<\/strong> (Erwähnung ohne Link)\n- Content-Zitat-Qualität (Relevanz, Kontext, Autorität der Quelle)\n- Marken-Sichtbarkeitsindex für KI\n- Performance getrennt nach TOFU/MOFU/BOFU<\/p>\n<p><strong>KI-Tools fürs Tracking:<\/strong> Sistrix, Surfer SEO, RankScale.ai, HubSpot AI Search Grader, Authoritas.<\/p>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SERP<\/td>\n<td>Search Engine Result Page – Suchergebnisseite<\/td>\n<\/tr>\n<tr>\n<td>CTR<\/td>\n<td>Click-Through-Rate – Klickrate<\/td>\n<\/tr>\n<tr>\n<td>Zero-Click-Suche<\/td>\n<td>Nutzer:in bekommt die Antwort in der Suche und klickt nicht<\/td>\n<\/tr>\n<tr>\n<td>GEO<\/td>\n<td>Generative Engine Optimization – Optimierung für KI-Antworten<\/td>\n<\/tr>\n<tr>\n<td>NEO<\/td>\n<td>Named Entity Optimization – einheitliche, erkennbare Nennung von Marke/Person<\/td>\n<\/tr>\n<tr>\n<td>E-E-A-T<\/td>\n<td>Experience, Expertise, Authoritativeness, Trustworthiness<\/td>\n<\/tr>\n<tr>\n<td>Content-Chunking<\/td>\n<td>Inhalte in eigenständig verständliche Blöcke teilen<\/td>\n<\/tr>\n<tr>\n<td>Schema.org<\/td>\n<td>Vokabular für strukturierte Daten (FAQPage, Product, Person …)<\/td>\n<\/tr>\n<tr>\n<td>Trusted Sources<\/td>\n<td>Vertrauenswürdige Quellen wie Wikipedia, Fachportale, News<\/td>\n<\/tr>\n<tr>\n<td>Crawler<\/td>\n<td>Programm, das Websites Seite für Seite ausliest<\/td>\n<\/tr>\n<tr>\n<td>Hreflang<\/td>\n<td>Code, der Sprache/Land einer Seite angibt<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Typische Tutoriumsaufgaben (je 2 von 3 Pflicht)<\/h2>\n<ul>\n<li>SEO vs. GEO in einer Tabelle vergleichen (Ziele, Content-Form, Messwerte, Erfolgsfaktoren)<\/li>\n<li>TOFU/MOFU/BOFU je ein Beispiel zuordnen und die am stärksten betroffene Stufe begründen<\/li>\n<li>GEO-optimierte Content-Skizze für ein Produkt (FAQ, Tabelle, Named Entities)<\/li>\n<li>Google- vs. ChatGPT-Sichtbarkeit vergleichen (Datenbasis, Funktionsweise, Zitationslogik)<\/li>\n<li>Offpage: Warum Backlinks an Bedeutung verlieren; Mentions &amp; Trusted Sources für ein Start-up priorisieren<\/li>\n<li>Online-PR von zwei Disziplinen abgrenzen; PR-Plattformen und eine Multiplikator-Person begründen<\/li>\n<li>Screaming Frog, Sistrix und Search Console vergleichen<\/li>\n<li>In Sistrix prüfen, ob eine Website in AI Overviews erscheint<\/li>\n<\/ul>\n<p><strong>Fallunternehmen der Gruppenübungen:<\/strong> Hoffmanns Modehaus, GesundLeben Shop, FeinSchmecker GmbH, Smartconsulting, Haus &amp; Garten Müller, EcoBeauty, PetPalace.<\/p>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Was unterscheidet GEO grundlegend von SEO?<\/strong>\n   → SEO zielt auf Rankings in Google-SERPs, GEO darauf, von KI-Systemen zitiert und in Antworten eingebunden zu werden.<\/li>\n<li><strong>Welche Funnel-Stufe ist durch AI Overviews am stärksten betroffen – und warum?<\/strong>\n   → TOFU: Informationsfragen werden direkt und vollständig von der KI beantwortet (Zero-Click).<\/li>\n<li><strong>Nenne die drei GEO-Bausteine.<\/strong>\n   → Modularer Content-Aufbau, Structured Data &amp; semantische Klarheit, Named Entity Optimization.<\/li>\n<li><strong>Warum ist eine Markenerwähnung ohne Link für GEO wertvoller als für SEO?<\/strong>\n   → KI erfasst den Markennamen semantisch im Zusammenhang, auch ohne Link; Google gewichtet sie für das Ranking dagegen gering.<\/li>\n<li><strong>Woran orientiert sich ChatGPT im Internetsuche-Modus?<\/strong>\n   → An eigenen Crawlern und Bing-basierten Signalen; Bing-Sichtbarkeit korreliert mit ChatGPT-Zitation.<\/li>\n<li><strong>Was bedeutet Content-Chunking?<\/strong>\n   → Inhalte in klar abgegrenzte, einzeln verständliche Textblöcke aufteilen, weil KI oft nur einzelne Absätze verwendet.<\/li>\n<li><strong>Welches Tool zeigt, ob eigene Seiten in Googles „Übersichten mit KI“ auftauchen?<\/strong>\n   → Sistrix, im SERP-Features-Bericht.<\/li>\n<li><strong>Warum reicht „Seite 1 bei Google“ als Ziel nicht mehr?<\/strong>\n   → Top-Platzierungen können unter der KI-Antwort liegen; die CTR sinkt auch bei guten Rankings.<\/li>\n<li><strong>Was ist der Unterschied zwischen direkter und indirekter Quelle im GEO-Reporting?<\/strong>\n   → Direkt: in der KI-Antwort mit Website-Link genannt. Indirekt: erwähnt, aber ohne Link.<\/li>\n<li><strong>Welche Plattformtypen sind für GEO-PR besonders geeignet?<\/strong>\n    → Fachmedien/Branchenportale sowie Universitäts-, .gov- und .org-Seiten (sehr hoch), danach hochwertige Fachblogs.<\/li>\n<\/ol>"}, {"id": "masterclass", "title": "Masterclass-Playbooks SEO & GEO", "course": "Masterclass", "html": "<p><strong>Grundlage:<\/strong> SEO Basics &amp; Technical Setup Playbook · GEO &amp; Personal Branding Playbook · Guided Masterclass „SEO &amp; GEO – From Search to AI Visibility“ · Deep Dives zu Google Gemini (Benutzeroberfläche, Marketing-Analysen). Stand der Unterlagen: September 2026.<\/p>\n<p><strong>Der rote Faden:<\/strong> SEO ist das Fundament, GEO erweitert es. Bevor Inhalte ranken oder zitiert werden, müssen Suchmaschinen sie finden, abrufen, verstehen und indexieren können. GEO-Erfolg entsteht aus technisch zugänglichen Inhalten, originärem Mehrwert, klaren Entitäten, belastbaren Quellen, konsistenter Positionierung und laufender Messung.<\/p>\n<hr />\n<h2>1 · SEO Basics &amp; Technical Setup<\/h2>\n<h3>Die fünf SEO-Bereiche<\/h3>\n<table>\n<thead>\n<tr>\n<th>Bereich<\/th>\n<th>Kernfrage<\/th>\n<th>Typische Aufgaben<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Technical SEO<\/td>\n<td>Kann die Suchmaschine die Website erreichen und verarbeiten?<\/td>\n<td>Crawling, Indexierung, Sitemaps, Canonicals, Statuscodes, Performance<\/td>\n<\/tr>\n<tr>\n<td>Onpage SEO<\/td>\n<td>Versteht sie Thema und Relevanz?<\/td>\n<td>Keywords, Suchintention, Titles, Überschriften, interne Links<\/td>\n<\/tr>\n<tr>\n<td>Offpage SEO<\/td>\n<td>Welche externen Vertrauenssignale gibt es?<\/td>\n<td>Backlinks, Erwähnungen, digitale PR<\/td>\n<\/tr>\n<tr>\n<td>Local SEO<\/td>\n<td>Ist das Unternehmen lokal sichtbar?<\/td>\n<td>Business Profile, lokale Landingpages, Bewertungen, NAP-Konsistenz<\/td>\n<\/tr>\n<tr>\n<td>E-Commerce SEO<\/td>\n<td>Sind Kategorien und Produkte skalierbar auffindbar?<\/td>\n<td>Facetten, Varianten, strukturierte Daten, Out-of-Stock-Logik<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Wie Suchmaschinen arbeiten<\/h3>\n<p><strong>Discovery → Crawling → Rendering → Indexierung → Ranking.<\/strong><\/p>\n<blockquote>\n<p>Gecrawlt heißt nicht indexiert, und indexiert heißt nicht gut gerankt. Die drei Ebenen getrennt prüfen.<\/p>\n<\/blockquote>\n<h3>Pflichtbausteine &amp; Statuscodes<\/h3>\n<p>HTTPS · saubere URL-Struktur · robots.txt · XML-Sitemap · Canonical · korrekte Statuscodes · Mobile Setup · Performance · Structured Data · Search Console, Bing Webmaster Tools, Webanalyse.<\/p>\n<table>\n<thead>\n<tr>\n<th>Code<\/th>\n<th>Bedeutung<\/th>\n<th>Einsatz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>200<\/td>\n<td>erreichbar<\/td>\n<td>reguläre indexierbare Seiten<\/td>\n<\/tr>\n<tr>\n<td>301<\/td>\n<td>permanente Weiterleitung<\/td>\n<td>dauerhaft geänderte URL, direkt aufs Ziel<\/td>\n<\/tr>\n<tr>\n<td>302 / 307<\/td>\n<td>temporäre Weiterleitung<\/td>\n<td>nur bei echt vorübergehender Änderung<\/td>\n<\/tr>\n<tr>\n<td>404<\/td>\n<td>nicht gefunden<\/td>\n<td>nicht vorhandene URLs<\/td>\n<\/tr>\n<tr>\n<td>410<\/td>\n<td>bewusst dauerhaft entfernt<\/td>\n<td>endgültig gelöschte Inhalte<\/td>\n<\/tr>\n<tr>\n<td>5xx<\/td>\n<td>Serverfehler<\/td>\n<td>schnell beheben, behindert Crawling<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Redirect-Falle:<\/strong> Ketten wie A → B → C vermeiden; intern direkt auf die finale URL verlinken.<\/p>\n<h3>robots.txt, noindex, Sitemap – nicht verwechseln<\/h3>\n<table>\n<thead>\n<tr>\n<th>Mechanismus<\/th>\n<th>Funktion<\/th>\n<th>Einsatz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>robots.txt<\/td>\n<td><strong>Crawling<\/strong> steuern<\/td>\n<td>technische Pfade blockieren – entfernt keine URL aus dem Index<\/td>\n<\/tr>\n<tr>\n<td>meta robots noindex<\/td>\n<td><strong>Indexierung<\/strong> verhindern<\/td>\n<td>interne Suche, Filterseiten, Danke-Seiten<\/td>\n<\/tr>\n<tr>\n<td>XML-Sitemap<\/td>\n<td><strong>Discovery<\/strong> unterstützen<\/td>\n<td>nur 200-URLs, bevorzugte Canonicals, keine noindex-Seiten<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ Ist eine URL per robots.txt blockiert, kann der Bot ein noindex auf der Seite eventuell gar nicht lesen.<\/p>\n<h3>Onpage-Elemente<\/h3>\n<p>Title Tag (einzigartig, präzise, kein Keyword-Stuffing) · Meta Description (Klickanreiz; Google kann anderen Text wählen) · H1 (Thema klar) · H2/H3 (logische Hierarchie) · Body (Suchintention beantworten) · interne Links · beschreibender Anchor Text statt „hier klicken“ · Alt-Text.<\/p>\n<h3>Core Web Vitals<\/h3>\n<table>\n<thead>\n<tr>\n<th>Metrik<\/th>\n<th>Misst<\/th>\n<th>Gut<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>LCP<\/strong> – Largest Contentful Paint<\/td>\n<td>Laden des größten sichtbaren Elements<\/td>\n<td>≤ 2,5 s<\/td>\n<\/tr>\n<tr>\n<td><strong>INP<\/strong> – Interaction to Next Paint<\/td>\n<td>Reaktion auf Interaktionen<\/td>\n<td>≤ 200 ms<\/td>\n<\/tr>\n<tr>\n<td><strong>CLS<\/strong> – Cumulative Layout Shift<\/td>\n<td>visuelle Stabilität<\/td>\n<td>≤ 0,1<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Typische Ursachen schlechter Werte: übergroße Bilder, Render-Blocking, zu viel JavaScript, langsame Server, Fonts, Drittanbieter-Tags. Templates testen (Kategorie, Produkt, Blog), nicht nur die Startseite; Feld- und Labordaten kombinieren.<\/p>\n<h3>Strukturierte Daten<\/h3>\n<p>Product, BreadcrumbList, Organization, LocalBusiness, Article, VideoObject, FAQ/Q&amp;A. <strong>JSON-LD<\/strong> ist meist am praktikabelsten. Markup muss zum sichtbaren Inhalt passen und garantiert kein Rich Result.<\/p>\n<h3>Google Search Console &amp; Bing Webmaster Tools<\/h3>\n<p><strong>GSC einrichten:<\/strong> Domain-Property anlegen → verifizieren → Sitemap einreichen → Indexierungsberichte → URL Inspection für wichtige Templates → Performance nach Query, Seite, Land, Gerät analysieren.<\/p>\n<p><strong>Typische Diagnosen:<\/strong>\n- Viele Impressions + niedrige CTR → Snippet und Suchintention prüfen\n- Gute CTR + Position knapp außerhalb der Top-Ergebnisse → Content, interne Links, Konkurrenz\n- Wichtige URL nicht indexiert → URL Inspection und Indexierungsgrund<\/p>\n<p><strong>Analyse-Workflow:<\/strong> Technik → Indexierung → Suchnachfrage → SERP analysieren → Seite optimieren → messen → iterieren (Hypothese → Änderung → Messzeitraum → Ergebnis → nächste Maßnahme).<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Google<\/th>\n<th>Bing<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Plattform<\/td>\n<td>Search Console<\/td>\n<td>Webmaster Tools<\/td>\n<\/tr>\n<tr>\n<td>Technischer Crawl<\/td>\n<td>kein vollständiger Crawler<\/td>\n<td>Site Scan integriert<\/td>\n<\/tr>\n<tr>\n<td>Keyword Research<\/td>\n<td>nicht als vollwertiges Tool<\/td>\n<td>integriert<\/td>\n<\/tr>\n<tr>\n<td>Push-Indexierung<\/td>\n<td>kein IndexNow-Workflow<\/td>\n<td><strong>IndexNow<\/strong> zentral<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>IndexNow<\/strong> = Push-Protokoll: Die Website meldet neue, geänderte oder gelöschte URLs aktiv an teilnehmende Suchmaschinen. Garantiert keine Indexierung, ist aber für große Shops mit wechselnden Preisen und Verfügbarkeiten interessant.<\/p>\n<h3>E-Commerce- und internationales SEO<\/h3>\n<ul>\n<li><strong>Facetten/Filter:<\/strong> Crawl- und Indexierungsstrategie bewusst festlegen<\/li>\n<li><strong>Varianten:<\/strong> Canonical-Logik nach Suchnachfrage und Eigenwert<\/li>\n<li><strong>Produkttexte:<\/strong> eigene statt identischer Herstellertexte<\/li>\n<li><strong>Out of Stock:<\/strong> Seite bestehen lassen, Alternativen anbieten<\/li>\n<li><strong>Discontinued:<\/strong> 301 auf echten Nachfolger oder 404/410<\/li>\n<li><strong>International:<\/strong> eigene URLs pro Sprache/Land, hreflang, lokalisieren statt nur übersetzen, Canonical und hreflang nicht widersprüchlich<\/li>\n<\/ul>\n<h3>SEO-KPIs<\/h3>\n<blockquote>\n<p><strong>Management-Regel:<\/strong> Rankings sind ein Mittel, kein Geschäftsziel.<\/p>\n<\/blockquote>\n<p>Organic Clicks, Impressions, CTR (= Clicks ÷ Impressions), Average Position, Indexed Pages, Organic Conversions, Organic Revenue, Referring Domains – jeweils nicht isoliert betrachten.<\/p>\n<p><strong>Start-Empfehlung:<\/strong> Search Console, Bing Webmaster Tools, XML-Sitemap, technische Indexierbarkeit, regelmäßiges Monitoring.<\/p>\n<hr />\n<h2>2 · GEO &amp; Personal Branding<\/h2>\n<blockquote>\n<p><strong>Merksatz:<\/strong> SEO optimiert Auffindbarkeit in Suchergebnissen. GEO optimiert zusätzlich die Wahrscheinlichkeit, als verständliche, belastbare und zitierfähige Quelle in generativen Antworten zu dienen. GEO ersetzt SEO nicht.<\/p>\n<\/blockquote>\n<p><strong>Was sich ändert:<\/strong> längere, dialogische Suchanfragen; Antworten ohne Klick; Content muss extrahierbar, eindeutig, aktuell und belegbar sein; nicht jede Citation erzeugt einen Klick.<\/p>\n<p><strong>Google 2026:<\/strong> Bewährte SEO-Grundlagen bleiben relevant; spezielle „GEO-Tricks“ ersetzen weder Crawlability noch originäre Inhalte. <strong>llms.txt<\/strong> ist laut Google für die Google-Suche weder nötig noch wirksam.<\/p>\n<h3>Das GEO-Fundament – sechs Ebenen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Ebene<\/th>\n<th>Was muss stimmen?<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Technik<\/td>\n<td>Crawling, Indexierung, Canonicals, Sitemaps, interne Links<\/td>\n<\/tr>\n<tr>\n<td>Information<\/td>\n<td>klare Antworten, logische Überschriften, Tabellen, Definitionen<\/td>\n<\/tr>\n<tr>\n<td>Evidence<\/td>\n<td>Daten, Quellen, Methodik, Primärbelege<\/td>\n<\/tr>\n<tr>\n<td>Entity<\/td>\n<td>Name, Rolle, Organisation, Profile, strukturierte Daten<\/td>\n<\/tr>\n<tr>\n<td>Freshness<\/td>\n<td>Aktualisierung, Datumsangaben<\/td>\n<\/tr>\n<tr>\n<td>Consistency<\/td>\n<td>Website, Profile, Bios und Medien erzählen dieselbe Geschichte<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Nicht-Commodity-Content / Information Gain:<\/strong> Was findet ein Leser hier, das nicht schon auf 50 anderen Seiten steht? Eigene Erfahrung, Daten, Expertenzitate, Fallstudien, Tests.<\/p>\n<h3>Antwort-orientierte Artikelstruktur<\/h3>\n<p>Klare Headline → <strong>Kurzantwort in 40–80 Wörtern<\/strong> → Definition/Kontext → Vertiefung → Evidence Layer → Comparison Layer → Expert Layer → FAQ/Folgefragen → Autor/Profil → Update-Hinweis.<\/p>\n<p><strong>Structured Data für Personen:<\/strong> Person/Organization, ProfilePage, Article/BlogPosting mit konsistentem Autor, <code>sameAs<\/code> nur auf echte Profile.<\/p>\n<h3>Personal Branding als GEO-Verstärker<\/h3>\n<p>Eine Personal Brand verdichtet <strong>reale<\/strong> Erfahrung zu einer klaren Positionierung – keine erfundene Expertenrolle. Vertrauen entsteht durch Konsistenz und Belege.<\/p>\n<ul>\n<li><strong>Positionierungsformel:<\/strong> Für wen? Welches Problem? Welche Expertise? Welche Perspektive? Welcher Proof? Welche Themen?<\/li>\n<li><strong>Topic Ownership:<\/strong> 3–5 Themencluster statt „über alles posten“<\/li>\n<li><strong>E-E-A-T als Denkmodell<\/strong> (kein einzelner Ranking-Score): Experience, Expertise, Authoritativeness, Trust<\/li>\n<li><strong>Entity Stack:<\/strong> eigene Website, About-Seite, LinkedIn, Author Pages, Speaker-Profile, Presse/Podcasts, Publikationen – mit stabiler Namensform<\/li>\n<\/ul>\n<table>\n<thead>\n<tr>\n<th>Proof-Stärke<\/th>\n<th>Beispiele<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stark<\/td>\n<td>Primärdaten, dokumentierte Cases, veröffentlichte Forschung<\/td>\n<\/tr>\n<tr>\n<td>Gut<\/td>\n<td>Konferenzauftritte, Lehre, seriöse Interviews, Gastbeiträge<\/td>\n<\/tr>\n<tr>\n<td>Unterstützend<\/td>\n<td>Testimonials, Portfolio, Zertifikate<\/td>\n<\/tr>\n<tr>\n<td>Schwach allein<\/td>\n<td>Selbstbeschreibung, Followerzahl, „Top Expert“-Claims<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Content-System: die 1-5-15-Methode<\/h3>\n<p><strong>1<\/strong> starkes Primär-Asset → <strong>5<\/strong> vertiefende Inhalte → <strong>15+<\/strong> kleine Einheiten über Kanäle.\nEbenen: Pillar (Studie, Playbook) → Support (Blog, FAQ, Glossar) → Authority (Gastbeitrag, Podcast) → Distribution (LinkedIn, Newsletter) → Conversion (Service Page, Webinar).<\/p>\n<h3>Messung<\/h3>\n<table>\n<thead>\n<tr>\n<th>Klassische SEO-Metrik<\/th>\n<th>AI-/GEO-Metrik<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Impressions<\/td>\n<td>AI Citations<\/td>\n<\/tr>\n<tr>\n<td>Clicks<\/td>\n<td>Cited Pages<\/td>\n<\/tr>\n<tr>\n<td>Queries<\/td>\n<td>Grounding Queries / Intents<\/td>\n<\/tr>\n<tr>\n<td>Position<\/td>\n<td>keine direkte Entsprechung<\/td>\n<\/tr>\n<tr>\n<td>Organic Traffic<\/td>\n<td>AI Referral Traffic<\/td>\n<\/tr>\n<tr>\n<td>Backlinks<\/td>\n<td>Brand Mentions / Source References<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Bing „AI Performance“<\/strong> (Webmaster Tools, 2026): zeigt Total Citations, zitierte Seiten, Grounding Queries und Trends für Copilot und Bing-KI-Zusammenfassungen – keine Rankings oder Klicks.\n<strong>Monitoring-Stack:<\/strong> GSC, Bing Webmaster Tools, Web Analytics (AI Referrals), Brand Monitoring, manuelle Prompt-Stichproben, CRM.<\/p>\n<blockquote>\n<p>Eine Citation ist kein Besuch – GEO immer mit Business-KPIs verbinden (Leads, Conversions, Revenue, Brand Search).<\/p>\n<\/blockquote>\n<h3>90-Tage-Plan<\/h3>\n<table>\n<thead>\n<tr>\n<th>Zeitraum<\/th>\n<th>Schwerpunkt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Tag 1–30<\/td>\n<td>Fundament: Positionierung, Entity Audit, Profilseite, Technik, 3–5 Topic Pillars<\/td>\n<\/tr>\n<tr>\n<td>Tag 31–60<\/td>\n<td>Authority Content: 2–4 Pillar Assets, Support Content, Distribution<\/td>\n<\/tr>\n<tr>\n<td>Tag 61–90<\/td>\n<td>Validation &amp; Scale: externe Erwähnungen, Monitoring, KPI-Review<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Prompt-Bibliothek:<\/strong> GEO Content Gap · Entity Consistency · Citation Readiness · Topic Map · Personal Brand Proof Audit · Refresh Audit – jeweils mit der Regel, keine Credentials oder Fakten zu erfinden.<\/p>\n<hr />\n<h2>3 · Guided Masterclass: SEO &amp; GEO Visibility Audit<\/h2>\n<p><strong>Rolle:<\/strong> Junior Consultant, der einen ersten Search Visibility Audit für ein reales, eher kleines bis mittleres Unternehmen erstellt (ca. 120–150 Minuten).<\/p>\n<p><strong>Prozess:<\/strong> Suchverhalten → Keywords → Search Intent → Content → Technik → Indexierung → Rankings → Autorität → AI Search → GEO → Optimierung.<\/p>\n<h3>Search Intent<\/h3>\n<table>\n<thead>\n<tr>\n<th>Intention<\/th>\n<th>Absicht<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Informational<\/td>\n<td>etwas wissen<\/td>\n<td>Was ist getreidefreies Hundefutter?<\/td>\n<\/tr>\n<tr>\n<td>Commercial<\/td>\n<td>vor Kauf recherchieren<\/td>\n<td>Bestes getreidefreies Hundefutter<\/td>\n<\/tr>\n<tr>\n<td>Transactional<\/td>\n<td>kaufen/handeln<\/td>\n<td>Getreidefreies Hundefutter kaufen<\/td>\n<\/tr>\n<tr>\n<td>Navigational<\/td>\n<td>Marke/Website finden<\/td>\n<td>Markenname Hundefutter<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h3>Short Tail vs. Long Tail<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Short Tail<\/th>\n<th>Long Tail<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Beispiel<\/td>\n<td>Hundefutter<\/td>\n<td>getreidefreies Hundefutter für empfindlichen Magen<\/td>\n<\/tr>\n<tr>\n<td>Thema / Intention<\/td>\n<td>breit, weniger eindeutig<\/td>\n<td>spezifisch, klarer<\/td>\n<\/tr>\n<tr>\n<td>Suchvolumen / Wettbewerb<\/td>\n<td>eher hoch / stärker<\/td>\n<td>einzeln niedriger / oft geringer<\/td>\n<\/tr>\n<tr>\n<td>Content<\/td>\n<td>Kategorie / Pillar<\/td>\n<td>Landingpage, Produktseite, Ratgeber<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Keyword-Recherche in 8 Schritten:<\/strong> Seed Keywords → Google Autocomplete → Short Tail → Long Tail → SERPs vergleichen → verwandte Fragen → Keyword-Tool (Keyword Planner, Trends, Ahrefs, Semrush, Ubersuggest, AnswerThePublic, AlsoAsked) → KI als Sparringspartner (ohne erfundene Suchvolumina).<\/p>\n<blockquote>\n<p><strong>Merksatz:<\/strong> Das größte Keyword ist nicht automatisch das beste. Relevanz + Search Intent + Business Value + Wettbewerb + Suchnachfrage.<\/p>\n<\/blockquote>\n<p><strong>Weitere Phasen:<\/strong> Primary Keyword wählen · Topic Cluster (Pillar + ≥ 5 Cluster Topics) · 8 Technik-Checks (<code>site:<\/code>-Abfrage, Sitemap, robots.txt, HTTPS, Statuscodes, Canonical, PageSpeed/CWV, Mobile) · GSC und Bing · Onpage-Check einer Seite · Offpage (<code>\"Name\" -site:domain.de<\/code>) · Information Gain · AI Search Reality Check in 2 Systemen · GEO Content Challenge (H1, Quick Answer 40–60 Wörter, H2-Struktur, Evidence, FAQ, Trust) · Structured Data · Entity Check · Roadmap mit Top 5 Maßnahmen.<\/p>\n<p><strong>Final Challenge:<\/strong> „Sollen wir in SEO oder GEO investieren?“ – in max. 150 Wörtern. Die beste Antwort kann zeigen, dass viele Maßnahmen beides verbessern.<\/p>\n<blockquote>\n<p><strong>Merksatz:<\/strong> Ein guter Consultant fragt nicht „Was sagt die KI?“, sondern „Welche Daten und Beobachtungen habe ich, und welche Entscheidung kann ich daraus begründet ableiten?“<\/p>\n<\/blockquote>\n<hr />\n<h2>4 · Deep Dives Google Gemini<\/h2>\n<p><strong>Oberfläche:<\/strong> Seitenleiste mit Neuer Chat, Chats durchsuchen, Bilder, Videos, Mediathek, <strong>Gems<\/strong> (eigene KI-Assistenten, vergleichbar mit Custom GPTs); Einstellungen mit Verbundenen Apps (Workspace), Geplanten Aktionen, Gemini Notebook, Wasserzeichen für KI-Medien.<\/p>\n<table>\n<thead>\n<tr>\n<th>Modell<\/th>\n<th>Einsatz<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Flash<\/td>\n<td>Alltag: schnelle Entwürfe, E-Mails, kurze Recherchen<\/td>\n<\/tr>\n<tr>\n<td>Thinking<\/td>\n<td>„überlegt“ vor der Ausgabe: Analysen, Strategien, mehrstufige Pläne<\/td>\n<\/tr>\n<tr>\n<td>Pro<\/td>\n<td>Hochleistung: Mathematik, Code, große Datenanalysen<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Plus-Menü:<\/strong> Dateien/Google Drive hochladen, Bild/Video/Musik erstellen, <strong>Canvas<\/strong> (Leinwand für Dokumente/Code), <strong>Deep Research<\/strong> (Tiefenrecherche mit Quellen), Diktierfunktion.<\/p>\n<p><strong>Marketing-Analysen mit Gemini:<\/strong> CSV-Export (Google Ads, Analytics, Shop, CRM) hochladen und nach der <strong>4+1-Formel<\/strong> prompten: <strong>Rolle<\/strong> (Marketing-Datenanalyst:in) · <strong>Kontext<\/strong> (Tool, Angebot, Zielgruppe, Haupt-Conversion) · <strong>Aufgabe<\/strong> (Kennzahlen, Muster, Ausreißer, 2–3 Empfehlungen) · <strong>Format<\/strong> (Kurzüberblick, Auffälligkeiten, Empfehlungen) · <strong>+1 Leitplanken<\/strong> (Fachbegriffe erklären).\n<em>Warum CSV statt Excel?<\/em> Reiner Text ohne Formatierung und Formeln – für KI leichter lesbar.<\/p>\n<hr />\n<h2>Glossar (Auswahl)<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Canonical<\/td>\n<td>bevorzugte URL bei ähnlichen Inhalten<\/td>\n<\/tr>\n<tr>\n<td>Crawl Budget<\/td>\n<td>Ressourcen, die eine Suchmaschine fürs Crawling einer Site aufwendet<\/td>\n<\/tr>\n<tr>\n<td>Keyword Cannibalization<\/td>\n<td>eigene Seiten konkurrieren um dieselbe Intention<\/td>\n<\/tr>\n<tr>\n<td>Grounding<\/td>\n<td>KI-Antwort wird mit externen Quellen verankert<\/td>\n<\/tr>\n<tr>\n<td>Citation<\/td>\n<td>sichtbarer Quellenverweis in einer KI-Antwort<\/td>\n<\/tr>\n<tr>\n<td>AI Referral<\/td>\n<td>Besuch, der von einer KI-Oberfläche kommt<\/td>\n<\/tr>\n<tr>\n<td>Information Gain<\/td>\n<td>zusätzlicher Informationswert gegenüber vorhandenen Inhalten<\/td>\n<\/tr>\n<tr>\n<td>Knowledge Graph<\/td>\n<td>strukturierte Darstellung von Entitäten und Beziehungen<\/td>\n<\/tr>\n<tr>\n<td>Topic Cluster / Pillar<\/td>\n<td>Inhalte rund um ein Kernthema / dessen umfangreiches Kern-Asset<\/td>\n<\/tr>\n<tr>\n<td>AEO<\/td>\n<td>Answer Engine Optimization<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Was ist der Unterschied zwischen robots.txt und noindex?<\/strong>\n   → robots.txt steuert das Crawling, noindex verhindert die Indexierung einer abrufbaren Seite.<\/li>\n<li><strong>Welche Werte gelten bei den Core Web Vitals als gut?<\/strong>\n   → LCP ≤ 2,5 s, INP ≤ 200 ms, CLS ≤ 0,1.<\/li>\n<li><strong>Für wen ist IndexNow interessanter: 15-Seiten-Website oder Shop mit 30.000 Produkten?<\/strong>\n   → Für den Shop: Häufige Preis- und Verfügbarkeitsänderungen lassen sich aktiv melden.<\/li>\n<li><strong>Was sagt Google 2026 zu llms.txt?<\/strong>\n   → Für die Google-Suche weder erforderlich noch mit positivem oder negativem Effekt.<\/li>\n<li><strong>Was beschreibt die 1-5-15-Methode?<\/strong>\n   → 1 Primär-Asset, 5 abgeleitete vertiefende Inhalte, mindestens 15 kleine Einheiten zur Distribution.<\/li>\n<li><strong>Welche vier Suchintentionen gibt es?<\/strong>\n   → Informational, Commercial, Transactional, Navigational.<\/li>\n<li><strong>Welche Diagnose passt zu „viele Impressions, niedrige CTR“?<\/strong>\n   → Snippet (Title, Description) und Passung zur Suchintention prüfen.<\/li>\n<li><strong>Warum ist eine Citation in KI-Antworten nicht automatisch Erfolg?<\/strong>\n   → Sie erzeugt nicht zwingend einen Besuch; GEO muss mit Business-KPIs verbunden werden.<\/li>\n<li><strong>Welche Proof-Elemente gelten im Personal Branding als stark?<\/strong>\n   → Primärdaten, dokumentierte Cases, veröffentlichte Forschung, nachprüfbare Rollen.<\/li>\n<li><strong>Woraus besteht die 4+1-Prompt-Formel?<\/strong>\n    → Rolle, Kontext, Aufgabe, Format + Leitplanken.<\/li>\n<\/ol>"}, {"id": "content", "title": "Content Creation & Performance", "course": "MKT-E232 (1–3)", "html": "<p><strong>Modul:<\/strong> MKT-E232 (Einheiten 1–3) · <strong>Grundlage:<\/strong> 3 Vorlesungen, 3 Tutorien-Aufgabenblätter und 3 ausgearbeitete Tutoriumslösungen in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Grundlagen &amp; Definition: Content-Marketing und Content-Prozess im KI-Zeitalter<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Formate &amp; Ziele: Datengetriebene Auswahl passender Content-Formate<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Content-Tools &amp; Anwendungsfälle: Von ChatGPT bis Adobe Creative Cloud<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> Content-Marketing liefert Mehrwert statt Werbung. KI unterstützt fast jeden Schritt – von der Idee bis zur Analyse –, aber der Mensch gibt die Richtung vor und prüft Qualität, Tonalität und Fakten. Formate wählt man nach Ziel, Funnel-Phase und Daten, nicht nach Geschmack.<\/p>\n<hr />\n<h2>1 · Content-Marketing &amp; Content-Prozess<\/h2>\n<p><strong>Definition:<\/strong> Unternehmen erstellen Inhalte, die für ihre Zielgruppe nützlich, informativ oder unterhaltsam sind – statt reiner Werbung. Ziel: Vertrauen aufbauen, sichtbar werden, Kaufentscheidungen erleichtern.\n<strong>Unterschied zur Werbung:<\/strong> Nicht „Kauf jetzt!“, sondern Mehrwert, damit Menschen freiwillig wiederkommen.<\/p>\n<p><strong>Typische Ziele:<\/strong> Reichweite &amp; Sichtbarkeit · Markenaufbau &amp; Vertrauen · Leadgenerierung &amp; Verkäufe · Kundenservice &amp; Loyalität.<\/p>\n<p><strong>Entwicklung:<\/strong> Broschüren und Print → 2010er Social Media &amp; Video → 2020er Automatisierung → seit 2023 KI-Chatbots und KI-Suche → heute: KI fest in Workflows, KI-Agenten, Kurzvideo dominiert, Personalisierung.<\/p>\n<p><strong>Herausforderungen:<\/strong> Informationsflut · KI-Spam (Qualität wird Wettbewerbsvorteil) · Zero-Click-Problem · Ressourcen (Regelmäßigkeit ist die größte Hürde) · Messbarkeit (viele Aufrufe ≠ viele Verkäufe).<\/p>\n<h3>Die 5 Phasen des Content-Prozesses<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Inhalt<\/th>\n<th>KI-Unterstützung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>1. Planung<\/strong><\/td>\n<td>Ziele, Zielgruppe, Themen (Keywords, Trends), Formate, Redaktionskalender<\/td>\n<td>Themenideen, Keyword-Vorschläge, Kalender-Entwurf<\/td>\n<\/tr>\n<tr>\n<td><strong>2. Erstellung<\/strong><\/td>\n<td>Text, Bild, Video, Audio; Rollen: Texter:in, Designer:in, SEO<\/td>\n<td>ChatGPT, Claude, Gemini · Midjourney, Canva · CapCut, Veo 3 – <strong>immer menschlich prüfen<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>3. Distribution<\/strong><\/td>\n<td>Owned, Paid, Earned Media<\/td>\n<td>bester Zeitpunkt/Kanal, automatische Formatvarianten (Blog → Post → Newsletter)<\/td>\n<\/tr>\n<tr>\n<td><strong>4. Analyse<\/strong><\/td>\n<td>Seitenaufrufe, Verweildauer, Klickrate, Anmeldungen; KPIs: Conversion-Rate, Umsatz pro Kampagne<\/td>\n<td>Mustererkennung, <strong>Predictive Analytics<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>5. Optimierung<\/strong><\/td>\n<td>Überschriften/SEO nachschärfen, <strong>Content Recycling<\/strong>, Erfolgreiches verstärken<\/td>\n<td>alte Inhalte prüfen, defekte Links finden, UGC einbinden<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<table>\n<thead>\n<tr>\n<th>Media-Typ<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiele<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Owned<\/strong><\/td>\n<td>eigene Kanäle<\/td>\n<td>Website, Blog, Newsletter, Social-Profil<\/td>\n<\/tr>\n<tr>\n<td><strong>Paid<\/strong><\/td>\n<td>bezahlte Reichweite<\/td>\n<td>Social Ads, Google Ads, Influencer<\/td>\n<\/tr>\n<tr>\n<td><strong>Earned<\/strong><\/td>\n<td>verdiente Reichweite<\/td>\n<td>geteilte Inhalte, PR, Backlinks<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Distributions-Trends:<\/strong> Kurzvideos dominieren · Inhalte für AI Overviews strukturieren · WhatsApp-Newsletter wachsen stark · Zero-Click.<\/p>\n<h3>KI in der Content-Arbeit<\/h3>\n<ul>\n<li><strong>Tools:<\/strong> Text (ChatGPT, Claude, Gemini) · Bild (Midjourney, Canva AI, Adobe Firefly, ChatGPT, Gemini) · Video (Veo 3, Kling AI u. a.) · Audio (ElevenLabs)<\/li>\n<li><strong>KI als Co-Autor:<\/strong> Der Mensch gibt die Richtung vor und kontrolliert Tonalität, Fakten, Markenstimme.<\/li>\n<li><strong>Was KI nicht kann:<\/strong> echte Empathie und Authentizität, die Markenstimme wirklich verstehen, Verantwortung übernehmen → der <strong>„Human Touch“<\/strong> bleibt entscheidend.<\/li>\n<li><strong>Risiken:<\/strong> Masse statt Qualität, Vertrauensverlust durch austauschbare Texte, <strong>EU AI Act Art. 50:<\/strong> Die Transparenzpflichten gelten seit <strong>2. August 2026<\/strong> – u. a. Kennzeichnung von Deepfakes (realistisch wirkende KI-Bilder, -Videos, -Audio) und von KI-Texten zu Themen öffentlichen Interesses, sofern niemand redaktionell Verantwortung übernimmt. Die maschinenlesbare Markierung durch Anbieter älterer KI-Systeme wurde per Digital Omnibus auf den 2. Dezember 2026 verschoben. Urheberrecht bei KI-Bildern ungeklärt.<\/li>\n<\/ul>\n<h3>Content für die Funnel-Phasen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Ziel<\/th>\n<th>Formate<\/th>\n<th>Messung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>TOFU<\/strong><\/td>\n<td>Aufmerksamkeit, Reichweite<\/td>\n<td>„Was ist …?“-Artikel, Reels/TikTok, Infografiken, Erklärvideos, Inhalte für KI-Antworten<\/td>\n<td>Reichweite, Impressionen, Klicks<\/td>\n<\/tr>\n<tr>\n<td><strong>MOFU<\/strong><\/td>\n<td>Interesse, Vertrauen<\/td>\n<td>Newsletter mit Mehrwert, Whitepaper, Webinare, Vergleiche, Case Studies<\/td>\n<td>Leads, Anmeldungen, Engagement<\/td>\n<\/tr>\n<tr>\n<td><strong>BOFU<\/strong><\/td>\n<td>Kaufentscheidung<\/td>\n<td>Produktseiten, Demos/Trials, Rabatte, Bewertungen, Retargeting (Warenkorb-Erinnerung)<\/td>\n<td>Conversion-Rate, Umsatz, Wiederkäufe<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Merksatz:<\/strong> „TOFU holt die Leute ab – MOFU hält sie fest – BOFU bringt den Kauf.“<\/p>\n<\/blockquote>\n<p><strong>Datengetriebene Strategie:<\/strong> Entscheidungen nach Suchvolumen, Engagement- und Conversion-Daten statt Bauchgefühl. KI hilft bei Ideen, Planung, Erstellung, Analyse und Optimierung („Titel kürzen“, „FAQ hinzufügen“).<\/p>\n<p><strong>Ausblick:<\/strong> Content-Marketing wird zu <strong>GEO<\/strong> · Kurzvideo bleibt Leitmedium · Audio, AR/VR, interaktive Formate (Quiz, Konfiguratoren) · synthetischer Content mit menschlicher Kontrolle · First-Party-Daten aus dem CRM gewinnen an Wert, weil Tracking-Cookies verschwinden.<\/p>\n<hr />\n<h2>2 · Formate &amp; Ziele – datengetriebene Formatwahl<\/h2>\n<h3>Format, Kanal, Inhaltstyp<\/h3>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<th>Beispiel<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Kanal<\/strong><\/td>\n<td>Plattform, auf der veröffentlicht wird<\/td>\n<td>Instagram<\/td>\n<\/tr>\n<tr>\n<td><strong>Format<\/strong><\/td>\n<td>wie der Inhalt gestaltet ist<\/td>\n<td>Kurzvideo / Reel<\/td>\n<\/tr>\n<tr>\n<td><strong>Inhaltstyp<\/strong><\/td>\n<td>Zweck oder Thema<\/td>\n<td>„3 Styling-Tipps für den Sommer“<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Warum Formate wichtig sind:<\/strong> Reichweite (Plattformen bevorzugen bestimmte Formate) · Verständlichkeit · Zielgruppenorientierung (Jüngere → Kurzvideo; Berufstätige → Podcast, Newsletter; Shop-Käufer → Bilder, Bewertungen) · Kanalpassung (Whitepaper auf LinkedIn, nicht auf TikTok).<\/p>\n<table>\n<thead>\n<tr>\n<th>Formatgruppe<\/th>\n<th>Beispiele<\/th>\n<th>Vorteil<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Text &amp; Artikel<\/td>\n<td>Blog, Ratgeber, Produkttexte, FAQs<\/td>\n<td>SEO/GEO-relevant<\/td>\n<\/tr>\n<tr>\n<td>Visuell<\/td>\n<td>Produktbilder, Infografiken<\/td>\n<td>schnell erfassbar, Conversion<\/td>\n<\/tr>\n<tr>\n<td>Audio &amp; Video<\/td>\n<td>Podcasts, Tutorials, Kurzvideos<\/td>\n<td>Storytelling, Nähe<\/td>\n<\/tr>\n<tr>\n<td>Interaktiv<\/td>\n<td>Quiz, Konfiguratoren, AR-Filter<\/td>\n<td>Engagement, Personalisierung<\/td>\n<\/tr>\n<tr>\n<td><strong>UGC<\/strong><\/td>\n<td>Bewertungen, Erfahrungsberichte<\/td>\n<td>Vertrauen, Social Proof<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Typische Fehler bei Zielen:<\/strong> alles gleichzeitig wollen · nicht messbar formulieren („mehr Sichtbarkeit“ statt „+30 % organischer Traffic in 6 Monaten“) · falsche Kennzahlen (Likes ≠ Umsatz).<\/p>\n<h3>Datenquellen für die Formatwahl<\/h3>\n<table>\n<thead>\n<tr>\n<th>Quelle<\/th>\n<th>Was sie zeigt<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>SEO/GEO-Daten (Search Console, Sistrix)<\/td>\n<td>Suchvolumen, Fragen, Keywords<\/td>\n<\/tr>\n<tr>\n<td>Social Insights (TikTok Creative Center, Instagram Insights)<\/td>\n<td>Engagement, boomende Formate<\/td>\n<\/tr>\n<tr>\n<td>CRM &amp; E-Mail<\/td>\n<td>Öffnungs-/Klickraten, Formate mit Käufen<\/td>\n<\/tr>\n<tr>\n<td>Shop- &amp; Conversion-Daten<\/td>\n<td>Warenkorbabbrüche, Verweildauer, Klickpfade<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Daten steuern die Wahl:<\/strong> viele Suchanfragen → Artikel/FAQ · hohe Interaktion bei Kurzvideos → Reels · viele Support-Anfragen → Tutorial-Video · Newsletter mit Video-Thumbnail doppelt so oft geklickt → Video.\n<strong>Fallstricke:<\/strong> Datenflut ohne Nutzung · falsche Kennzahlen · Daten zeigen <em>was<\/em>, nicht <em>warum<\/em>.<\/p>\n<p><strong>Beispiel GesundLeben Shop:<\/strong> viele Suchen nach „Immunsystem stärken“ (YMYL beachten!) + gut laufende Reels → TOFU Blogartikel „10 Tipps fürs Immunsystem“, MOFU Reel „3 Tipps mit Produkten aus dem Shop“, BOFU Bewertungsvideo zu Vitaminpräparaten.<\/p>\n<p><strong>KI bei der Formatwahl:<\/strong> Ideen, Redaktionskalender mit Kanälen und Zeitpunkten, Formatempfehlung aus historischen Daten, Muster („Videos bringen doppelt so viele Klicks“).\n<em>Praxisbeispiele:<\/em> Smartconsulting – Infografik-Posts auf LinkedIn doppelt so viel Engagement · Hoffmanns Modehaus – Trend „Sommerfarben 2027“ → Reels statt Blog · GesundLeben – Video-Vorschaubild = 40 % mehr Newsletter-Klicks.<\/p>\n<p><strong>Trends:<\/strong> Kurzvideo &amp; Snack-Content · KI-Antworten als Gatekeeper (GEO) · WhatsApp-Newsletter &amp; Direct Messaging · UGC als Conversion-Treiber · AR/VR in Mode und Möbeln.<\/p>\n<hr />\n<h2>3 · Content-Tools<\/h2>\n<h3>Text- &amp; Wissens-Tools<\/h3>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Stärke<\/th>\n<th>Grenze<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>ChatGPT<\/td>\n<td>vielseitig (Blog, Social, SEO, E-Mail), schnell<\/td>\n<td>Fakten und Aktualität prüfen<\/td>\n<\/tr>\n<tr>\n<td>Google Gemini<\/td>\n<td>Zugriff auf Google-Suche, aktuelle Zahlen/Trends<\/td>\n<td>aktuelle Info ≠ automatisch korrekt<\/td>\n<\/tr>\n<tr>\n<td>Perplexity<\/td>\n<td>Recherche <strong>mit Quellenangaben<\/strong><\/td>\n<td>Quellenqualität prüfen; weniger für ganze Formate<\/td>\n<\/tr>\n<tr>\n<td>Claude<\/td>\n<td>lange Texte, „sanfter“ Stil<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>Mistral Vibe<\/td>\n<td>europäisch, Open-Source-Ansätze<\/td>\n<td>–<\/td>\n<\/tr>\n<tr>\n<td>DeepL Write<\/td>\n<td>Textqualität &amp; Übersetzung<\/td>\n<td>–<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Whitepaper-Empfehlung aus der Tutoriumslösung:<\/em> Recherche mit Perplexity, Ausformulierung mit ChatGPT.<\/p>\n<h3>Visuelle Tools<\/h3>\n<ul>\n<li><strong>Canva:<\/strong> Allrounder mit Templates und KI, einsteigerfreundlich<\/li>\n<li><strong>Piktochart:<\/strong> Infografiken, Reports, Datenvisualisierung<\/li>\n<li><strong>KI-Bildgeneratoren:<\/strong> ChatGPT, Gemini, Midjourney<\/li>\n<li><strong>Grenzen:<\/strong> Authentizität (nicht existierende Situationen), veränderte Produktdetails, passt nicht automatisch zum Corporate Design, Nachbearbeitung nötig, Nutzungsrechte klären.<\/li>\n<\/ul>\n<h3>Adobe Creative Cloud &amp; kostenlose Alternativen<\/h3>\n<table>\n<thead>\n<tr>\n<th>Adobe-Tool<\/th>\n<th>Profi-Standard für<\/th>\n<th>Kostenlose Alternativen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Photoshop<\/strong><\/td>\n<td>Bildbearbeitung, Retusche, Freistellen, Composings<\/td>\n<td>GIMP, Pixlr, Fotor, Canva<\/td>\n<\/tr>\n<tr>\n<td><strong>Premiere Pro<\/strong><\/td>\n<td>Videoschnitt &amp; Postproduktion<\/td>\n<td>DaVinci Resolve, CapCut, Shotcut, Gemini (Veo 3), Canva Video<\/td>\n<\/tr>\n<tr>\n<td><strong>Illustrator<\/strong><\/td>\n<td>Vektorgrafiken (Logos, Icons) – verlustfrei skalierbar<\/td>\n<td>Inkscape, Vectr, Canva<\/td>\n<\/tr>\n<tr>\n<td><strong>InDesign<\/strong><\/td>\n<td>Layout &amp; mehrseitiges Publishing<\/td>\n<td>Scribus, Canva, Google Docs/Slides<\/td>\n<\/tr>\n<tr>\n<td><strong>After Effects<\/strong><\/td>\n<td>Animation &amp; Motion Graphics<\/td>\n<td>Blender, Canva<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Fazit:<\/strong> Nicht das „beste“ Tool zählt, sondern das passende für Aufgabe und Qualitätsanspruch. Für Social Media reichen oft Canva, CapCut oder Veo 3; Adobe lohnt sich für High-End-Branding und komplexe Projekte.<\/p>\n<\/blockquote>\n<hr />\n<h2>Glossar<\/h2>\n<table>\n<thead>\n<tr>\n<th>Begriff<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Content Recycling<\/td>\n<td>alte Inhalte aktualisieren und neu ausspielen<\/td>\n<\/tr>\n<tr>\n<td>UGC<\/td>\n<td>User-Generated Content – Inhalte von Kund:innen<\/td>\n<\/tr>\n<tr>\n<td>Predictive Analytics<\/td>\n<td>Prognose, welche Themen/Formate künftig wirken<\/td>\n<\/tr>\n<tr>\n<td>Owned / Paid / Earned Media<\/td>\n<td>eigene / bezahlte / verdiente Reichweite<\/td>\n<\/tr>\n<tr>\n<td>KPI<\/td>\n<td>Key Performance Indicator – Leistungskennzahl<\/td>\n<\/tr>\n<tr>\n<td>YMYL<\/td>\n<td>„Your Money or Your Life“ – sensible Themen wie Gesundheit, Finanzen<\/td>\n<\/tr>\n<tr>\n<td>Vektorgrafik<\/td>\n<td>aus berechneten Linien und Formen, verlustfrei skalierbar<\/td>\n<\/tr>\n<tr>\n<td>First-Party-Daten<\/td>\n<td>eigene Kundendaten, z. B. aus dem CRM<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<h2>Typische Tutoriumsaufgaben (je 2 von 3 Pflicht)<\/h2>\n<ul>\n<li>Die 5 Prozessphasen für ein Beispielunternehmen mit Aktivität und KI-Unterstützung füllen<\/li>\n<li>Drei Ziele von Content-Marketing für E-Commerce begründen und Formate zuordnen (Reichweite = TOFU, Vertrauen = MOFU, Conversion = BOFU)<\/li>\n<li>Je zwei Chancen und Risiken der KI und wie man sie ausbalanciert (KI-Richtlinien, Style-Guide, First-Party-Daten)<\/li>\n<li>Drei Formate nach Stärke, Schwäche und Kanal vergleichen<\/li>\n<li>Datengetriebene Formatwahl mit KI am Beispiel (z. B. EcoBeauty) – inkl. Grenzen: Klicks ≠ Umsatz, Daten zeigen nicht das Warum<\/li>\n<li>Text-Tools, Bildgeneratoren und Adobe vs. Alternativen vergleichen<\/li>\n<\/ul>\n<hr />\n<h2>Selbsttest<\/h2>\n<ol>\n<li><strong>Wie unterscheidet sich Content-Marketing von klassischer Werbung?<\/strong>\n   → Es liefert Mehrwert (nützlich, informativ, unterhaltsam), damit Menschen freiwillig wiederkommen – statt direkt zum Kauf aufzufordern.<\/li>\n<li><strong>Nenne die fünf Phasen des Content-Prozesses.<\/strong>\n   → Planung, Erstellung, Distribution, Analyse, Optimierung.<\/li>\n<li><strong>Was ist der Unterschied zwischen Format und Kanal?<\/strong>\n   → Format = Gestaltung (z. B. Reel), Kanal = Plattform (z. B. Instagram).<\/li>\n<li><strong>Was ist Earned Media?<\/strong>\n   → Verdiente Reichweite durch Dritte: geteilte Inhalte, PR, Backlinks.<\/li>\n<li><strong>Ab wann gilt die Kennzeichnungspflicht nach EU AI Act Art. 50?<\/strong>\n   → Ab dem 2. August 2026.<\/li>\n<li><strong>Welche drei Dinge kann KI laut Vorlesung nicht?<\/strong>\n   → Echte Empathie/Authentizität, die Markenstimme wirklich verstehen, Verantwortung übernehmen.<\/li>\n<li><strong>Was ist an „mehr Sichtbarkeit“ als Ziel falsch?<\/strong>\n   → Es ist nicht messbar; besser z. B. „+30 % organischer Traffic in 6 Monaten“.<\/li>\n<li><strong>Welche Formate passen in den BOFU?<\/strong>\n   → Produktseiten, Bewertungen/Testimonials, Demos/Trials, zeitlich begrenzte Angebote, Warenkorb-Erinnerungen.<\/li>\n<li><strong>Welches Tool eignet sich für Recherche mit Quellen?<\/strong>\n   → Perplexity.<\/li>\n<li><strong>Nenne je eine kostenlose Alternative zu Photoshop, Premiere Pro und Illustrator.<\/strong>\n    → z. B. GIMP, DaVinci Resolve, Inkscape.<\/li>\n<\/ol>"}, {"id": "crm", "title": "Smart CRM (B2B & B2C)", "course": "MKT-E233 (1–6)", "html": "<p><strong>Modul:<\/strong> MKT-E233 (Einheiten 1–6) · <strong>Grundlage:<\/strong> 6 Vorlesungen, 6 Tutorien-Aufgabenblätter und 6 ausgearbeitete Tutoriumslösungen in diesem Ordner<\/p>\n<table>\n<thead>\n<tr>\n<th>Einheit<\/th>\n<th>Thema<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Relevanz von CRM im datengetriebenen Marketing<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Vom CRM zum Kunden: Passender Content über alle Kanäle mit KI<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>CRM-Personalisierung mit KI: B2B vs. B2C<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>CRM-Systeme im Vergleich: KI-Funktionen &amp; Automation<\/td>\n<\/tr>\n<tr>\n<td>5<\/td>\n<td>Von der Leadsteuerung zur automatisierten Customer Journey<\/td>\n<\/tr>\n<tr>\n<td>6<\/td>\n<td>KI-gestütztes CRM – Brücke zwischen Marketing und Vertrieb<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Der rote Faden:<\/strong> Das CRM ist das „digitale Gedächtnis“ und das Herzstück des Marketing-Ökosystems. Es bündelt First-Party-Daten, ermöglicht Segmentierung, Personalisierung und Automatisierung und verbindet Marketing, Vertrieb und Service. KI macht es vom Datenspeicher zum Steuerzentrum – aber nur so gut wie die Daten: <strong>„Garbage in – Garbage out“<\/strong>.<\/p>\n<hr />\n<h2>1 · CRM-Grundlagen<\/h2>\n<p><strong>CRM = Customer Relationship Management.<\/strong> Software, die alle Informationen über Kund:innen und Interessent:innen zentral bündelt:\n- <strong>Stammdaten<\/strong> (Name, Adresse, E-Mail, Telefon)\n- <strong>Interaktionen<\/strong> (E-Mails, Anrufe, Meetings, Chats)\n- <strong>Transaktionen<\/strong> (Bestellungen, Rechnungen, Verträge)\n- <strong>Supportfälle<\/strong> (Tickets, Reklamationen)<\/p>\n<p><strong>Nutzen:<\/strong> Marketing, Vertrieb und Service arbeiten auf derselben Datenbasis – keine <strong>Datensilos<\/strong> mehr.<\/p>\n<p><strong>First-Party- vs. Third-Party-Daten:<\/strong> Third-Party-Cookies verlieren an Bedeutung (Cookieless Future, DSGVO). Eigene Daten direkt von Kund:innen werden zum Schlüssel, und das CRM ist ihre zentrale Plattform. KI kann nur so gut sein wie diese Datenbasis.<\/p>\n<h3>CRM vs. Excel (Tutoriumslösung)<\/h3>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>Excel<\/th>\n<th>CRM (z. B. Bitrix24, Brevo)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Stärken<\/td>\n<td>kostenlos, keine Einarbeitung, ok für sehr kleine Daten<\/td>\n<td>zentrale Datenbasis, Automatisierung &amp; KI, 360°-Historie, Zusammenarbeit<\/td>\n<\/tr>\n<tr>\n<td>Grenzen<\/td>\n<td>Dubletten, keine Automatisierung, keine Timeline, DSGVO-Risiko<\/td>\n<td>Skalierungskosten, Setup-/Schulungsaufwand, Qualität hängt an der Pflege<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Empfehlung für Start-ups:<\/em> früh ein günstiges CRM (z. B. Brevo) statt Excel – strukturierte First-Party-Daten und DSGVO-Konformität ab Tag 1.<\/p>\n<h3>Datenquellen &amp; Segmentierung<\/h3>\n<p><strong>Quellen:<\/strong> Website-Formulare · Online-Shop (Bestellungen, Warenkorbabbrüche, Retouren) · E-Mail (Klicks, Öffnungen, Abmeldungen) · Social Lead-Ads · Support &amp; Chatbots · Events &amp; Webinare.<\/p>\n<p><strong>Segmentieren<\/strong> nach Verhalten, Demografie oder Interessen – z. B. „aktive“ vs. „schlafende“ Kund:innen; B2B nach Branche, Größe, Entscheider:innen; B2C nach Kaufverhalten und Frequenz. <strong>Dynamische Segmente<\/strong> aktualisieren sich selbst (z. B. „Newsletter geöffnet, aber nicht geklickt“).<\/p>\n<h3>CRM-KPIs<\/h3>\n<table>\n<thead>\n<tr>\n<th>KPI<\/th>\n<th>Bedeutung<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CLV<\/strong> – Customer Lifetime Value<\/td>\n<td>Wert einer Kundin über die gesamte Beziehung<\/td>\n<\/tr>\n<tr>\n<td><strong>Conversion Rate<\/strong><\/td>\n<td>Anteil Leads, die zu Kund:innen werden<\/td>\n<\/tr>\n<tr>\n<td><strong>Retention / Churn Rate<\/strong><\/td>\n<td>Anteil, der bleibt / abwandert<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Datenqualität &amp; DSGVO:<\/strong> Dubletten vermeiden, Daten aktuell halten, Einwilligungen dokumentieren, Datenherkunft transparent machen, Löschroutinen.<\/p>\n<hr />\n<h2>2 · KI im CRM<\/h2>\n<table>\n<thead>\n<tr>\n<th>Funktion<\/th>\n<th>Was sie leistet<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Lead-Scoring &amp; Priorisierung<\/strong><\/td>\n<td>bewertet Kaufwahrscheinlichkeit (Hot/Warm/Cold)<\/td>\n<\/tr>\n<tr>\n<td><strong>Predictive Analytics<\/strong><\/td>\n<td>Wer kauft bald? Wer springt ab (<strong>Churn<\/strong>)? Umsatzprognosen<\/td>\n<\/tr>\n<tr>\n<td><strong>Content- &amp; Textgenerierung<\/strong><\/td>\n<td>Betreffzeilen, personalisierte Nachrichten, Chatbots<\/td>\n<\/tr>\n<tr>\n<td><strong>Kampagnenoptimierung<\/strong><\/td>\n<td>testet Betreffzeilen, Versandzeiten, Zielgruppen<\/td>\n<\/tr>\n<tr>\n<td><strong>Next Best Action / Offer<\/strong><\/td>\n<td>empfiehlt den nächsten passenden Schritt oder das Angebot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Bitrix24 CoPilot:<\/strong> integrierter KI-Assistent für E-Mails, Zusammenfassungen, Aufgaben, Workflows, Vertriebsskripte; neu mit „Reasoning“-Funktion, die CRM-Felder selbstständig befüllt.<\/p>\n<table>\n<thead>\n<tr>\n<th>Chancen<\/th>\n<th>Risiken<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Effizienz, mehr Zeit für Strategie<\/td>\n<td><strong>Over-Automation<\/strong> – Kommunikation wirkt künstlich<\/td>\n<\/tr>\n<tr>\n<td>Bessere Personalisierung<\/td>\n<td><strong>Bias &amp; Fehler<\/strong> bei schlechten Daten<\/td>\n<\/tr>\n<tr>\n<td>Skalierung auf Tausende Kontakte<\/td>\n<td>DSGVO: Transparenz und Einwilligung nötig<\/td>\n<\/tr>\n<tr>\n<td>Wettbewerbsvorteil<\/td>\n<td>Empathie und Kontextgefühl bleiben menschlich<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Risiken minimieren:<\/strong> Data Hygiene · DSGVO &amp; Governance · <strong>Human-in-the-Loop<\/strong> (KI als Co-Pilot, Freigaben beim Menschen).<\/p>\n<hr />\n<h2>3 · CRM als Zentrum des Omnichannel-Marketings<\/h2>\n<table>\n<thead>\n<tr>\n<th>Kanal<\/th>\n<th>Rolle<\/th>\n<th>CRM-Integration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>E-Mail &amp; Newsletter<\/td>\n<td>wichtigster Personalisierungskanal, hoher ROI<\/td>\n<td>Trigger-Mails, Segmente als Empfängerlisten<\/td>\n<\/tr>\n<tr>\n<td>Social Ads<\/td>\n<td>Retargeting, Zielgruppenaufbau<\/td>\n<td>CRM-Segmente als <strong>Custom Audiences<\/strong>, <strong>Lookalikes<\/strong> ⚠️ DSGVO-kritisch<\/td>\n<\/tr>\n<tr>\n<td>Website &amp; Landingpages<\/td>\n<td>wichtigste Datenquelle<\/td>\n<td>Formulare erzeugen Leads automatisch<\/td>\n<\/tr>\n<tr>\n<td>Service &amp; Support<\/td>\n<td>Bindung durch positive Erlebnisse<\/td>\n<td>Tickets, Chatbots, Contact Center im Kundendatensatz<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<blockquote>\n<p><strong>Omnichannel ≠ Multichannel:<\/strong> Multichannel = viele Kanäle, getrennt. Omnichannel = alle Kanäle greifen auf eine gemeinsame Datenbasis zu – „eine Stimme“ zum Kunden.<\/p>\n<\/blockquote>\n<p><strong>Grenzen der Personalisierung:<\/strong> Overload (zu viel wirkt künstlich) · Datenqualität (falsche Namen, doppelter Versand) · nur mit Einwilligung.<\/p>\n<h3>Best Practices<\/h3>\n<table>\n<thead>\n<tr>\n<th>Case<\/th>\n<th>Journey<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Warenkorbabbruch (B2C)<\/strong><\/td>\n<td>Trigger → Mail nach 1 Std. → Rabatt nach 24 Std. → optional Retargeting-Ad → nach Kauf Empfehlungen<\/td>\n<\/tr>\n<tr>\n<td><strong>Whitepaper-Download (B2B)<\/strong><\/td>\n<td>Trigger → Dankes-Mail → Webinar-/Demo-Einladung → Übergabe an Vertrieb → Onboarding-Serie<\/td>\n<\/tr>\n<tr>\n<td><strong>Inaktive Abonnent:innen<\/strong><\/td>\n<td>Reaktivierungs-Mail → Social Ad (Custom Audience) → Chatbot-Nachricht beim nächsten Besuch<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Erfolgsfaktoren:<\/strong> Datenqualität · Relevanz zum Kaufstatus · Timing · Balance aus Automatisierung und persönlicher Ansprache.<\/p>\n<hr />\n<h2>4 · B2B vs. B2C<\/h2>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>B2B<\/th>\n<th>B2C<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Entscheidung<\/td>\n<td>mehrere Personen (<strong>Buying Center<\/strong>), lang, rational<\/td>\n<td>Einzelperson, schnell, oft emotional<\/td>\n<\/tr>\n<tr>\n<td>Fokus<\/td>\n<td>ROI, Effizienz, Sicherheit, Partnerschaft<\/td>\n<td>Preis, Emotion, Erlebnis, Marke<\/td>\n<\/tr>\n<tr>\n<td>CRM-Datenmodell<\/td>\n<td>Accounts mit mehreren Kontakten, Deals<\/td>\n<td>Einzelpersonen mit Transaktionen<\/td>\n<\/tr>\n<tr>\n<td>Personalisierung<\/td>\n<td>nach Rolle im Buying Center<\/td>\n<td>nach Verhalten, Kaufhistorie<\/td>\n<\/tr>\n<tr>\n<td>Typische KI<\/td>\n<td>Lead-Scoring, Opportunity-/Deal-Prognosen, ABM<\/td>\n<td>Produktempfehlungen, Churn-Prediction, Dynamic Content, Versandzeit<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>⚠️ Tendenzen, keine Gesetze – Autokauf oder Urlaubsbuchung sind B2C mit langen Entscheidungen.<\/p>\n<h3>Drei Stufen der Personalisierung<\/h3>\n<ol>\n<li><strong>Statisch:<\/strong> Platzhalter („Sehr geehrter Herr Müller“)<\/li>\n<li><strong>Dynamisch (regelbasiert):<\/strong> Inhalte nach Segment/Verhalten<\/li>\n<li><strong>Prädiktiv (KI):<\/strong> Wer kauft? Welcher Inhalt? Wann?<\/li>\n<\/ol>\n<p><strong>B2B-Anwendungsfelder:<\/strong> Lead-Scoring · Predictive Analytics für Deals · Content je Rolle (CFO bekommt Case Study, Technik bekommt Spezifikationen) · lange Nurturing-Ketten (Whitepaper → Webinar → Beratung → Angebot) · <strong>Account-Based Marketing<\/strong> (Personalisierung auf Firmenebene).\n<strong>B2C-Anwendungsfelder:<\/strong> automatisierte Segmentierung · Reaktivierung · Next Best Offer · Dynamic Content · Timing.<\/p>\n<p><strong>Grenzen:<\/strong> Datenqualität · DSGVO · fortgeschrittene KI meist nur in teuren Tarifen · Abteilungssilos.\n<em>Praxis-Learning aus dem Tutorium:<\/em> Segmente über Freitext-Jobtitel sind fehleranfällig (Suche nach „IT“ trifft „Einkaufsleitung“) – besser ein eigenes Feld „Rolle im Buying Center“.<\/p>\n<hr />\n<h2>5 · CRM-Systeme im Vergleich<\/h2>\n<h3>6 Vergleichsdimensionen<\/h3>\n<p>Benutzerfreundlichkeit · KI-Funktionen · Automatisierung · Integrationen &amp; Ökosystem · Kosten &amp; Skalierbarkeit · Datenschutz &amp; DSGVO (Datenstandort EU vs. USA).<\/p>\n<table>\n<thead>\n<tr>\n<th>Tool<\/th>\n<th>Zielgruppe<\/th>\n<th>Stärken<\/th>\n<th>Kosten / Besonderheit<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Salesforce<\/strong><\/td>\n<td>Konzerne<\/td>\n<td>Marktführer, „Einstein AI“, riesiges Ökosystem<\/td>\n<td>sehr teuer, hoher Implementierungsaufwand<\/td>\n<\/tr>\n<tr>\n<td><strong>HubSpot<\/strong><\/td>\n<td>KMU, Start-ups<\/td>\n<td>einfach, starkes Inbound-Marketing<\/td>\n<td>Free-Einstieg, wird <strong>schnell teuer<\/strong><\/td>\n<\/tr>\n<tr>\n<td><strong>Microsoft Dynamics 365<\/strong><\/td>\n<td>Mittelstand, Konzerne<\/td>\n<td>Copilot, Microsoft-Integration<\/td>\n<td>mittel–hoch, komplex<\/td>\n<\/tr>\n<tr>\n<td><strong>SAP CRM / CX<\/strong><\/td>\n<td>Großunternehmen<\/td>\n<td>ERP-Integration<\/td>\n<td>hochpreisig<\/td>\n<\/tr>\n<tr>\n<td><strong>Bitrix24<\/strong><\/td>\n<td>KMU, E-Commerce<\/td>\n<td>All-in-One, CoPilot, Call-Scoring, No-Code-Workflows<\/td>\n<td>fair, aber komplex in der Einrichtung<\/td>\n<\/tr>\n<tr>\n<td><strong>Brevo<\/strong><\/td>\n<td>KMU, E-Commerce<\/td>\n<td>E-Mail &amp; SMS, Versandzeit-Optimierung, <strong>EU-Server<\/strong><\/td>\n<td>günstig; KI eher grundlegend<\/td>\n<\/tr>\n<tr>\n<td><strong>Zoho CRM<\/strong><\/td>\n<td>KMU<\/td>\n<td>Preis-Leistung, modular<\/td>\n<td>eher günstig<\/td>\n<\/tr>\n<tr>\n<td><strong>Pipedrive<\/strong><\/td>\n<td>Vertriebsteams<\/td>\n<td>Pipeline-Fokus, Deal-Forecasting<\/td>\n<td>mittel; wenig Marketing-Automation<\/td>\n<\/tr>\n<tr>\n<td><strong>SugarAI<\/strong> (ehem. SugarCRM)<\/td>\n<td>Mittelstand<\/td>\n<td>flexibel, anpassbar<\/td>\n<td>mittel<\/td>\n<\/tr>\n<tr>\n<td><strong>CAS Software<\/strong><\/td>\n<td>Mittelstand<\/td>\n<td>„Made in Germany“, DSGVO-Fokus<\/td>\n<td>mittel<\/td>\n<\/tr>\n<tr>\n<td><strong>ActiveCampaign<\/strong>, <strong>Zendesk<\/strong>, <strong>Act!<\/strong><\/td>\n<td>KMU / Service<\/td>\n<td>Automation / Support / Kontaktmanagement<\/td>\n<td>–<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Herausforderungen bei der Einführung:<\/strong> Datenqualität · Komplexität (Salesforce, Dynamics für KMU oft zu viel) · <strong>Kostenfallen<\/strong> · Abteilungssilos · Datenstandort.\n<strong>Auswahlkriterien:<\/strong> Passung zur Größe · Funktionsumfang vs. Bedarf · Bedienbarkeit (Tipp: Live-Demo mit Endnutzer:innen) · Integrationen (Shopify, WooCommerce, Ads) · planbares Preismodell · EU-Hosting.<\/p>\n<p><em>Tutoriumsfazit:<\/em> Für einen kleinen B2C-Shop mit Automatisierungsfokus spricht viel für <strong>Brevo<\/strong> (planbare Kosten, EU-Server, passende Journeys). HubSpot Free passt eher zu kleinem B2B (Accounts, Kontakte, Deals kostenlos), B2C-Automation ist dort kostenpflichtig.<\/p>\n<hr />\n<h2>6 · Leadsteuerung &amp; Customer Journey<\/h2>\n<p><strong>Lead<\/strong> = potenzielle:r Kund:in mit gezeigtem Interesse. <strong>Leadsteuerung<\/strong> = Leads systematisch erfassen, qualifizieren und entwickeln, bis sie vertriebsreif sind.<\/p>\n<p><strong>Lead-Prozess:<\/strong> Erfassen → Qualifizieren → Anreichern → Scoring → Übergabe an Vertrieb → Konversion zu Kund:in.<\/p>\n<table>\n<thead>\n<tr>\n<th><\/th>\n<th>MQL – Marketing Qualified Lead<\/th>\n<th>SQL – Sales Qualified Lead<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Wer qualifiziert<\/td>\n<td>Marketing<\/td>\n<td>Vertrieb<\/td>\n<\/tr>\n<tr>\n<td>Indikator<\/td>\n<td>Engagement &amp; demografischer Fit<\/td>\n<td>BANT erfüllt (Budget, Authority, Need, Timeline)<\/td>\n<\/tr>\n<tr>\n<td>Auslöser<\/td>\n<td>Formular, Download, Webinar<\/td>\n<td>positives Sales-Gespräch, Demo<\/td>\n<\/tr>\n<tr>\n<td>Nächster Schritt<\/td>\n<td><strong>Lead Nurturing<\/strong><\/td>\n<td>Angebot<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Lead Nurturing<\/strong> = Leads mit passendem Content entwickeln (Mails, Downloads, Webinare, Follow-ups).<\/p>\n<h3>Das 5A-Modell nach Kotler (Marketing 4.0)<\/h3>\n<table>\n<thead>\n<tr>\n<th>Phase<\/th>\n<th>Kund:in<\/th>\n<th>CRM-Maßnahmen<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Aware<\/strong><\/td>\n<td>erfährt von der Marke<\/td>\n<td>Lead Capture, Newsletter-Opt-in, erste Segmentierung<\/td>\n<\/tr>\n<tr>\n<td><strong>Appeal<\/strong><\/td>\n<td>fühlt sich angesprochen<\/td>\n<td>Willkommens-Mails, Produktinfos, Retargeting<\/td>\n<\/tr>\n<tr>
